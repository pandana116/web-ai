<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>body{margin:0;background:#10141c;color:#e8ecf5;font-family:system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}.c{background:#1a2030;border:1px solid #2b3448;border-radius:14px;padding:14px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #2b3448;background:#0e121a;color:inherit;width:100%;box-sizing:border-box;margin-top:8px}button{background:#6b8dff;border:0;font-weight:700;cursor:pointer}.x{background:#3a2330;width:auto;padding:6px 10px;font-size:12px}.s{color:#9aa6bf;font-size:13px}.big{font-size:34px;font-weight:800}.r{display:flex;align-items:center;gap:8px;font-size:13px}.r i{display:block;height:8px;background:#6b8dff;border-radius:4px}</style></head><body>
<h2>📊 Admin: Rajin Belajar</h2>
<div class="c" id="lg"><input id="k" type="password" placeholder="Kunci admin"><button onclick="muat()">Masuk</button><p class="s" id="e"></p></div><div id="o"></div>
<script>
const $=i=>document.getElementById(i);const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let K="";try{K=sessionStorage.getItem("ak")||""}catch(e){}
async function api(b){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:K,...b})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Gagal");return d}
async function muat(){if($("k").value)K=$("k").value;try{const d=await api({});try{sessionStorage.setItem("ak",K)}catch(e){}$("lg").style.display="none";const m=Math.max(1,...d.rating.dist);
$("o").innerHTML=`<div class="c"><div class="s">Pengguna terdaftar</div><div class="big">${d.akun}</div></div><div class="c"><div class="s">Rating rata-rata (${d.rating.n} penilai)</div><div class="big">⭐ ${d.rating.avg.toFixed(2)}</div>${[5,4,3,2,1].map(i=>`<div class="r">${i}★<i style="width:${d.rating.dist[i-1]/m*60}%"></i>${d.rating.dist[i-1]}</div>`).join("")}</div><div class="c"><b>💬 Saran terbaru</b>${d.saran.length?d.saran.map(s=>`<div style="border-top:1px solid #2b3448;padding:8px 0"><div class="s">${esc(s.n)} • ${s.ts?new Date(s.ts).toLocaleString("id-ID"):""}</div>${esc(s.t)}<br><button class="x" onclick="hapus('${esc(s.id)}')">Hapus</button></div>`).join(""):'<p class="s">Belum ada saran.</p>'}</div><div class="c"><b>🏆 Top 10 poin</b>${d.top.map((t,i)=>`<div class="r">${i+1}. ${esc(t.n)} — ${esc(t.p)}</div>`).join("")||'<p class="s">Belum ada.</p>'}</div><button onclick="muat()">🔄 Segarkan</button>`}catch(e){$("e").textContent=e.message;$("lg").style.display="block"}}
async function hapus(id){if(!confirm("Hapus saran ini?"))return;try{await api({op:"hapusSaran",id});muat()}catch(e){alert(e.message)}}
if(K)muat();
</script></body></html>
