<!DOCTYPE html>
<html lang="id" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rajin Belajar Jadi Pintar ✨</title>
<style>
:root {
  --bg: #05050a;
  --bg-2: #0f1020;
  --card: #12132b;
  --card-hov: #1a1b3d;
  --card-2: #1c1e45;
  --text: #f0f4ff;
  --text-2: #94a3c8;
  --accent-1: #6366f1;
  --accent-2: #ec4899;
  --accent-3: #22d3ee;
  --accent-4: #10b981;
  --accent-5: #f59e0b;
  --ok: #10b981;
  --no: #ef4444;
  --bd: rgba(99,102,241,0.2);
  --glow: 0 0 20px rgba(99,102,241,0.3), 0 0 40px rgba(236,72,153,0.15);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
html[data-theme="light"] {
  --bg: #f8fafc;
  --bg-2: #eef2ff;
  --card: #ffffff;
  --card-hov: #eef2ff;
  --card-2: #e0e7ff;
  --text: #1e293b;
  --text-2: #64748b;
  --bd: rgba(99,102,241,0.15);
  --glow: 0 4px 20px rgba(99,102,241,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  min-height:100vh;
  background: radial-gradient(circle at top right, var(--accent-1) 0%, transparent 40%),
              radial-gradient(circle at bottom left, var(--accent-2) 0%, transparent 40%),
              var(--bg);
  color:var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  line-height:1.6;
  padding-bottom: 100px;
}
main { max-width: 640px; margin: 0 auto; padding: 16px; }

/* === HEADER === */
.top-bar {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
  padding: 16px; background:var(--card); border-radius:20px; border:1px solid var(--bd);
  box-shadow:var(--shadow); backdrop-filter: blur(10px);
}
.avatar {
  width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  display:grid; place-items:center; font-size:24px; flex-shrink:0;
}
.user-info { flex:1; margin:0 12px; }
.user-info h1 { font-size:16px; font-weight:800; }
.user-info p { font-size:11px; color:var(--text-2); display:flex; gap:8px; margin-top:2px; }
.stat-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.badge {
  font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px;
  background:linear-gradient(90deg, rgba(99,102,241,0.2), rgba(236,72,153,0.2));
  color:#e0e7ff;
}
.badge.xp { background:linear-gradient(90deg, #f59e0b33, #eab30833); color:#fcd34d; }
.badge.coin { background:linear-gradient(90deg, #10b98133, #05966933); color:#6ee7b7; }
.badge.fire { background:linear-gradient(90deg, #ef444433, #f9731633); color:#fdba74; }
.theme-btn {
  width:40px; height:40px; border-radius:12px; border:0; background:var(--card-2); color:var(--text);
  font-size:18px; cursor:pointer; transition:0.2s;
}
.theme-btn:hover { transform:scale(1.1); }

/* === TABS NAVIGASI === */
.tabs {
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:20px;
  position:sticky; top:8px; z-index:100; padding:6px;
  background:rgba(18,19,43,0.8); border-radius:16px; border:1px solid var(--bd);
  backdrop-filter: blur(12px);
}
html[data-theme="light"] .tabs { background:rgba(255,255,255,0.85); }
.tabs button {
  background:transparent; border:0; color:var(--text-2); padding:10px 4px; border-radius:12px;
  font-size:11px; font-weight:700; cursor:pointer; transition:0.2s;
}
.tabs button span { display:block; font-size:18px; margin-bottom:2px; }
.tabs button.active {
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff; box-shadow:var(--glow);
}

/* === KARTU & KOMPONEN === */
.card {
  background:var(--card); border:1px solid var(--bd); border-radius:20px; padding:20px;
  margin-bottom:16px; box-shadow:var(--shadow); transition:0.3s;
}
.card:hover { border-color:rgba(99,102,241,0.4); transform:translateY(-2px); }
.card-title { font-size:15px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
button {
  font:inherit; cursor:pointer; border-radius:12px; border:1px solid transparent;
  padding:12px; font-weight:700; transition:0.2s;
}
button.primary {
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff; border:0; box-shadow:var(--glow);
}
button.primary:hover { transform:scale(1.02); }
button.secondary { background:var(--card-2); color:var(--text); border-color:var(--bd); }
button.secondary:hover { background:var(--card-hov); border-color:var(--accent-1); }
button.accent-3 { background:linear-gradient(135deg,#22d3ee,#0ea5e9); color:#fff; border:0; }
button.accent-4 { background:linear-gradient(135deg,#10b981,#059669); color:#fff; border:0; }
button.accent-5 { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; border:0; }
button.selected { border-color:var(--accent-1); background:rgba(99,102,241,0.15); color:#a5b4fc; }
input, select, textarea {
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--bd);
  background:var(--bg-2); color:var(--text); font:inherit; margin-bottom:12px;
}
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent-1); box-shadow:0 0 0 3px rgba(99,102,241,0.2); }
label { font-size:12px; font-weight:800; color:var(--text-2); display:block; margin:8px 0 4px; }

/* === PROGRES & BAR === */
.progress-bar { height:10px; background:var(--bg-2); border-radius:10px; overflow:hidden; margin:8px 0; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); border-radius:10px; transition:width 0.5s ease; }
.progress-fill.ok { background:linear-gradient(90deg,#10b981,#059669); }
.progress-fill.warn { background:linear-gradient(90deg,#f59e0b,#d97706); }

/* === CHAT TUTOR AI === */
.chat-box {
  height:380px; overflow-y:auto; background:var(--bg-2); border-radius:16px; padding:14px;
  margin-bottom:12px; border:1px solid var(--bd); display:flex; flex-direction:column; gap:10px;
}
.chat-bubble {
  max-width:82%; padding:12px 16px; border-radius:18px; font-size:13px; line-height:1.6; white-space:pre-wrap;
}
.chat-bubble.ai {
  background:var(--card-2); border-bottom-left-radius:6px; align-self:flex-start; border:1px solid var(--bd);
}
.chat-bubble.user {
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff; border-bottom-right-radius:6px; align-self:flex-end;
}
.chat-input-row { display:flex; gap:8px; }
.chat-input-row input { flex:1; margin:0; }

/* === RATING === */
.rating-stars { display:flex; gap:4px; font-size:28px; cursor:pointer; }
.rating-stars span { transition:0.2s; filter:grayscale(1); }
.rating-stars span.active { filter:none; animation:starPop 0.4s ease; }
@keyframes starPop { 0% { transform:scale(1.3); } 100% { transform:scale(1); } }

/* === STATISTIK & GRID === */
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-card {
  background:var(--card-2); border-radius:14px; padding:14px 10px; text-align:center;
}
.stat-card .num { font-size:22px; font-weight:900; }
.stat-card .lbl { font-size:10px; color:var(--text-2); margin-top:2px; }

/* === PENCAPAIAN === */
.achievement-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.achievement {
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--card-2); border-radius:12px; font-size:24px; border:2px solid transparent;
  transition:0.3s;
}
.achievement.unlocked { border-color:var(--accent-4); box-shadow:0 0 12px rgba(16,185,129,0.3); }
.achievement.locked { opacity:0.4; filter:grayscale(1); }
.achievement span { font-size:9px; margin-top:4px; color:var(--text-2); }

/* === TIMER FOKUS === */
.timer-display { font-size:64px; font-weight:900; text-align:center; font-variant-numeric:tabular-nums; }
.timer-controls { display:flex; justify-content:center; gap:10px; margin-top:16px; }

/* === FOOTER KREDIT === */
.credit-footer {
  text-align:center; padding:24px 16px; margin-top:30px; color:var(--text-2); font-size:11px; line-height:1.8;
  border-top:1px solid var(--bd);
}
.credit-footer b { color:var(--accent-1); }
.credit-footer .heart { color:#ec4899; }

/* === MODAL & TOAST === */
.modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:999; display:none; align-items:center; justify-content:center; padding:20px;
}
.modal.show { display:flex; }
.modal-content {
  background:var(--card); border-radius:20px; padding:24px; max-width:500px; width:100%; max-height:85vh; overflow-y:auto;
  border:1px solid var(--bd); box-shadow:var(--glow);
}
.toast {
  position:fixed; bottom:120px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--card); color:var(--text); padding:12px 24px; border-radius:14px;
  border:1px solid var(--accent-1); box-shadow:var(--glow); z-index:9999;
  opacity:0; transition:0.3s; font-weight:700;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* === RESPONSIVE === */
@media (max-width:420px) {
  .tabs button span { font-size:16px; }
  .tabs button { font-size:9px; padding:8px 2px; }
  .grid-4 { grid-template-columns:repeat(2,1fr); }
  .achievement-grid { grid-template-columns:repeat(4,1fr); }
}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"></div>

<script>
// ═══════════════════════════════════════════
// 🔑 KONFIGURASI AI — GANTI DENGAN MILIKMU!
// Dapatkan gratis di: https://console.groq.com/keys
// ═══════════════════════════════════════════
const GROQ_API_KEY = "gsk_YOUR_KEY_HERE"; // 👈 GANTI INI!
const AI_MODEL = "llama-3.3-70b-versatile";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

// ═══════════════════════════════════════════
// 💾 PENYIMPANAN DATA PENGGUNA
// ═══════════════════════════════════════════
const STORAGE_KEY = "rajin_pintar_v2";
const DEFAULT_STATE = {
  nama: "", password: "", avatar: "🦊", level: 1, xp: 0, xpNeeded: 100,
  coins: 50, streak: 1, lastActive: today(), totalMinutes: 0, focusMinutes: 0,
  soalDijawab: 0, benar: 0, salah: 0, rating: 0, ratingCount: 0,
  theme: "neon", sound: true, notif: true, tab: "belajar",
  chatHistory: [], achievements: [], dailyGoal: 30,
  settings: { grade: 8, subject: "Matematika", difficulty: "sedang", aiTone: "ramah" },
  focusSessions: [], lastRatingPrompt: null
};

let S = { ...DEFAULT_STATE };

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      S = { ...DEFAULT_STATE, ...parsed };
      // Cek streak harian
      const t = today();
      if (S.lastActive !== t) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        if (S.lastActive === `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`) {
          S.streak++;
        } else if (S.lastActive !== t) {
          S.streak = 1;
        }
        S.lastActive = t;
      }
    }
  } catch (e) { console.log("Load state:", e); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
}
function $id(id) { return document.getElementById(id); }
function esc(s) { return String(s||"").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function fmt(n) { return String(n||0).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function toast(msg, dur=2500) {
  const t = $id("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove("show"), dur);
}
function openModal(content) { $id("modal").innerHTML = `<div class="modal-content">${content}</div>`; $id("modal").classList.add("show"); }
function closeModal() { $id("modal").classList.remove("show"); }
function applyTheme() { document.documentElement.setAttribute("data-theme", S.theme); }

// ═══════════════════════════════════════════
// 🤖 FUNGSI AI — SUDAH JALAN!
// ═══════════════════════════════════════════
async function aiChat(messages) {
  if (!GROQ_API_KEY || GROQ_API_KEY.startsWith("gsk_YOUR")) {
    throw new Error("🔑 Silakan isi kunci API Groq di bagian atas kode!");
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${GROQ_API_KEY}`
    },
    body: JSON.stringify({
      model: AI_MODEL,
      messages: messages,
      temperature: 0.75
    })
  });
  if (!res.ok) throw new Error(`Koneksi gagal: ${res.status}`);
  const d = await res.json();
  return d.choices[0].message.content.trim();
}

async function aiJSON(prompt, systemPrompt) {
  const msgs = [];
  if (systemPrompt) msgs.push({ role: "system", content: systemPrompt });
  msgs.push({ role: "user", content: prompt });
  const text = await aiChat(msgs);
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b <= a) throw new Error("Format tidak valid");
  return JSON.parse(text.slice(a, b+1));
}

// ═══════════════════════════════════════════
// 🎵 EFEK SUARA
// ═══════════════════════════════════════════
let audioCtx = null;
function playSound(type) {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const c = audioCtx;
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    if (type === "ok") {
      o.frequency.setValueAtTime(523, c.currentTime);
      o.frequency.setValueAtTime(659, c.currentTime + 0.1);
      o.frequency.setValueAtTime(784, c.currentTime + 0.2);
    } else if (type === "no") {
      o.frequency.setValueAtTime(350, c.currentTime);
      o.frequency.setValueAtTime(250, c.currentTime + 0.15);
    } else if (type === "new") {
      o.frequency.setValueAtTime(440, c.currentTime);
      o.frequency.setValueAtTime(554, c.currentTime + 0.1);
      o.frequency.setValueAtTime(659, c.currentTime + 0.2);
    } else {
      o.frequency.value = 440;
    }
    g.gain.setValueAtTime(0.2, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
    o.start(c.currentTime); o.stop(c.currentTime + 0.4);
  } catch (e) {}
}

// ═══════════════════════════════════════════
// 🏆 PENCAPAIAN (8 Lencana)
// ═══════════════════════════════════════════
const ACHIEVEMENTS = [
  { id: "first_lesson", icon: "🌟", name: "Langkah Pertama", desc: "Selesaikan 1 soal", check: () => S.soalDijawab >= 1 },
  { id: "perfect_10", icon: "💯", name: "Sempurna", desc: "Benar 10 berturut-turut", check: () => S.benar >= 10 },
  { id: "streak_7", icon: "🔥", name: "Tak Tergoyahkan", desc: "Belajar 7 hari berturut", check: () => S.streak >= 7 },
  { id: "level_5", icon: "⭐", name: "Bintang 5", desc: "Capai Level 5", check: () => S.level >= 5 },
  { id: "focus_1h", icon: "⏳", name: "Fokus Penuh", desc: "Fokus total 60 menit", check: () => S.focusMinutes >= 60 },
  { id: "chat_10", icon: "💬", name: "Rasa Ingin Tahu", desc: "Tanya Tutor 10 kali", check: () => S.chatHistory.length >= 10 },
  { id: "quiz_50", icon: "🏅", name: "Juara Belajar", desc: "Selesaikan 50 soal", check: () => S.soalDijawab >= 50 },
  { id: "rated", icon: "❤️", name: "Pendukung Setia", desc: "Beri bintang penilaian", check: () => S.rating >= 4 }
];

function checkAchievements() {
  let newUnlock = false;
  for (const ach of ACHIEVEMENTS) {
    if (!S.achievements.includes(ach.id) && ach.check()) {
      S.achievements.push(ach.id);
      newUnlock = true;
      toast(`🏆 Lencana baru: ${ach.name}!`);
    }
  }
  if (newUnlock) saveState();
}

// ═══════════════════════════════════════════
// 📈 SISTEM XP & LEVEL
// ═══════════════════════════════════════════
function addXP(amount) {
  S.xp += amount;
  while (S.xp >= S.xpNeeded) {
    S.xp -= S.xpNeeded;
    S.level++;
    S.xpNeeded = Math.floor(S.xpNeeded * 1.3);
    S.coins += 10;
    playSound("new");
    toast(`🎉 Naik Level ${S.level}! +10 🪙`);
  }
  checkAchievements();
  saveState();
}

// ═══════════════════════════════════════════
// ⏱️ FOKUS TIMER
// ═══════════════════════════════════════════
let focusTimer = null, focusSec = 0, focusStart = null;
function startFocusTimer() {
  if (focusTimer) return;
  focusStart = Date.now();
  focusTimer = setInterval(() => {
    focusSec++;
    render();
    if (focusSec % 60 === 0) {
      S.focusMinutes++;
      S.totalMinutes++;
      addXP(1);
      saveState();
    }
  }, 1000);
}
function pauseFocusTimer() {
  clearInterval(focusTimer); focusTimer = null; render();
}
function resetFocusTimer() {
  pauseFocusTimer(); focusSec = 0; render();
}
function fmtTime(sec) {
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════
// 📝 SISTEM KUIS
// ═══════════════════════════════════════════
let quiz = { active: false, soal: [], idx: 0, skor: 0, total: 0, jawaban: [] };

async function startQuiz() {
  const subj = S.settings.subject;
  const gr = S.settings.grade;
  const diff = S.settings.difficulty;
  
  openModal(`
    <div style="text-align:center;padding:30px 20px">
      <div style="font-size:60px">🤖</div>
      <h3 style="margin:16px 0">AI sedang menyusun soal...</h3>
      <p style="color:var(--text-2)">${subj} • Kelas ${gr} • ${diff}</p>
      <div style="margin-top:20px">
        <div style="height:8px;background:var(--bg-2);border-radius:10px;overflow:hidden">
          <div style="width:60%;height:100%;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));border-radius:10px;animation:loading 1.5s infinite"></div>
        </div>
      </div>
      <button onclick="closeModal()" style="margin-top:24px;background:var(--card-2);border:0">Batal</button>
    </div>
  `);
  
  try {
    const data = await aiJSON(
      `Buatkan 5 soal ${subj} untuk siswa kelas ${gr} Indonesia, tingkat kesulitan ${diff}.
      Balas JSON saja tanpa penjelasan lain:
      {"soal":[
        {"q":"Pertanyaan?","a":"Opsi A","b":"Opsi B","c":"Opsi C","d":"Opsi D","kunci":0,"penjelasan":"Jawaban yang benar adalah..."}
      ]}
      Aturan: kunci=0 untuk A, 1=B, 2=C, 3=D. Bahasa Indonesia jelas.`,
      "Kamu pembuat soal pelajar Indonesia. Hanya balas JSON valid."
    );
    
    if (!data.soal || !data.soal.length) throw new Error("Data kosong");
    
    quiz = {
      active: true,
      soal: data.soal,
      idx: 0,
      skor: 0,
      total: data.soal.length,
      jawaban: []
    };
    closeModal();
    render();
  } catch (err) {
    closeModal();
    openModal(`
      <div style="text-align:center;padding:20px">
        <div style="font-size:50px">😕</div>
        <h3 style="margin:12px 0">Gagal membuat soal</h3>
        <p style="color:var(--text-2);margin-bottom:16px">${esc(err.message)}</p>
        <p style="font-size:12px;line-height:1.6">Pastikan kunci API Groq sudah diisi di bagian atas kode.<br>Dapatkan gratis di console.groq.com/keys</p>
        <button onclick="closeModal()" class="primary" style="width:100%;margin-top:16px">Mengerti</button>
      </div>
    `);
  }
}

function jawabSoal(pilihan) {
  if (!quiz.active) return;
  const soal = quiz.soal[quiz.idx];
  const benar = pilihan === soal.kunci;
  
  quiz.jawaban.push({ pilihan, benar });
  S.soalDijawab++;
  if (benar) {
    quiz.skor++;
    S.benar++;
    addXP(15);
    S.coins += 2;
    playSound("ok");
  } else {
    S.salah++;
    playSound("no");
  }
  saveState();
  checkAchievements();
  
  // Tampilkan hasil soal ini
  const huruf = ["A","B","C","D"];
  openModal(`
    <div style="text-align:center;padding:10px 0 20px">
      <div style="font-size:40px;margin-bottom:8px">${benar?"✅":"❌"}</div>
      <h3 style="color:${benar?"var(--ok)":"var(--no)"}">${benar?"Jawaban Benar!":"Belum Tepat"}</h3>
      <p style="margin:12px 0">Jawaban: <b>${huruf[soal.kunci]}</b></p>
      <div style="background:var(--bg-2);padding:12px;border-radius:12px;text-align:left;margin-bottom:16px">
        <b>📖 Penjelasan:</b><br>${esc(soal.penjelasan)}
      </div>
      <button onclick="lanjutSoal()" class="primary" style="width:100%">
        ${quiz.idx+1 < quiz.total ? "Soal Berikutnya →" : "🏁 Lihat Hasil"}
      </button>
    </div>
  `);
}

function lanjutSoal() {
  closeModal();
  quiz.idx++;
  if (quiz.idx >= quiz.total) {
    // Hasil akhir
    const persen = Math.round((quiz.skor/quiz.total)*100);
    const pesan = persen >= 80 ? "Luar biasa! 🌟" : persen >= 60 ? "Bagus! Teruslah Belajar 💪" : "Jangan menyerah! Semangat! 🔥";
    openModal(`
      <div style="text-align:center;padding:10px 0">
        <div style="font-size:50px;margin-bottom:8px">${persen>=80?"🏆":persen>=60?"👏":"💪"}</div>
        <h2 style="font-size:28px">${persen}%</h2>
        <p style="font-size:14px;color:var(--text-2)">${quiz.skor} dari ${quiz.total} benar</p>
        <p style="margin:16px 0;font-weight:700">${pesan}</p>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button onclick="closeModal();startQuiz()" class="primary" style="flex:1">🔄 Ulangi</button>
          <button onclick="closeModal();quiz.active=false;render()" class="secondary" style="flex:1">Kembali</button>
        </div>
      </div>
    `);
    
    // Minta rating setelah 3x main
    if (S.soalDijawab % 15 === 0 && (!S.lastRatingPrompt || S.lastRatingPrompt !== today())) {
      S.lastRatingPrompt = today();
      setTimeout(() => mintaRating(), 1500);
    }
  } else {
    render();
  }
}

function beriRating(bintang) {
  S.rating = bintang;
  S.ratingCount++;
  addXP(5);
  saveState();
  checkAchievements();
  toast(`Terima kasih! ${bintang} ⭐`);
  closeModal();
}

// 💬 TUTOR AI CHAT
// ═══════════════════════════════════════════
async function kirimPesan() {
  const el = document.getElementById("chatInput");
  const pesan = el.value.trim();
  if (!pesan) return;
  
  S.chatHistory.push({ role: "user", content: pesan });
  el.value = "";
  saveState();
  render();
  
  try {
    const res = await aiChat([
      { role: "system", content: `Kamu adalah Tutor Pintar — asisten belajar yang ramah, sabar, dan menyenangkan.
      Nama aplikasinya: Rajin Belajar Jadi Pintar. Dibuat oleh Pandana.
      Jawab dengan bahasa Indonesia yang mudah dipahami. Berikan penjelasan sederhana.
      Jika tidak tahu, jujur saja. Semangati pengguna untuk terus belajar!` },
      ...S.chatHistory
    ]);
    S.chatHistory.push({ role: "assistant", content: res });
    saveState();
    render();
    checkAchievements();
  } catch (err) {
    S.chatHistory.push({ role: "assistant", content: `😕 Maaf, ada kendala: ${err.message}` });
    saveState();
    render();
  }
}

function render() {

    return;
  }
  
  const tabs = [
    { id: "belajar", icon: "📚", label: "Belajar" },
    { id: "fokus", icon: "⏱️", label: "Fokus" },

    { id: "stat", icon: "📊", label: "Statistik" },
    { id: "pengaturan", icon: "⚙️", label: "Atur" }
  ];
  
  let content = "";
  switch(S.tab) {
    case "belajar": content = renderTabBelajar(); break;
    case "fokus": content = renderTabFokus(); break;
    case "tutor": content = renderTabTutor(); break;
    case "stat": content = renderTabStat(); break;

  $id("app").innerHTML = `
    ${renderTopBar()}

      ${tabs.map(t=>`<button class="${S.tab===t.id?'active':''}" onclick="S.tab='${t.id}';saveState();render()">
        <span>${t.icon}</span>${t.label}
      </button>`).join("")}

    ${content}
    
    <div class="credit-footer">
      <p>✨ <b>Rajin Belajar Jadi Pintar</b> ✨</p>
      <p>Dibuat dengan <span class="heart">❤️</span> oleh <b>Pandana</b></p>
      <p style="margin-top:6px;font-size:10px">
        AI Tutor • Sistem Level • Pencapaian • Fokus Timer • Kuis Pintar<br>
        Rating: ${S.rating>0?"⭐".repeat(S.rating)+"☆".repeat(5-S.rating)} (${S.ratingCount} ulasan)

        <label>Pilih Avatar</label>
        <div class="grid-4" style="margin-bottom:16px">
          ${AVATARS.map(a=>`<button style="font-size:22px;padding:8px" class="${selAv===a?'selected':'secondary'}" onclick="selAv='${a}';render()">${a}</button>`).join("")}
        </div>
      `:""}
      
      <button class="primary" style="width:100%;margin-top:8px" onclick="prosesAuth()">
        ${authMode==='login'?'🔓 Masuk Sekarang':'✨ Buat Akun Baru'}
      </button>
    </div>
    
    <div class="credit-footer">
      <p>Dibuat dengan <span class="heart">❤️</span> oleh <b>Pandana</b></p>
      <p style="font-size:10px;color:var(--text-2)">Data tersimpan aman di perangkatmu</p>
    </div>
  `;
}

function prosesAuth() {
  const nama = $id("inNama").value.trim();
  const pass = $id("inPass").value;
  const err = (msg) => {
    const el = $id("authErr");
    el.textContent = msg; el.style.display = "block";
  };
  
  if (nama.length < 3) return err("Nama minimal 3 karakter");
  if (pass.length < 4) return err("Kata sandi minimal 4 karakter");
  
  if (authMode === "register") {
    const pass2 = $id("inPass2").value;
    if (pass !== pass2) return err("Kata sandi tidak sama");
    S.nama = nama; S.password = pass; S.avatar = selAv;
    Object.assign(S, DEFAULT_STATE, { nama, password: pass, avatar: selAv });
    playSound("new");
    toast(`Selamat datang, ${nama}! 🎉`);
  } else {
    // Login sederhana
    if (!S.nama) return err("Nama belum terdaftar, silakan daftar dulu");
    if (S.nama !== nama || S.password !== pass) return err("Nama atau kata sandi salah");
    toast(`Halo, ${nama}! 👋`);
  }
  
  saveState();
  render();
}
