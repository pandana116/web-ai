<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Rajin Belajar Jadi Pintar</title>
<style>
:root{--bg:#0f1117;--card:#1a1d29;--tx:#e8ecf5;--mut:#9aa6bf;--pr:#6366f1;--pr2:#8b5cf6;--ok:#16a34a;--ok2:#22c55e;--no:#dc2626;--bd:#2b3145;--yl:#f59e0b}
html[data-theme=light]{--bg:#f5f7fb;--card:#fff;--tx:#1b2433;--mut:#64708a;--bd:#dde3ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
main{max-width:600px;margin:0 auto;padding:14px 14px 100px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;margin-bottom:14px;background:linear-gradient(135deg,#6366f1,#ec4899 60%,#f59e0b);color:#fff}
.hero h1{font-size:20px;margin:0 0 4px}.hero p{margin:0;font-size:12.5px;opacity:.95}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:11px;text-align:left;transition:.15s}
button:active{transform:scale(.97)}
button.sel{border-color:var(--pr);background:var(--pr);color:#fff;font-weight:700}
button.go{width:100%;text-align:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0;font-weight:700;margin-top:8px;padding:13px}
button.ghost{background:var(--card)}
button.danger{background:var(--no);color:#fff;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.opt{display:block;width:100%;margin-bottom:8px;text-align:left;font-size:14px;padding:14px 16px;position:relative;transition:all .2s}
.opt.ok{border-color:var(--ok);background:linear-gradient(90deg,rgba(22,163,74,.2),rgba(22,163,74,.05));color:#4ade80;font-weight:700;box-shadow:0 0 0 2px rgba(22,163,74,.3)}
.opt.no{border-color:var(--no);background:rgba(220,38,38,.15);color:#fca5a5}
.opt .badge-ok{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .4s}
.score{font-size:64px;font-weight:800;text-align:center;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.bahas{font-size:13px;line-height:1.7;background:var(--bg);border-radius:12px;padding:14px;margin-top:14px;white-space:pre-wrap;border:1px solid var(--bd);position:relative}
.bahas b{color:var(--pr)}
.bahas-ok{border-color:rgba(22,163,74,.5);background:rgba(22,163,74,.08)}
.bahas-no{border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.06)}
.bahas-title{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;margin-bottom:10px}
.tabs button{text-align:center;padding:6px 1px;font-size:9.5px;border-radius:10px}
.tabs button span{display:block;font-size:18px;margin-bottom:2px}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:0;font-size:14px}
input:focus,textarea:focus{border-color:var(--pr)}
textarea{resize:vertical;min-height:80px}
.chat{height:320px;overflow:auto;background:var(--bg);border-radius:14px;padding:12px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.bub{max-width:86%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.bub.bot{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px;align-self:flex-start}
.bub.user{background:var(--pr);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.typ{display:flex;gap:4px;padding:11px 13px;align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.typ i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typ i:nth-child(2){animation-delay:.18s}.typ i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.lbrow:last-child{border-bottom:0}
.lbrow.me{background:rgba(99,102,241,.15);border-radius:10px;padding:9px 12px;border:0}
.lbr{width:26px;font-weight:900;text-align:center;color:var(--mut);font-size:12.5px}
.lba{width:34px;height:34px;border-radius:10px;background:rgba(99,102,241,.15);display:grid;place-items:center;font-size:17px}
.lbb{flex:1;min-width:0}.lbb b{font-size:13px;display:block}.lbb small{color:var(--mut);font-size:10.5px}
.lbp{font-weight:800;color:var(--pr);font-size:12.5px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px}
.st .e{font-size:24px;display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#25263a;color:#fff;padding:11px 16px;border-radius:12px;z-index:200;display:none;font-size:12.5px;font-weight:700;max-width:88vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.show{display:block;animation:ti .3s forwards}
@keyframes ti{to{transform:translateX(-50%) translateY(0)}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:120;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.mbox{background:var(--card);width:min(500px,100%);border-radius:18px;padding:20px;max-height:88vh;overflow:auto;border:1px solid var(--bd);animation:su .3s}
@keyframes su{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:0 0 8px;font-size:19px}
.mclose{float:right;background:var(--bd);color:var(--tx);width:32px;height:32px;border-radius:9px;font-weight:900;border:0;text-align:center;padding:0}
.reaction{display:flex;justify-content:center;gap:10px;font-size:38px;margin:6px 0}
.reaction span{animation:pp .8s ease backwards}
@keyframes pp{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stars{display:flex;gap:4px;justify-content:center;font-size:30px;margin:10px 0;cursor:pointer}
.stars span{opacity:.3;transition:.2s}
.stars span.on{opacity:1;transform:scale(1.15)}
.credit{text-align:center;padding:22px 0 8px;color:var(--mut);font-size:11.5px}
.credit b{color:var(--pr)}
.sk{background:linear-gradient(90deg,var(--bd),rgba(99,102,241,.15),var(--bd));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:9px;height:14px;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
.ket{background:var(--bg);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;border:1px solid var(--bd);color:var(--mut)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.auth-tabs button{text-align:center;padding:10px;font-size:13px;font-weight:700}
.auth-tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.err{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5;padding:9px 12px;border-radius:10px;font-size:12.5px;margin-bottom:10px;display:none}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.avatar-grid button{padding:6px 0;text-align:center;font-size:22px;border-radius:10px}
.avatar-grid button.sel{background:var(--pr);border-color:var(--pr)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill-row button{padding:6px 11px;border-radius:8px;font-size:11.5px;background:var(--bd);border:0;font-weight:600}

/* ============ RUANG KUIS ============ */
.quiz-room{position:fixed;inset:0;background:linear-gradient(180deg,#0a0c12,#0f1117);z-index:100;overflow-y:auto;display:flex;flex-direction:column}
html[data-theme=light] .quiz-room{background:linear-gradient(180deg,#f0f2f8,#f5f7fb)}
.quiz-header{padding:14px 16px;background:rgba(99,102,241,.12);border-bottom:1px solid rgba(99,102,241,.25);position:sticky;top:0;z-index:2;backdrop-filter:blur(10px)}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.quiz-top .info{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.quiz-top .chip{background:rgba(99,102,241,.2);color:#a5b4fc;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap}
html[data-theme=light] .quiz-top .chip{background:rgba(99,102,241,.15);color:#4f46e5}
.quiz-top .close-btn{background:rgba(255,255,255,.1);border:0;color:var(--tx);padding:7px 11px;border-radius:9px;font-size:12px;font-weight:700;flex:0 0 auto}
.quiz-prog-big{height:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
html[data-theme=light] .quiz-prog-big{background:rgba(0,0,0,.08)}
.quiz-prog-big i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);border-radius:9px;transition:width .5s;box-shadow:0 0 12px rgba(99,102,241,.6)}
.quiz-body{flex:1;padding:20px 16px 100px;max-width:600px;margin:0 auto;width:100%}
.quiz-num-big{font-size:72px;font-weight:900;line-height:1;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-3px}
.quiz-q-card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-top:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
html[data-theme=light] .quiz-q-card{box-shadow:0 10px 30px rgba(0,0,0,.06)}
.quiz-q-text{font-size:18px;font-weight:800;line-height:1.5;margin:0 0 18px}
.quiz-tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.quiz-tools button{padding:10px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--card);font-size:12.5px;font-weight:700;text-align:center;color:var(--tx)}
.quiz-tools button:hover{border-color:var(--pr);color:var(--pr)}
.quiz-nav{position:fixed;bottom:0;left:0;right:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(15,17,23,.95);border-top:1px solid var(--bd);backdrop-filter:blur(10px);z-index:3}
html[data-theme=light] .quiz-nav{background:rgba(245,247,251,.95)}
.quiz-nav .inner{max-width:600px;margin:0 auto;display:flex;gap:10px}
.quiz-nav button{flex:1;padding:15px;border-radius:14px;font-size:15px;font-weight:800;text-align:center;border:0}
.quiz-nav .next{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.4)}
.quiz-nav .next:disabled{opacity:.4;box-shadow:none}
.quiz-nav .check{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}

/* OVERLAY KALKULATOR / SKETSA */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.overlay-box{background:var(--card);width:min(600px,100%);border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto;border-top:1px solid var(--bd);animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.overlay-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.overlay-header h3{margin:0;font-size:17px}
.overlay-header button{background:var(--bd);border:0;width:32px;height:32px;border-radius:9px;font-weight:900;padding:0;text-align:center}
.calc-display{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:right;font-size:24px;font-weight:800;min-height:60px;word-break:break-all;font-variant-numeric:tabular-nums}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.calc-grid button{padding:16px 0;text-align:center;border-radius:12px;background:var(--bg);border:1px solid var(--bd);font-weight:800;font-size:16px}
.calc-grid button.op{background:rgba(99,102,241,.15);color:var(--pr)}
.calc-grid button.eq{background:var(--pr);color:#fff;grid-column:span 2}
canvas.sketch{width:100%;height:320px;border:1px solid var(--bd);border-radius:12px;background:#fff;touch-action:none;display:block}
.sketch-tools{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.sketch-tools button{padding:10px 0;text-align:center;border-radius:11px;background:var(--card);border:1px solid var(--bd);font-size:15px}
.sketch-tools button.sel{border-color:var(--pr);background:rgba(99,102,241,.15)}

/* SPEAKING */
.speak-btn{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#f43f5e);color:#fff;border:0;font-size:40px;display:flex;align-items:center;justify-content:center;margin:16px auto;box-shadow:0 8px 24px rgba(236,72,153,.4);transition:.2s}
.speak-btn.rec{animation:rec 1.2s infinite;background:linear-gradient(135deg,#dc2626,#f43f5e)}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.7)}70%{box-shadow:0 0 0 20px rgba(220,38,38,0)}}
.score-badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800;margin-left:8px}
.score-badge.good{background:rgba(22,163,74,.2);color:#4ade80}
.score-badge.mid{background:rgba(245,158,11,.2);color:#fbbf24}
.score-badge.bad{background:rgba(220,38,38,.2);color:#fca5a5}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox"><button class="mclose" onclick="closeModal()">✕</button><div id="modalContent"></div></div>
</div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeOverlay()">
  <div class="overlay-box" id="overlayContent"></div>
</div>

<script>
/* ===== KONFIG ===== */
const AI_ENDPOINT='/api/chat';
const AUTH_ENDPOINT='/api/auth';
const LB_ENDPOINT='/api/leaderboard';

/* ===== STATE ===== */
let S={nama:'',password:'',avatar:'🦊',xp:0,coins:20,streak:0,soal:0,benar:0,menitFokus:0,riwayat:[],chatHistory:[],myRating:0,comments:[],tab:'belajar',lastActive:'',notes:'',planner:[],moods:[],theme:'dark',color:'indigo',sound:true};
function loadS(){try{const r=localStorage.getItem('rbjp_v7');if(r)Object.assign(S,JSON.parse(r))}catch(e){}}
function saveS(){try{localStorage.setItem('rbjp_v7',JSON.stringify(S))}catch(e){}}
loadS();

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const lvlOf=xp=>Math.floor(xp/100)+1;
const xpIn=xp=>xp%100;

function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2400)}
function openModal(h){$('modalContent').innerHTML=h;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function openOverlay(h){$('overlayContent').innerHTML=h;$('overlay').classList.add('show')}
function closeOverlay(){$('overlay').classList.remove('show')}

/* ===== SUARA (SFX) ===== */
let sfxCtx=null;
function sfx(type){
  if(!S.sound)return;
  try{
    sfxCtx=sfxCtx||new(window.AudioContext||window.webkitAudioContext)();
    const C=sfxCtx;
    if(type==='benar'){
      // Nada naik ceria: C-E-G-C
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
        const o=C.createOscillator(),g=C.createGain();
        o.connect(g);g.connect(C.destination);
        o.type='sine';o.frequency.value=f;
        const t=C.currentTime+i*0.08;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.12,t+.01);
        g.gain.exponentialRampToValueAtTime(.001,t+.35);
        o.start(t);o.stop(t+.4);
      });
    }else if(type==='salah'){
      // Nada turun
      [400,300,200].forEach((f,i)=>{
        const o=C.createOscillator(),g=C.createGain();
        o.connect(g);g.connect(C.destination);
        o.type='sawtooth';o.frequency.value=f;
        const t=C.currentTime+i*0.1;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.08,t+.01);
        g.gain.exponentialRampToValueAtTime(.001,t+.25);
        o.start(t);o.stop(t+.3);
      });
    }else if(type==='klik'){
      const o=C.createOscillator(),g=C.createGain();
      o.connect(g);g.connect(C.destination);
      o.type='sine';o.frequency.value=520;
      g.gain.setValueAtTime(.06,C.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,C.currentTime+.08);
      o.start();o.stop(C.currentTime+.1);
    }else if(type==='naik'){
      [659.25,880,1108.73].forEach((f,i)=>{
        const o=C.createOscillator(),g=C.createGain();
        o.connect(g);g.connect(C.destination);
        o.type='triangle';o.frequency.value=f;
        const t=C.currentTime+i*0.12;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.1,t+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+.5);
        o.start(t);o.stop(t+.55);
      });
    }
  }catch(e){}
}

/* ===== THEME ===== */
const COLORS={indigo:{p:'#6366f1',p2:'#8b5cf6'},blue:{p:'#2563eb',p2:'#3b82f6'},green:{p:'#16a34a',p2:'#22c55e'},orange:{p:'#f97316',p2:'#fb923c'},red:{p:'#dc2626',p2:'#f43f5e'},pink:{p:'#db2777',p2:'#ec4899'},teal:{p:'#0891b2',p2:'#06b6d4'},purple:{p:'#7c3aed',p2:'#a855f7'}};
function applyTheme(){const c=COLORS[S.color]||COLORS.indigo;document.documentElement.style.setProperty('--pr',c.p);document.documentElement.style.setProperty('--pr2',c.p2);document.documentElement.setAttribute('data-theme',S.theme)}
applyTheme();

/* ===== API ===== */
async function apiAuth(action,payload){
  const r=await fetch(AUTH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal');return d;
}
async function apiLB(){const r=await fetch(LB_ENDPOINT);const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal');return d.rows||[]}
async function syncUser(){if(!S.nama||!S.password)return;try{await apiAuth('update',{nama:S.nama,password:S.password,stats:{xp:S.xp,coins:S.coins,streak:S.streak,soal:S.soal,benar:S.benar,menitFokus:S.menitFokus,avatar:S.avatar,lastActive:S.lastActive}})}catch(e){console.warn(e.message)}}
let syncT;function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(syncUser,1500)}

async function callAI(messages){
  const r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'AI error');
  const text=d.choices?.[0]?.message?.content||d.text||'';if(!text)throw new Error('AI tidak merespons');return text;
}
async function callAIJSON(prompt,system){
  const msgs=[];if(system)msgs.push({role:'system',content:system});msgs.push({role:'user',content:prompt});
  const text=await callAI(msgs);const a=text.indexOf('{'),b=text.lastIndexOf('}');
  if(a<0||b<a)throw new Error('AI tidak mengembalikan JSON valid');return JSON.parse(text.slice(a,b+1));
}

/* ===== AUTH ===== */
let authMode='login';
const AVATARS=['🦊','🐼','🐯','🐰','🐨','🐸','🐺','🐱','🦁','🐵','🦉','🐧','🐢','🦄','🐲','🚀','👑','⭐','🎓','🧠','🐻','🦅'];
let pickedAvatar='🦊';

function pAuth(){
  return `<div class="hero"><h1>📚 Rajin Belajar</h1><p>Belajar seru, naik level tiap hari</p></div>
  <div class="card">
    <div class="auth-tabs">
      <button class="${authMode==='login'?'on':''}" onclick="authMode='login';render()">Masuk</button>
      <button class="${authMode==='register'?'on':''}" onclick="authMode='register';render()">Daftar Baru</button>
    </div>
    <div class="err" id="authErr"></div>
    <label style="margin-top:0">Nama</label>
    <input id="inNama" placeholder="Nama atau panggilan" maxlength="20">
    <label>Password</label>
    <input id="inPw" type="password" placeholder="Minimal 4 karakter">
    ${authMode==='register'?`<label>Konfirmasi Password</label><input id="inPw2" type="password" placeholder="Ulangi password">
      <label>Pilih Avatar</label><div class="avatar-grid">${AVATARS.map(a=>`<button class="${a===pickedAvatar?'sel':''}" onclick="pickedAvatar='${a}';render()">${a}</button>`).join('')}</div>`:''}

  </div>
  <div class="credit">Dibuat dengan ❤️ by <b>Pandana</b></div>`;
}
async function submitAuth(){
  const nama=$('inNama').value.trim(),pw=$('inPw').value;
  const pw2=authMode==='register'?$('inPw2').value:pw;
  const err=$('authErr');function showErr(m){err.textContent=m;err.style.display='block'}err.style.display='none';
  if(nama.length<3)return showErr('Nama minimal 3 karakter');
  if(pw.length<4)return showErr('Password minimal 4 karakter');
  if(authMode==='register'&&pw!==pw2)return showErr('Konfirmasi password tidak sama');
  const btn=$('authBtn');btn.disabled=true;btn.textContent='⏳ Tunggu...';
  try{
    const res=await apiAuth(authMode,{nama,password:pw,avatar:authMode==='register'?pickedAvatar:undefined});
    Object.assign(S,res.user,{password:pw,tab:'belajar',chatHistory:[]});saveS();
    toast(authMode==='login'?'👋 Halo, '+S.nama+'!':'🎉 Selamat datang, '+S.nama+'!');sfx('naik');render();
  }catch(e){showErr(e.message);btn.disabled=false;btn.textContent=authMode==='login'?'🔓 Masuk':'✨ Daftar'}
}
function logout(){if(!confirm('Keluar dari akun?'))return;S.nama='';S.password='';S.chatHistory=[];saveS();authMode='login';render();toast('👋 Sampai jumpa!')}

/* ===== NAVIGASI ===== */
function go(t){S.tab=t;saveS();render()}

function render(){
  if(!S.nama||!S.password)return $('app').innerHTML=pAuth();
  const t=S.tab||'belajar';
  const pages={belajar:pBelajar,khusus:pKhusus,speaking:pSpeaking,musik:pMusik,alat:pAlat,nilai:pNilai};
  $('app').innerHTML=`
    <div class="hero">

          <p>Level ${lvlOf(S.xp)} • ${S.xp} XP • 🔥 ${S.streak} • 🪙 ${S.coins}</p></div>
        <button onclick="logout()" style="background:rgba(255,255,255,.2);border:0;color:#fff;padding:7px 11px;border-radius:9px;font-size:11px;font-weight:700">Keluar</button>
      </div>
    </div>
    <div class="tabs">

      <button class="${t==='musik'?'on':''}" onclick="go('musik')"><span>🎵</span>Musik</button>
      <button class="${t==='alat'?'on':''}" onclick="go('alat')"><span>🛠️</span>Alat</button>

      <button class="${setup.tipe==='pg'?'sel':''}" onclick="setup.tipe='pg';render()">PG</button>

function updateKelas(){
  const map={SD:[1,2,3,4,5,6],SMP:[7,8,9],SMA:[10,11,12]};
  const arr=map[setup.jenjang]||[7,8,9];
  if(!arr.includes(setup.kelas))setup.kelas=arr[0];
  const sel=$('selKelas');if(sel)sel.innerHTML=arr.map(k=>`<option ${k===setup.kelas?'selected':''}>${k}</option>`).join('');
}

  const m=MODE_KHUSUS.find(x=>x.id===id);

/* ===== RUANG KUIS ===== */
let quiz={soal:[],idx:0,jawab:[],skor:0,khusus:null};
let calcOpen=false,sketchOpen=false;

async function mulaiKuis(isKhusus,special){
  const jumlah=setup.n,pg=Math.ceil(jumlah*0.6);
  const jenis=setup.tipe==='pg'?`${jumlah} soal pilihan ganda`:setup.tipe==='uraian'?`${jumlah} soal uraian`:`${jumlah} soal campuran (${pg} PG, ${jumlah-pg} uraian)`;
  const mapel=setup.mapel;
  const prompt=`Buatkan ${jenis} ${mapel} untuk siswa ${setup.jenjang} kelas ${setup.kelas} Indonesia (Kurikulum Merdeka). Bahasa Indonesia.${setup.kisi?` Fokus: ${setup.kisi}.`:''}

Balas HANYA JSON valid tanpa markdown:
{"soal":[{"tipe":"pg","q":"pertanyaan","opsi":["a","b","c","d"],"jawab":0,"bahas":"penjelasan lengkap 3-5 kalimat: konsep + langkah + kenapa jawaban benar + kenapa opsi lain salah"},{"tipe":"uraian","q":"pertanyaan","kunci":"jawaban model","bahas":"penjelasan lengkap"}]}

Aturan: PG opsi 4 tanpa awalan huruf, "jawab"=indeks 0-3. Soal bervariasi dan spesifik.`;

  quiz={soal:[],idx:0,jawab:[],skor:0,khusus:isKhusus?special:null};
  // Tampilkan loading di ruang kuis
  showQuizRoom(`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px">
    <div style="font-size:64px;animation:float 2s infinite">🤖</div>
    <h2 style="margin:16px 0 6px">AI sedang membuat soal...</h2>
    <p style="color:var(--mut);font-size:13px">Soal khusus untuk ${esc(mapel)}${isKhusus?' • '+esc(special.nama):''}</p>
    <div style="margin-top:24px;width:80%">
      <div class="sk" style="width:100%;height:10px"></div>
      <div class="sk" style="width:70%;height:10px;margin:8px auto"></div>
      <div class="sk" style="width:85%;height:10px"></div>
    </div>
    <button class="go ghost" style="background:var(--card);color:var(--tx);border:1px solid var(--bd);margin-top:30px;max-width:200px" onclick="closeQuizRoom()">✕ Batal</button>
  </div>`);

  try{
    const data=await callAIJSON(prompt,'Kamu pembuat soal pelajar Indonesia. Selalu balas JSON valid.');
    const list=(data.soal||[]).filter(s=>s.q&&(s.tipe==='uraian'?s.kunci:(Array.isArray(s.opsi)&&s.opsi.length===4&&typeof s.jawab==='number'))).map(s=>({...s,tipe:s.tipe||'pg',opsi:s.opsi?s.opsi.map(o=>String(o).replace(/^\s*[a-dA-D][\.\)]\s+/,'')):undefined}));
    if(!list.length)throw new Error('AI tidak menghasilkan soal valid');
    quiz.soal=list;
    renderQuizRoom();
  }catch(e){
    showQuizRoom(`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px">
      <div style="font-size:64px">😅</div>
      <h2 style="margin:16px 0 6px">AI belum bisa membuat soal</h2>
      <p style="color:var(--mut);font-size:13px;max-width:400px">${esc(e.message)}</p>
      <div class="ket" style="text-align:left;margin-top:14px;max-width:440px">
        <b>💡 Coba:</b><br>1. Cek <code>/api/chat</code> di browser<br>2. Pastikan <code>GROQ_API_KEY</code> di Vercel<br>3. Tunggu 1-2 menit lalu coba lagi
      </div>
      <button class="go" style="max-width:200px" onclick="closeQuizRoom()">← Kembali</button>
    </div>`);
  }
}

function showQuizRoom(html){
  const div=document.createElement('div');
  div.className='quiz-room';
  div.id='quizRoom';
  div.innerHTML=html;
  document.body.appendChild(div);
  document.body.style.overflow='hidden';
}
function closeQuizRoom(){
  const r=$('quizRoom');
  if(r)r.remove();
  document.body.style.overflow='';
  calcOpen=false;sketchOpen=false;
  const ov=$('overlay');if(ov)ov.classList.remove('show');
}

function renderQuizRoom(){
  if(quiz.idx>=quiz.soal.length)return renderHasilRoom();
  const s=quiz.soal[quiz.idx],r=quiz.jawab[quiz.idx],done=!!r;
  const mapel=setup.mapel;
  const butuhKalk=/(Matematika|IPA|Fisika|Kimia|Informatika)/i.test(mapel);
  const butuhSketsa=/(Matematika|IPA|Fisika|Seni)/i.test(mapel);
  const persen=(quiz.idx+(done?1:0))/quiz.soal.length*100;

  let body='';
  if(s.tipe==='pg'){
    body=s.opsi.map((o,i)=>{
      let cls='opt';
      if(done){if(i===s.jawab)cls+=' ok';else if(i===r.jwb)cls+=' no'}
      return `<button class="${cls}" ${done?'disabled':''} onclick="jwbPG(${i})">
        <b>${String.fromCharCode(65+i)}.</b> ${esc(o)}
        ${done&&i===s.jawab?'<span class="badge-ok">✓</span>':''}
      </button>`;
    }).join('');
    if(done){
      body+=`<div class="bahas ${r.benar?'bahas-ok':'bahas-no'}">
        <div class="bahas-title">${r.benar?'✅ <span style="color:var(--ok2)">Jawaban Benar!</span>':'❌ <span style="color:var(--no)">Belum Tepat</span>'}</div>
        ${!r.benar?`<div style="margin-bottom:10px;padding:8px 10px;background:rgba(22,163,74,.15);border-radius:8px;font-size:13px">💡 Jawaban benar: <b>${String.fromCharCode(65+s.jawab)}. ${esc(s.opsi[s.jawab])}</b></div>`:''}
        <div><b>📖 Penjelasan:</b></div>
        <div style="margin-top:6px">${esc(s.bahas||'')}</div>
      </div>`;
    }
  }else{
    if(!done){
      body=`<textarea id="ansUraian" placeholder="Tulis jawabanmu di sini..." style="min-height:120px"></textarea>
        <button class="go" onclick="jwbUraian()">✓ Periksa Jawaban</button>`;
    }else{
      body=`<div class="bahas bahas-ok">
        <div class="bahas-title">✅ <span style="color:var(--ok2)">Jawabanmu</span></div>
        <div style="margin-bottom:10px">${esc(r.jwb)}</div>
        <div style="padding:10px;background:rgba(99,102,241,.1);border-radius:8px;margin-bottom:10px;font-size:12.5px"><b>🔑 Kunci:</b> ${esc(s.kunci)}</div>
        <div><b>📖 Penjelasan:</b></div>
        <div style="margin-top:6px">${esc(s.bahas||'')}</div>
      </div>`;
    }
  }

  const html=`
    <div class="quiz-header">
      <div class="quiz-top">
        <div class="info">
          <span class="chip">${quiz.khusus?quiz.khusus.emo+' '+quiz.khusus.nama:esc(mapel)}</span>
          <span class="chip">Kelas ${setup.kelas}</span>
        </div>
        <button class="close-btn" onclick="closeQuizRoom()">✕ Keluar</button>
      </div>
      <div class="quiz-prog-big"><i style="width:${persen}%"></i></div>
    </div>
    <div class="quiz-body">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px">
        <div>
          <div style="font-size:11px;color:var(--mut);font-weight:700;letter-spacing:1px">SOAL</div>
          <div class="quiz-num-big">${quiz.idx+1}<span style="font-size:32px;color:var(--mut);-webkit-text-fill-color:var(--mut)">/${quiz.soal.length}</span></div>
        </div>
        <div style="text-align:right;font-size:11.5px;color:var(--mut)">
          <div>Skor: <b style="color:var(--ok2);font-size:14px">${quiz.skor}</b></div>
          <div>${s.tipe==='pg'?'Pilihan Ganda':'Uraian'}</div>
        </div>
      </div>
      <div class="quiz-q-card">
        <div class="quiz-q-text">${esc(s.q)}</div>
        ${body}
        ${(butuhKalk||butuhSketsa)?`
          <div class="quiz-tools">
            ${butuhKalk?`<button onclick="openCalc()">🧮 Kalkulator</button>`:''}
            ${butuhSketsa?`<button onclick="openSketch()">✏️ Sketsa</button>`:''}
            <button onclick="bacakanSoal()">🔊 Bacakan Soal</button>
          </div>`:''}
      </div>
    </div>
    <div class="quiz-nav">
      <div class="inner">
        ${done?`<button class="next" onclick="lanjutSoal()">${quiz.idx+1===quiz.soal.length?'🏁 Lihat Nilai':'Soal Berikutnya →'}</button>`:''}
      </div>
    </div>`;
  const r_=$('quizRoom');
  if(r_)r_.innerHTML=html;
}

function jwbPG(i){
  const s=quiz.soal[quiz.idx],benar=i===s.jawab;
  quiz.jawab[quiz.idx]={jwb:i,benar};
  if(benar){quiz.skor++;S.benar++;sfx('benar')}else sfx('salah');
  S.soal++;saveS();scheduleSync();
  if(benar)toast('🎉 Benar! +20 XP');
  renderQuizRoom();
  // Scroll ke pembahasan
  setTimeout(()=>{const b=document.querySelector('.bahas');if(b)b.scrollIntoView({behavior:'smooth',block:'center'})},100);
  if(benar){S.xp+=20;saveS();scheduleSync()}
}
function jwbUraian(){
  const t=$('ansUraian')?.value.trim();
  if(!t)return toast('Tulis jawaban dulu');
  quiz.jawab[quiz.idx]={jwb:t,benar:true};
  S.soal++;S.xp+=15;saveS();scheduleSync();
  sfx('benar');
  renderQuizRoom();
}
function lanjutSoal(){quiz.idx++;if(quiz.idx>=quiz.soal.length)renderHasilRoom();else renderQuizRoom();window.scrollTo(0,0)}
function bacakanSoal(){
  const s=quiz.soal[quiz.idx];
  if(!('speechSynthesis' in window))return toast('Browser tidak mendukung suara');
  speechSynthesis.cancel();
  let teks=s.q;
  if(s.tipe==='pg')teks+='. '+s.opsi.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('. ');
  const u=new SpeechSynthesisUtterance(teks);
  u.lang='id-ID';u.rate=.95;
  speechSynthesis.speak(u);
  toast('🔊 Membacakan soal...');
}

function renderHasilRoom(){
  const total=quiz.soal.length,nilai=Math.round((quiz.skor/total)*100);
  const lulus=nilai>=setup.kkm,xpDapat=quiz.skor*20+(lulus?50:0);
  S.riwayat.unshift({tgl:today(),mapel:setup.mapel,nilai,benar:quiz.skor,total});
  S.riwayat=S.riwayat.slice(0,30);S.xp+=xpDapat;S.coins+=(lulus?10:3);
  saveS();scheduleSync();
  const reaksi=lulus?['🎉','🏆','🔥','⭐']:['💪','🌱','🤗'];
  const r_=$('quizRoom');
  if(r_){
    r_.innerHTML=`

/* ===== OVERLAY KALKULATOR ===== */
let calcExpr='';
const CALC_KEYS=['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','-','0','.','^','+','√('];
function openCalc(){
  openOverlay(`
    <div class="overlay-header"><h3>🧮 Kalkulator</h3><button onclick="closeOverlay()">✕</button></div>
    <div class="calc-display" id="cd">${esc(calcExpr)||'0'}</div>
    <div class="calc-grid">
      ${CALC_KEYS.map(k=>{const isOp=['÷','×','-','+','^','√('].includes(k);return `<button class="${isOp?'op':''}" onclick="ckey('${k}')">${k}</button>`}).join('')}
      <button class="eq" onclick="ckey('=')">=</button>
    </div>`);
}
function ckey(k){
  if(calcExpr==='Error')calcExpr='';
  if(k==='C')calcExpr='';
  else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);
  else if(k==='='){try{calcExpr=String(Math.round(evalCalc(calcExpr)*1e9)/1e9)}catch(e){calcExpr='Error'}}
  else calcExpr+=k;
  const d=$('cd');if(d)d.textContent=calcExpr||'0';
}
function evalCalc(s){
  let i=0;
  const ex=()=>{let v=tm();while(s[i]==='+'||s[i]==='-'){const o=s[i++],y=tm();v=o==='+'?v+y:v-y}return v};
  const tm=()=>{let v=pw();while(s[i]==='×'||s[i]==='÷'){const o=s[i++],y=pw();v=o==='×'?v*y:v/y}return v};
  const pw=()=>{const b=un();if(s[i]==='^'){i++;return Math.pow(b,pw())}return b};
  const un=()=>{if(s[i]==='-'){i++;return -un()}if(s[i]==='√'){i++;return Math.sqrt(un())}return at()};
  const at=()=>{if(s[i]==='('){i++;const v=ex();if(s[i]!==')')throw 0;i++;return v}const m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const v=ex();if(i<s.length||!isFinite(v))throw 0;return v;
}

    </div>`);

function renderSkTools(){
  document.querySelectorAll('.sketch-tools button').forEach(b=>{if(b.dataset.color)b.classList.toggle('sel',b.dataset.color===sketchState.color)});
}
function setSkColor(c){sketchState.color=c;renderSkTools()}
function sketchInit(){
  const c=$('sketchCanvas');if(!c)return;
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.lineCap='round';ctx.lineJoin='round';
  const getPos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}};
  const start=e=>{e.preventDefault();sketchState.drawing=true;const p=getPos(e);sketchState.lastX=p.x;sketchState.lastY=p.y};
  const move=e=>{if(!sketchState.drawing)return;e.preventDefault();const p=getPos(e);ctx.strokeStyle=sketchState.color;ctx.lineWidth=sketchState.size;ctx.beginPath();ctx.moveTo(sketchState.lastX,sketchState.lastY);ctx.lineTo(p.x,p.y);ctx.stroke();sketchState.lastX=p.x;sketchState.lastY=p.y};
  const end=()=>{sketchState.drawing=false};
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);c.addEventListener('mouseup',end);c.addEventListener('mouseleave',end);
  c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);
}
function sketchClear(){const c=$('sketchCanvas');if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);toast('🗑️ Dibersihkan')}
