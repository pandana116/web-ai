<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="Rajin Belajar Jadi Pintar - belajar seru dengan AI">
<title>Rajin Belajar Jadi Pintar</title>
<style>
:root{--bg:#0f1117;--card:#1a1d29;--card2:#232838;--tx:#e8ecf5;--mut:#9aa6bf;--pr:#6366f1;--pr2:#8b5cf6;--ok:#16a34a;--ok2:#22c55e;--no:#dc2626;--yl:#f59e0b;--bd:#2b3145;--sh:rgba(0,0,0,.4)}
html[data-theme=light]{--bg:#f5f7fb;--card:#ffffff;--card2:#f0f3fa;--tx:#1b2433;--mut:#64708a;--bd:#dde3ef;--sh:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:active{transform:scale(.97)}
a{color:var(--pr);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px}
main{max-width:600px;margin:0 auto;padding:14px 14px 100px}
h1,h2,h3,h4,p{margin:0}
h1{font-size:20px}h2{font-size:18px}h3{font-size:15px}
/* HERO */
.hero{border-radius:18px;padding:18px;margin-bottom:14px;background:linear-gradient(135deg,#6366f1,#ec4899 60%,#f59e0b);color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.3);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:rgba(255,255,255,.12);border-radius:50%}
.hero::after{content:"";position:absolute;bottom:-80px;left:-40px;width:150px;height:150px;background:rgba(255,255,255,.08);border-radius:50%}
.hero-content{position:relative;z-index:1}
.hero h1{font-size:20px;margin-bottom:4px}
.hero p{margin:0;font-size:12.5px;opacity:.95}
/* CARDS */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px var(--sh)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-header h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;transition:.15s;border:1px solid transparent}
.btn-primary{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.btn-primary:hover{opacity:.95}
.btn-secondary{background:var(--card2);color:var(--tx);border-color:var(--bd)}
.btn-ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn-danger{background:var(--no);color:#fff}
.btn-ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
.btn-block{display:flex;width:100%}
.btn-lg{padding:14px 20px;font-size:14.5px}
.btn-sm{padding:7px 11px;font-size:11.5px;border-radius:9px}
button.sel{background:var(--pr);color:#fff;border-color:var(--pr)}
button:disabled{opacity:.5;cursor:not-allowed}
/* GRID */
.grid{display:grid;gap:8px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-5{grid-template-columns:repeat(5,1fr)}
/* FORM */
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
input,textarea,select{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:0;font-size:14px;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
textarea{resize:vertical;min-height:80px;font-family:inherit}
/* TABS */
.tabs{display:grid;gap:4px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;margin-bottom:10px}
.tabs-6{grid-template-columns:repeat(6,1fr)}
.tabs button{padding:8px 2px;font-size:10px;text-align:center;border-radius:10px;border:1px solid transparent;background:var(--card);color:var(--mut);font-weight:700;transition:.15s}
.tabs button span{display:block;font-size:20px;margin-bottom:3px}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr);box-shadow:0 4px 12px rgba(99,102,241,.3)}
/* OPT */
.opt{display:block;width:100%;margin-bottom:8px;text-align:left;font-size:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:500;transition:.2s;position:relative}
.opt:hover{border-color:var(--pr)}
.opt.ok{border-color:var(--ok);background:linear-gradient(90deg,rgba(22,163,74,.15),rgba(22,163,74,.02));color:#4ade80;font-weight:700;box-shadow:0 0 0 2px rgba(22,163,74,.3)}
.opt.no{border-color:var(--no);background:rgba(220,38,38,.1);color:#fca5a5}
.opt .tick{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px}
/* BAR */
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);border-radius:9px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar-ok i{background:linear-gradient(90deg,#16a34a,#4ade80)}
/* BADGE */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:10.5px;font-weight:800;background:rgba(99,102,241,.15);color:#a5b4fc;letter-spacing:.3px}
html[data-theme=light] .chip{background:rgba(99,102,241,.1);color:#4f46e5}
.chip-ok{background:rgba(22,163,74,.15);color:#4ade80}
.chip-no{background:rgba(220,38,38,.15);color:#fca5a5}
.chip-yl{background:rgba(245,158,11,.15);color:#fbbf24}
/* STAT */
.stat{background:var(--card2);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pr);font-weight:900;line-height:1.1}
.stat small{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat .ic{font-size:26px;display:block;margin-bottom:4px}
/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);background:#25263a;color:#fff;padding:11px 18px;border-radius:12px;z-index:9999;display:none;font-size:12.5px;font-weight:700;max-width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:transform .3s,opacity .3s;opacity:0}
.toast.show{display:block;transform:translateX(-50%) translateY(0);opacity:1}
/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mbox{background:var(--card);width:min(520px,100%);border-radius:18px;padding:22px;max-height:88vh;overflow:auto;border:1px solid var(--bd);animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mbox h2{font-size:18px;margin-bottom:10px}
.mclose{float:right;background:var(--bd);color:var(--tx);width:32px;height:32px;border-radius:9px;font-weight:900;border:0;padding:0;display:flex;align-items:center;justify-content:center}
/* CHAT */
.chat{height:340px;overflow-y:auto;background:var(--bg);border-radius:14px;padding:12px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.bub{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bub.bot{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px;align-self:flex-start}
.bub.user{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.typing{display:flex;gap:4px;padding:13px 15px;background:var(--card);border:1px solid var(--bd);border-radius:14px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
/* AUTH */
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.auth-tabs button{padding:11px;font-size:13px;font-weight:700;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--mut)}
.auth-tabs button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:var(--pr)}
.err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.35);color:#fca5a5;padding:10px 13px;border-radius:10px;font-size:12.5px;margin-bottom:12px;display:none}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.avatar-grid button{padding:8px 0;text-align:center;font-size:22px;border-radius:11px;border:1px solid var(--bd);background:var(--card)}
.avatar-grid button.sel{background:var(--pr);border-color:var(--pr)}
/* MISC */
.ket{background:var(--bg);border-radius:11px;padding:11px;font-size:12px;line-height:1.65;border:1px solid var(--bd);color:var(--mut)}
.ket b{color:var(--tx)}
.credit{text-align:center;padding:24px 0 8px;color:var(--mut);font-size:11.5px;line-height:1.7}
.credit b{color:var(--pr)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill-row button{padding:6px 12px;border-radius:9px;font-size:11.5px;background:var(--card2);border:1px solid var(--bd);font-weight:600;color:var(--tx)}
/* QUIZ ROOM */
.quiz-room{position:fixed;inset:0;background:linear-gradient(180deg,#0a0c12,#0f1117);z-index:900;overflow-y:auto}
html[data-theme=light] .quiz-room{background:linear-gradient(180deg,#eef1f8,#f5f7fb)}
.quiz-header{padding:14px 16px;background:rgba(99,102,241,.12);border-bottom:1px solid rgba(99,102,241,.25);position:sticky;top:0;z-index:2;backdrop-filter:blur(12px)}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.quiz-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.quiz-close{background:rgba(255,255,255,.12);border:0;color:var(--tx);padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700}
.quiz-prog{height:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
html[data-theme=light] .quiz-prog{background:rgba(0,0,0,.08)}
.quiz-prog i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);border-radius:9px;transition:width .5s;box-shadow:0 0 12px rgba(99,102,241,.5)}
.quiz-body{padding:20px 16px 120px;max-width:600px;margin:0 auto}
.quiz-num{font-size:74px;font-weight:900;line-height:1;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-4px}
.quiz-num span{font-size:32px;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.quiz-q-card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-top:14px;box-shadow:0 12px 32px var(--sh)}
.quiz-q-text{font-size:17px;font-weight:800;line-height:1.55;margin:0 0 18px}
.quiz-tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.quiz-tools button{padding:9px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--card2);font-size:12px;font-weight:700;color:var(--tx)}
.quiz-tools button:hover{border-color:var(--pr);color:var(--pr)}
.quiz-nav{position:fixed;bottom:0;left:0;right:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(15,17,23,.94);border-top:1px solid var(--bd);z-index:3;backdrop-filter:blur(12px)}
html[data-theme=light] .quiz-nav{background:rgba(245,247,251,.94)}
.quiz-nav-inner{max-width:600px;margin:0 auto}
.quiz-nav button{width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:800;text-align:center;border:0;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.4)}
/* BAHAS */
.bahas{font-size:13px;line-height:1.75;background:var(--bg);border-radius:12px;padding:14px;margin-top:14px;white-space:pre-wrap;border:1px solid var(--bd)}
.bahas-ok{border-color:rgba(22,163,74,.5);background:rgba(22,163,74,.06)}
.bahas-no{border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.06)}
.bahas-title{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.score{font-size:64px;font-weight:900;text-align:center;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.reaction{display:flex;justify-content:center;gap:12px;font-size:38px;margin:10px 0}
.reaction span{animation:pop .8s ease backwards}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:950;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.show{display:flex;animation:fadeIn .2s}
.overlay-box{background:var(--card);width:min(620px,100%);border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow-y:auto;border-top:1px solid var(--bd);animation:slideUp .3s}
.overlay-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.overlay-header h3{margin:0;font-size:17px}
.overlay-close{background:var(--bd);border:0;width:34px;height:34px;border-radius:10px;font-weight:900;padding:0;color:var(--tx);display:flex;align-items:center;justify-content:center}
/* CALC */
.calc-display{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:right;font-size:24px;font-weight:800;min-height:64px;word-break:break-all;font-variant-numeric:tabular-nums;overflow-x:auto}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.calc-grid button{padding:17px 0;text-align:center;border-radius:12px;background:var(--card2);border:1px solid var(--bd);font-weight:800;font-size:16px;color:var(--tx)}
.calc-grid button:hover{background:var(--bd)}
.calc-grid button.op{background:rgba(99,102,241,.15);color:var(--pr)}
.calc-grid button.eq{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;grid-column:span 2}
/* SKETCH */
canvas.sketch{width:100%;height:340px;border:1px solid var(--bd);border-radius:12px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.sketch-tools{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.sketch-tools button{padding:11px 0;text-align:center;border-radius:11px;background:var(--card2);border:1px solid var(--bd);font-size:15px;color:var(--tx)}
.sketch-tools button.sel{border-color:var(--pr);background:rgba(99,102,241,.2)}
/* SPEAK */
.speak-btn{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#f43f5e);color:#fff;border:0;font-size:44px;display:flex;align-items:center;justify-content:center;margin:20px auto;box-shadow:0 10px 32px rgba(236,72,153,.4);transition:.2s;padding:0}
.speak-btn.rec{animation:rec 1.3s infinite;background:linear-gradient(135deg,#dc2626,#f43f5e)}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}70%{box-shadow:0 0 0 24px rgba(220,38,38,0)}}
.score-badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:800;margin-left:6px}
.score-good{background:rgba(22,163,74,.2);color:#4ade80}
.score-mid{background:rgba(245,158,11,.2);color:#fbbf24}
.score-bad{background:rgba(220,38,38,.2);color:#fca5a5}
/* TRACK */
.track{display:flex;align-items:center;gap:11px;padding:11px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);margin-bottom:7px}
.track .ic{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;font-size:18px;flex:0 0 auto;color:#fff}
.track .info{flex:1;min-width:0}
.track .info b{font-size:13px;display:block}
.track .info small{color:var(--mut);font-size:11px}
/* MUSIC CARD */
.music-card{background:linear-gradient(135deg,#4c1d95,#5b21b6);color:#fff;border:0;position:relative;overflow:hidden}
html[data-theme=light] .music-card{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}
.music-visual{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:70px;margin:12px 0}
.music-visual span{width:4px;background:rgba(255,255,255,.7);border-radius:3px;height:20%;animation:mv 1.2s infinite ease-in-out}
.music-visual.paused span{animation-play-state:paused;opacity:.35}
@keyframes mv{0%,100%{height:20%}50%{height:100%}}
.vol-row{display:flex;align-items:center;gap:10px;font-size:11.5px;opacity:.9}
.vol-row input{flex:1;padding:0;height:6px;background:rgba(255,255,255,.3);border-radius:9px;appearance:none;border:0}
.vol-row input::-webkit-slider-thumb{appearance:none;width:18px;height:18px;background:#fff;border-radius:50%;cursor:pointer}
/* LB */
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.lb-row:last-child{border-bottom:0}
.lb-row.me{background:rgba(99,102,241,.14);border-radius:11px;padding:10px 12px;border:0;margin-bottom:5px}
.lb-rank{width:28px;font-weight:900;text-align:center;color:var(--mut);font-size:12.5px}
.lb-av{width:36px;height:36px;border-radius:11px;background:rgba(99,102,241,.15);display:grid;place-items:center;font-size:18px}
.lb-info{flex:1;min-width:0}
.lb-info b{font-size:13px;display:block}
.lb-info small{color:var(--mut);font-size:10.5px}
.lb-xp{font-weight:900;color:var(--pr);font-size:13px}
/* STARS */
.stars{display:flex;gap:4px;justify-content:center;font-size:34px;margin:10px 0;cursor:pointer}
.stars span{opacity:.3;transition:.2s;cursor:pointer}
.stars span.on{opacity:1;transform:scale(1.15)}
/* MOOD */
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mood-btn{padding:13px 4px;text-align:center;font-size:11.5px;border-radius:12px;background:var(--card2);border:1px solid var(--bd);color:var(--tx);font-weight:600}
.mood-btn .em{display:block;font-size:28px;margin-bottom:5px}
.mood-hist{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.mood-hist div{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--bg);border:1px solid var(--bd)}
/* PLAN */
.plan-item{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);margin-bottom:7px}
.plan-item.done{opacity:.5}
.plan-item.done .plan-txt b{text-decoration:line-through}
.plan-dot{width:36px;height:36px;border-radius:11px;background:rgba(99,102,241,.15);display:grid;place-items:center;font-size:16px;color:var(--pr);flex:0 0 auto}
.plan-txt{flex:1;min-width:0}
.plan-txt b{font-size:13px;display:block}
.plan-txt small{color:var(--mut);font-size:10.5px}
/* BADGE GRID */
.badge-item{text-align:center;padding:12px 6px;border-radius:12px;background:var(--card2);font-size:10.5px;line-height:1.35;border:1px solid var(--bd)}
.badge-item .ic{font-size:30px;display:block;margin-bottom:5px}
.badge-item.locked{filter:grayscale(1);opacity:.4}
.badge-item b{display:block;font-size:11px;margin-bottom:2px}
/* CHART */
canvas.chart{width:100%;height:180px;display:block}
/* SKELETON */
.sk{background:linear-gradient(90deg,var(--bd),rgba(99,102,241,.1),var(--bd));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:9px;height:14px;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
/* TOGGLE */
.toggle{position:relative;width:44px;height:24px;background:var(--bd);border-radius:99px;cursor:pointer;transition:.2s;flex:0 0 auto}
.toggle.on{background:var(--pr)}

function $id(id) { return document.getElementById(id); }

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return map[c];
  });
}

function today() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function lvlOf(xp) { return Math.floor(xp / 100) + 1; }
function xpIn(xp) { return xp % 100; }
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

function toast(msg) {
  var t = $id('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() {
    t.classList.remove('show');
  }, 2400);
}

function openModal(html) {
  $id('modalContent').innerHTML = html;
  $id('modal').classList.add('show');

function closeModal() {
  $id('modal').classList.remove('show');

function closeOverlay() {

/* ==== SOUND EFFECTS ==== */
var audioCtx = null;
function sfx(type) {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var C = audioCtx;
    var notes, wave, dur;
    if (type === 'benar') { notes = [523.25, 659.25, 783.99, 1046.5]; wave = 'sine'; dur = 0.35; }
    else if (type === 'salah') { notes = [400, 300, 200]; wave = 'sawtooth'; dur = 0.25; }
    else if (type === 'naik') { notes = [659.25, 880, 1108.73, 1318.51]; wave = 'triangle'; dur = 0.5; }
    else if (type === 'klik') { notes = [520]; wave = 'sine'; dur = 0.08; }
    else if (type === 'koin') { notes = [1046.5, 1318.51]; wave = 'square'; dur = 0.15; }
    else if (type === 'salah-besar') { notes = [300, 250, 200, 150]; wave = 'sawtooth'; dur = 0.4; }
    else { notes = [500]; wave = 'sine'; dur = 0.1; }

    for (var i = 0; i < notes.length; i++) {
      (function(freq, idx) {
        var o = C.createOscillator();
        var g = C.createGain();
        o.connect(g);
        g.connect(C.destination);
        o.type = wave;
        o.frequency.value = freq;
        var t = C.currentTime + idx * 0.08;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.15, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t);
        o.stop(t + dur + 0.05);
      })(notes[i], i);
    }
  } catch(e) {}
}

/* ==== API ==== */
function apiAuth(action, payload) {
  var body = { action: action };
  for (var k in payload) {
    if (payload.hasOwnProperty(k)) body[k] = payload[k];
  }
  return fetch(AUTH_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) {
    return r.json().then(function(d) {
      if (!r.ok) throw new Error(d.error || 'Gagal');
      return d;
    });
  });
}

function apiLB() {
  return fetch(LB_ENDPOINT).then(function(r) {
    return r.json();
  }).then(function(d) {
    if (!d.ok) throw new Error(d.error || 'Gagal');
    return d.rows || [];
  });
}

function syncUser() {
  if (!S.nama || !S.password) return;
  apiAuth('update', {
    nama: S.nama,
    password: S.password,
    stats: {
      xp: S.xp,
      coins: S.coins,
      streak: S.streak,
      soal: S.soal,
      benar: S.benar,
      menitFokus: S.menitFokus,
      avatar: S.avatar,
      lastActive: S.lastActive
    }
  }).catch(function(){});
}

var syncTimer;
function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncUser, 1500);
}

function callAI(messages) {
  return fetch(AI_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: messages })
  }).then(function(r) {
    return r.json().then(function(d) {
      if (!r.ok) throw new Error(d.error || 'AI error');
      var text = '';
      if (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) {
        text = d.choices[0].message.content;
      } else if (d.text) {
        text = d.text;
      }
      if (!text) throw new Error('AI tidak merespons');
      return text;
    });
  });
}

function callAIJSON(prompt, system) {
  var msgs = [];
  if (system) msgs.push({ role: 'system', content: system });
  msgs.push({ role: 'user', content: prompt });
  return callAI(msgs).then(function(text) {
    var a = text.indexOf('{');
    var b = text.lastIndexOf('}');
    if (a < 0 || b < a) throw new Error('AI tidak mengembalikan JSON valid');
    return JSON.parse(text.slice(a, b + 1));
  });
}

/* ==== TTS ==== */
function speakText(text, lang) {
  if (!S.tts) return;
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/[^\w\s\.\,\?\!]/g, ''));
    u.lang = lang || 'id-ID';
    u.rate = 0.95;
    u.pitch = 1;
    speechSynthesis.speak(u);
  } catch(e) {}
}

function stopSpeak() {
  try { speechSynthesis.cancel(); } catch(e) {}
}

function submitAuth() {
  var nama = $id('inNama').value.trim();
  var pw = $id('inPw').value;
  var pw2 = authMode === 'register' ? $id('inPw2').value : pw;
  var errEl = $id('authErr');

  function showErr(m) {
    errEl.textContent = m;
    errEl.style.display = 'block';
  }

  errEl.style.display = 'none';

  if (nama.length < 3) return showErr('Nama minimal 3 karakter');
  if (pw.length < 4) return showErr('Password minimal 4 karakter');
  if (authMode === 'register' && pw !== pw2) return showErr('Konfirmasi password tidak sama');

  var btn = $id('authBtn');
  btn.disabled = true;
  btn.textContent = 'Tunggu...';

  var payload = { nama: nama, password: pw };
  if (authMode === 'register') payload.avatar = pickedAvatar;

  apiAuth(authMode, payload)
    .then(function(res) {
      for (var k in res.user) {
        if (res.user.hasOwnProperty(k)) S[k] = res.user[k];
      }
      S.password = pw;
      S.tab = 'belajar';
      S.chatHistory = [];
      S.lastActive = today();
      saveS();
      toast(authMode === 'login' ? '\uD83D\uDC4B Halo, ' + S.nama + '!' : '\uD83C\uDF89 Selamat datang, ' + S.nama + '!');
      sfx('naik');
      render();
    })
    .catch(function(e) {
      showErr(e.message);
      btn.disabled = false;
      btn.textContent = authMode === 'login' ? 'Masuk' : 'Daftar';
    });
}

function logout() {
  if (!confirm('Keluar dari akun?')) return;
  S.nama = '';
  S.password = '';
  S.chatHistory = [];
  saveS();
  authMode = 'login';
  render();
  toast('Sampai jumpa!');

    }

}

  setup.tipe = 'pg';

  mulaiKuis(true, m);
}

/* ==== QUIZ ==== */
var quiz = { soal: [], idx: 0, jawab: [], skor: 0, khusus: null };
var calcExpr = '';

function mulaiKuis(isKhusus, special) {
  var jumlah = setup.n;
  var pg = Math.ceil(jumlah * 0.6);
  var jenis = '';
  if (setup.tipe === 'pg') jenis = jumlah + ' soal pilihan ganda';
  else if (setup.tipe === 'uraian') jenis = jumlah + ' soal uraian';
  else jenis = jumlah + ' soal campuran (' + pg + ' pilihan ganda, ' + (jumlah - pg) + ' uraian)';

  var prompt = 'Buatkan ' + jenis + ' mata pelajaran ' + setup.mapel + ' untuk siswa ' + setup.jenjang + ' kelas ' + setup.kelas + ' di Indonesia (Kurikulum Merdeka). Bahasa Indonesia.';
  if (setup.kisi) prompt += ' Fokus pada materi: ' + setup.kisi + '.';
  prompt += '\n\nBalas HANYA JSON valid tanpa markdown, format:\n';
  prompt += '{"soal":[\n';
  prompt += '  {"tipe":"pg","q":"pertanyaan","opsi":["a","b","c","d"],"jawab":0,"bahas":"penjelasan lengkap 3-5 kalimat: konsep + langkah jawaban + kenapa benar"},\n';
  prompt += '  {"tipe":"uraian","q":"pertanyaan","kunci":"jawaban model ringkas","bahas":"penjelasan lengkap"}\n';
  prompt += ']}\n\n';
  prompt += 'Aturan penting:\n';
  prompt += '- PG: opsi tepat 4, TANPA awalan huruf, "jawab" = indeks 0-3 jawaban benar, acak posisinya\n';
  prompt += '- Uraian: wajib ada field "kunci"\n';
  prompt += '- "bahas" wajib rinci dan jelas\n';
  prompt += '- Soal bervariasi dan spesifik';

  quiz = { soal: [], idx: 0, jawab: [], skor: 0, khusus: isKhusus ? special : null };

  showQuizRoom(buildLoadingHTML());

  callAIJSON(prompt, 'Kamu pembuat soal profesional untuk pelajar Indonesia. Selalu balas dengan JSON valid.')
    .then(function(data) {
      var list = [];
      var raw = data.soal || [];
      for (var i = 0; i < raw.length; i++) {
        var s = raw[i];
        if (!s.q) continue;
        var tipe = s.tipe || 'pg';
        if (tipe === 'uraian') {
          if (!s.kunci) continue;
          list.push({ tipe: 'uraian', q: s.q, kunci: s.kunci, bahas: s.bahas || '' });
        } else {
          if (!Array.isArray(s.opsi) || s.opsi.length !== 4) continue;
          if (typeof s.jawab !== 'number') continue;
          var cleanOpsi = [];
          for (var j = 0; j < 4; j++) {
            cleanOpsi.push(String(s.opsi[j]).replace(/^\s*[a-dA-D][\.\)]\s+/, ''));
          }
          list.push({ tipe: 'pg', q: s.q, opsi: cleanOpsi, jawab: s.jawab, bahas: s.bahas || '' });
        }
      }
      if (list.length === 0) throw new Error('AI tidak menghasilkan soal valid');
      quiz.soal = list;
      renderQuizRoom();
    })
    .catch(function(e) {
      showQuizRoom(buildErrorHTML(e.message));
    });
}

function showQuizRoom(html) {
  var old = $id('quizRoom');
  if (old) old.parentNode.removeChild(old);
  var div = document.createElement('div');
  div.className = 'quiz-room';
  div.id = 'quizRoom';
  div.innerHTML = html;
  document.body.appendChild(div);
  document.body.style.overflow = 'hidden';
}

function closeQuizRoom() {
  var r = $id('quizRoom');
  if (r) r.parentNode.removeChild(r);
  document.body.style.overflow = '';
  closeOverlay();
  stopSpeak();
}

function renderQuizRoom() {
  if (quiz.idx >= quiz.soal.length) {
    renderHasilRoom();
    return;
  }
  var s = quiz.soal[quiz.idx];
  var r = quiz.jawab[quiz.idx];
  var done = !!r;
  var mapel = setup.mapel;
  var butuhKalk = /Matematika|IPA|Fisika|Kimia|Informatika/i.test(mapel);
  var butuhSketsa = /Matematika|IPA|Fisika|Seni/i.test(mapel);
  var persen = (quiz.idx + (done ? 1 : 0)) / quiz.soal.length * 100;

  var body = '';
  if (s.tipe === 'pg') {
    for (var i = 0; i < s.opsi.length; i++) {
      var cls = 'opt';
      if (done) {
        if (i === s.jawab) cls += ' ok';
        else if (i === r.jwb) cls += ' no';
      }
      body += '<button class="' + cls + '" ' + (done ? 'disabled' : '') + ' onclick="jwbPG(' + i + ')">';
      body += '<b>' + String.fromCharCode(65 + i) + '.</b> ' + esc(s.opsi[i]);
      if (done && i === s.jawab) body += '<span class="tick">\u2713</span>';
      body += '</button>';
    }
    if (done) {
      body += '<div class="bahas ' + (r.benar ? 'bahas-ok' : 'bahas-no') + '">';
      body += '<div class="bahas-title">' + (r.benar ? '\u2705 <span style="color:#4ade80">Jawaban Benar!</span>' : '\u274C <span style="color:#fca5a5">Belum Tepat</span>') + '</div>';
      if (!r.benar) {
        body += '<div style="margin-bottom:10px;padding:9px 11px;background:rgba(22,163,74,.15);border-radius:9px;font-size:13px">';
        body += '\uD83D\uDC49 Jawaban benar: <b>' + String.fromCharCode(65 + s.jawab) + '. ' + esc(s.opsi[s.jawab]) + '</b>';
        body += '</div>';
      }
      body += '<div><b>\uD83D\uDCD6 Penjelasan:</b></div>';
      body += '<div style="margin-top:6px">' + esc(s.bahas) + '</div>';
      body += '</div>';
    }
  } else {
    if (!done) {
      body += '<textarea id="ansUraian" placeholder="Tulis jawabanmu di sini..." style="min-height:130px"></textarea>';
      body += '<button class="btn btn-ok btn-block btn-lg" style="margin-top:10px" onclick="jwbUraian()">\u2713 Periksa Jawaban</button>';
    } else {
      body += '<div class="bahas bahas-ok">';
      body += '<div class="bahas-title">\u2705 <span style="color:#4ade80">Jawabanmu</span></div>';
      body += '<div style="margin-bottom:10px">' + esc(r.jwb) + '</div>';
      body += '<div style="padding:10px;background:rgba(99,102,241,.1);border-radius:9px;margin-bottom:10px;font-size:12.5px">';
      body += '<b>\uD83D\uDD11 Kunci:</b> ' + esc(s.kunci);
      body += '</div>';
      body += '<div><b>\uD83D\uDCD6 Penjelasan:</b></div>';
      body += '<div style="margin-top:6px">' + esc(s.bahas) + '</div>';
      body += '</div>';
    }
  }

  var html = '';
  html += '<div class="quiz-header">';
  html += '<div class="quiz-top">';
  html += '<div class="quiz-chips">';
  html += '<span class="chip">' + esc(mapel) + '</span>';
  html += '<span class="chip">Kelas ' + setup.kelas + '</span>';
  html += (quiz.khusus ? '<span class="chip chip-yl">' + quiz.khusus.emo + ' ' + esc(quiz.khusus.nama) + '</span>' : '');
  html += '</div>';
  html += '<button class="quiz-close" onclick="closeQuizRoom()">\u2715</button>';
  html += '</div>';
  html += '<div class="quiz-prog"><i style="width:' + persen + '%"></i></div>';
  html += '</div>';

  html += '<div class="quiz-body">';
  html += '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px">';
  html += '<div>';
  html += '<div style="font-size:11px;color:var(--mut);font-weight:800;letter-spacing:1.5px">SOAL</div>';
  html += '<div class="quiz-num">' + (quiz.idx + 1) + '<span>/' + quiz.soal.length + '</span></div>';
  html += '</div>';
  html += '<div style="text-align:right;font-size:11.5px;color:var(--mut)">';
  html += '<div>Skor: <b style="color:#4ade80;font-size:15px">' + quiz.skor + '</b></div>';
  html += '<div>' + (s.tipe === 'pg' ? 'Pilihan Ganda' : 'Uraian') + '</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="quiz-q-card">';
  html += '<div class="quiz-q-text">' + esc(s.q) + '</div>';
  html += body;
  html += '<div class="quiz-tools">';
  if (butuhKalk) html += '<button onclick="openCalc()">\uD83E\uDDEE Kalkulator</button>';
  if (butuhSketsa) html += '<button onclick="openSketch()">\u270F\uFE0F Sketsa</button>';
  html += '<button onclick="bacakanSoal()">\uD83D\uDD0A Bacakan Soal</button>';
  html += '<button onclick="stopSpeak()">\uD83D\uDD07 Stop</button>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="quiz-nav"><div class="quiz-nav-inner">';
  if (done) {
    html += '<button onclick="lanjutSoal()">';
    html += (quiz.idx + 1 === quiz.soal.length ? '\uD83C\uDFC1 Lihat Nilai' : '\u2192 Soal Berikutnya');
    html += '</button>';
  }
  html += '</div></div>';

  var r_ = $id('quizRoom');
  if (r_) r_.innerHTML = html;
}

function jwbPG(i) {
  var s = quiz.soal[quiz.idx];
  var benar = i === s.jawab;
  quiz.jawab[quiz.idx] = { jwb: i, benar: benar };
  if (benar) {
    quiz.skor++;
    S.benar++;
    S.xp += 20;
    sfx('benar');
    toast('\uD83C\uDF89 Benar! +20 XP');
  } else {
    sfx('salah');
  }
  S.soal++;
  saveS();
  scheduleSync();
  renderQuizRoom();
  setTimeout(function() {
    var b = document.querySelector('.bahas');
    if (b) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 120);
}

function jwbUraian() {
  var el = $id('ansUraian');
  var t = el ? el.value.trim() : '';
  if (!t) return toast('Tulis jawaban dulu');
  quiz.jawab[quiz.idx] = { jwb: t, benar: true };
  S.soal++;
  S.xp += 15;
  saveS();
  scheduleSync();
  sfx('benar');
  renderQuizRoom();
}

function lanjutSoal() {
  quiz.idx++;
  if (quiz.idx >= quiz.soal.length) {
    renderHasilRoom();
  } else {
    renderQuizRoom();
    window.scrollTo(0, 0);
  }
}

function bacakanSoal() {
  var s = quiz.soal[quiz.idx];
  var teks = s.q;
  if (s.tipe === 'pg') {
    for (var i = 0; i < s.opsi.length; i++) {
      teks += '. ' + String.fromCharCode(65 + i) + '. ' + s.opsi[i];
    }
  }
  speakText(teks, 'id-ID');
  toast('\uD83D\uDD0A Membacakan soal...');
}

function renderHasilRoom() {
  var total = quiz.soal.length;
  var nilai = Math.round(quiz.skor / total * 100);
  var lulus = nilai >= setup.kkm;
  var xpDapat = quiz.skor * 20 + (lulus ? 50 : 0);

  S.riwayat.unshift({
    tgl: today(),
    mapel: setup.mapel,
    nilai: nilai,
    benar: quiz.skor,
    total: total
  });
  S.riwayat = S.riwayat.slice(0, 30);
  S.xp += xpDapat;
  S.coins += (lulus ? 10 : 3);
  saveS();
  scheduleSync();

  var reaksi = lulus
    ? ['\uD83C\uDF89', '\uD83C\uDFC6', '\uD83D\uDD25', '\u2B50']
    : ['\uD83D\uDCAA', '\uD83C\uDF31', '\uD83E\uDD17'];

  var html = '';
  html += '<div class="quiz-header">';
  html += '<div class="quiz-top">';
  html += '<span class="chip">\uD83C\uDFC1 Hasil Kuis</span>';
  html += '<button class="quiz-close" onclick="closeQuizRoom()">\u2715 Tutup</button>';
  html += '</div>';
  html += '</div>';

  html += '<div class="quiz-body" style="padding-bottom:40px">';

  html += '<div class="quiz-q-card" style="text-align:center;' + (lulus ? 'background:linear-gradient(160deg,rgba(22,163,74,.15),rgba(99,102,241,.1));border-color:rgba(22,163,74,.4)' : '') + '">';
  html += '<div style="font-size:76px">' + (nilai >= 90 ? '\uD83C\uDFC6' : lulus ? '\uD83E\uDD47' : '\uD83C\uDF31') + '</div>';
  html += '<div class="reaction">';
  for (var ri = 0; ri < Math.min(3, reaksi.length); ri++) {

/* ==== KALKULATOR ==== */
var CALC_KEYS = ['C', 'DEL', '(', ')', '7', '8', '9', '/', '4', '5', '6', 'x', '1', '2', '3', '-', '0', '.', '^', '+', 'sqrt('];

function openCalc() {
  var html = '';
  html += '<div class="overlay-header">';
  html += '<h3>\uD83E\uDDEE Kalkulator</h3>';
  html += '<button class="overlay-close" onclick="closeOverlay()">\u2715</button>';
  html += '</div>';
  html += '<div class="calc-display" id="cd">' + (calcExpr || '0') + '</div>';
  html += '<div class="calc-grid">';
  for (var i = 0; i < CALC_KEYS.length; i++) {
    var k = CALC_KEYS[i];
    var isOp = ['/', 'x', '-', '+', '^', 'sqrt('].indexOf(k) >= 0;
    var disp = k === 'DEL' ? '\u232B' : (k === 'sqrt(' ? '\u221A' : k);
    html += '<button class="' + (isOp ? 'op' : '') + '" onclick="ckey(\'' + k + '\')">' + disp + '</button>';
  }
  html += '<button class="eq" onclick="ckey(\'=\')">=</button>';
  html += '</div>';
  openOverlay(html);
}

function ckey(k) {
  if (calcExpr === 'Error') calcExpr = '';
  if (k === 'C') calcExpr = '';
  else if (k === 'DEL') calcExpr = calcExpr.slice(0, -1);
  else if (k === '=') {
    try { calcExpr = String(Math.round(evalCalc(calcExpr) * 1e9) / 1e9); }
    catch(e) { calcExpr = 'Error'; }
  }
  else if (k === 'sqrt(') calcExpr += 'sqrt(';
  else calcExpr += k;

  var d = $id('cd');
  if (d) d.textContent = calcExpr || '0';
}

function evalCalc(s) {
  s = s.replace(/x/g, '*').replace(/sqrt\(/g, 'Math.sqrt(').replace(/\^/g, '**');
  var i = 0;

  function ex() {
    var v = tm();
    while (s[i] === '+' || s[i] === '-') {
      var o = s[i++];
      var y = tm();
      v = o === '+' ? v + y : v - y;
    }
    return v;
  }
  function tm() {
    var v = pw();
    while (s[i] === '*' || s[i] === '/') {
      var o = s[i++];
      var y = pw();
      v = o === '*' ? v * y : v / y;
    }
    return v;
  }
  function pw() {
    var b = un();
    if (s[i] === '*' && s[i+1] === '*') {
      i += 2;
      return Math.pow(b, pw());
    }
    return b;
  }
  function un() {
    if (s[i] === '-') { i++; return -un(); }
    return at();
  }
  function at() {
    if (s[i] === '(') {
      i++;
      var v = ex();
      if (s[i] !== ')') throw new Error('Syntax');
      i++;
      return v;
    }
    if (s.slice(i).indexOf('Math.sqrt(') === 0) {
      i += 10;
      var v2 = ex();
      if (s[i] !== ')') throw new Error('Syntax');
      i++;
      return Math.sqrt(v2);
    }
    var m = /^\d*\.?\d+/.exec(s.slice(i));
    if (!m) throw new Error('Syntax');
    i += m[0].length;
    return parseFloat(m[0]);
  }

  var v = ex();
  if (i < s.length || !isFinite(v)) throw new Error('Syntax');
  return v;
}

  }

  }

function setSkColor(c) {
  sketchState.color = c;
  var btns = document.querySelectorAll('.sketch-tools button');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    if (b.getAttribute('data-color')) {
      b.classList.toggle('sel', b.getAttribute('data-color') === c);
    }
  }
}

function sketchInit() {
  var c = $id('sketchCanvas');
  if (!c) return;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function getPos(e) {
    var r = c.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return {
      x: (t.clientX - r.left) * c.width / r.width,
      y: (t.clientY - r.top) * c.height / r.height
    };
  }

  function start(e) {
    e.preventDefault();
    sketchState.drawing = true;
    var p = getPos(e);
    sketchState.lastX = p.x;
    sketchState.lastY = p.y;
  }

  function move(e) {
    if (!sketchState.drawing) return;
    e.preventDefault();
    var p = getPos(e);
    ctx.strokeStyle = sketchState.color;
    ctx.lineWidth = sketchState.size;
    ctx.beginPath();
    ctx.moveTo(sketchState.lastX, sketchState.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    sketchState.lastX = p.x;
    sketchState.lastY = p.y;
  }

  function end() { sketchState.drawing = false; }

  c.addEventListener('mousedown', start);
  c.addEventListener('mousemove', move);
  c.addEventListener('mouseup', end);
  c.addEventListener('mouseleave', end);
  c.addEventListener('touchstart', start, { passive: false });
  c.addEventListener('touchmove', move, { passive: false });
  c.addEventListener('touchend', end);
}

function sketchClear() {
  var c = $id('sketchCanvas');
  if (!c) return;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  toast('\uD83D\uDDD1\uFE0F Sketsa dibersihkan');
}

  var i = $id('chatIn');

  typ.className = 'typing';
  typ.innerHTML = '<i></i><i></i><i></i>';

  var msgs = [{ role: 'system', content: 'Kamu Tutor AI ramah untuk pelajar Indonesia. Jawab singkat, bahasa sederhana, tanpa markdown.' }];
  var start = Math.max(0, S.chatHistory.length - 8);
  for (var k = start; k < S.chatHistory.length; k++) {
    var m = S.chatHistory[k];
    msgs.push({ role: m.r === 'bot' ? 'assistant' : 'user', content: m.t });
  }

  callAI(msgs)
    .then(function(text) {
      if (typ.parentNode) typ.parentNode.removeChild(typ);
      S.chatHistory.push({ r: 'bot', t: text });
      S.xp += 2;
      saveS();
      scheduleSync();
      renderChat();
    })
    .catch(function(e) {
      if (typ.parentNode) typ.parentNode.removeChild(typ);
      S.chatHistory.push({ r: 'bot', t: 'Maaf, AI error.\n\n' + e.message + '\n\nCek /api/chat di browser.' });
      saveS();
      renderChat();
    });
}

  html += '<div class="bar" style="margin:12px 0"><i style="width:' + ((speak.idx / speak.sentences.length) * 100) + '%"></i></div>';

  html += '<div style="font-size:19px;font-weight:800;line-height:1.5;margin:18px 0;padding:18px;background:var(--bg);border-radius:14px">' + esc(s.q) + '</div>';
  if (s.id) {
    html += '<p style="color:var(--mut);font-size:12.5px;font-style:italic;margin:0">"' + esc(s.id) + '"</p>';
  }

  html += '<button class="btn btn-ghost" style="margin-top:14px" onclick="bacakanTarget()">\uD83D\uDD0A Dengar Contoh</button>';

  html += '<button class="speak-btn ' + (speak.recording ? 'rec' : '') + '" onclick="toggleSpeakRec()">' + (speak.recording ? '\u23F9' : '\uD83C\uDFA4') + '</button>';

  html += '<p style="color:var(--mut);font-size:12.5px;margin-top:6px">' + (speak.recording ? '\uD83D\uDD34 Sedang merekam... ketuk untuk stop' : 'Ketuk mikrofon untuk mulai merekam') + '</p>';

  if (speak.transcript) {
    html += '<div style="margin-top:16px;text-align:left;background:var(--bg);border-radius:12px;padding:12px">';
    html += '<b style="font-size:12.5px">\uD83D\uDCDD Yang AI dengar:</b>';
    html += '<p style="font-size:13px;margin:6px 0 0">' + esc(speak.transcript) + '</p>';
    html += '</div>';
  }

  if (speak.result) {
    html += renderSpeakResult();
  }

  html += '</div>';
  el.innerHTML = html;
}

function bacakanTarget() {
  var s = speak.sentences[speak.idx];
  speakText(s.q, speak.lang);
}

function toggleSpeakRec() {
  if (speak.recording) {
    stopSpeakRec();
    return;
  }
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) {
    return toast('Browser tidak mendukung. Coba Chrome/Edge.');
  }

  var rec = new Rec();
  rec.lang = speak.lang;
  rec.interimResults = false;
  rec.continuous = false;

  rec.onresult = function(e) {
    var t = e.results[0][0].transcript;
    speak.transcript = t;
    stopSpeakRec();
    nilaiSpeak(t);
  };

  rec.onerror = function(e) {
    toast('Error: ' + e.error);
    stopSpeakRec();
  };

  rec.onend = function() {
    if (speak.recording) stopSpeakRec();
  };

  try {
    rec.start();
    speak.rec = rec;
    speak.recording = true;
    speak.transcript = '';
    speak.result = null;
    renderSpeakArea();
  } catch(e) {
    toast('Gagal mulai: ' + e.message);
  }
}

function stopSpeakRec() {
  speak.recording = false;
  try { if (speak.rec) speak.rec.stop(); } catch(e) {}
  renderSpeakArea();
}

function nilaiSpeak(hasil) {
  var s = speak.sentences[speak.idx];
  var target = s.q.toLowerCase().replace(/[^\w\s]/g, '');
  var got = hasil.toLowerCase().replace(/[^\w\s]/g, '');
  var tWords = target.split(/\s+/).filter(function(x) { return x; });
  var gWords = got.split(/\s+/).filter(function(x) { return x; });
  var match = 0;
  for (var i = 0; i < tWords.length; i++) {
    if (gWords.indexOf(tWords[i]) >= 0) match++;
  }
  var simple = Math.round((match / tWords.length) * 100);

  callAIJSON(
    'Kamu guru bahasa yang ramah. Nilai pengucapan siswa.\n\n'
    + 'Kalimat target: "' + s.q + '"\n'
    + 'Yang didengar AI: "' + hasil + '"\n'
    + 'Skor kemiripan kata: ' + simple + '%\n\n'
    + 'Berikan penilaian dalam Bahasa Indonesia yang ramah dan membangun.\n'
    + 'Balas HANYA JSON: {"skor":0-100,"kesalahan":["kata salah 1"],"saran":"saran perbaikan 1-2 kalimat","apresiasi":"kata penyemangat singkat"}',
    'Kamu penilai speaking ramah. JSON valid.'
  ).then(function(data) {
    speak.result = data;
    sfx(speak.result.skor >= 70 ? 'benar' : 'salah');
    S.xp += Math.round(speak.result.skor / 10);
    saveS();
    scheduleSync();
    renderSpeakArea();
  }).catch(function() {
    speak.result = { skor: simple, kesalahan: [], saran: '', apresiasi: 'Bagus, terus berlatih!' };
    renderSpeakArea();
  });
}

function renderSpeakResult() {
  var r = speak.result;
  if (!r) return '';
  var skor = r.skor || 0;
  var cls = skor >= 80 ? 'score-good' : (skor >= 60 ? 'score-mid' : 'score-bad');
  var emoji = skor >= 80 ? '\uD83C\uDF1F' : (skor >= 60 ? '\uD83D\uDC4D' : '\uD83D\uDCAA');
  var label = skor >= 80 ? 'Sangat Baik' : (skor >= 60 ? 'Baik' : 'Perlu Latihan');

  var html = '';
  html += '<div style="text-align:left;margin-top:16px;background:var(--bg);border-radius:12px;padding:14px;border:1px solid var(--bd)">';
  html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">';
  html += '<div style="font-size:34px">' + emoji + '</div>';
  html += '<div style="flex:1">';
  html += '<div style="font-size:14px;font-weight:800">Skor Pengucapan</div>';
  html += '<div style="font-size:28px;font-weight:900;color:var(--pr)">' + skor + '<span style="font-size:14px;color:var(--mut)">/100</span></div>';
  html += '</div>';
  html += '<div class="score-badge ' + cls + '">' + label + '</div>';
  html += '</div>';

  if (r.kesalahan && r.kesalahan.length) {
    html += '<div style="margin-top:10px"><b style="font-size:12.5px">\u26A0\uFE0F Perhatikan:</b>';
    html += '<ul style="margin:6px 0 0 20px;padding:0;font-size:12.5px">';
    for (var i = 0; i < r.kesalahan.length; i++) {
      html += '<li>' + esc(r.kesalahan[i]) + '</li>';
    }
    html += '</ul></div>';
  }

  if (r.saran) {
    html += '<div style="margin-top:10px;padding:10px;background:rgba(99,102,241,.1);border-radius:9px;font-size:12.5px">';
    html += '<b>\uD83D\uDCA1 Saran:</b> ' + esc(r.saran);
    html += '</div>';
  }

  html += '<div style="margin-top:12px;font-size:13px;text-align:center;font-weight:700;color:#4ade80">' + esc(r.apresiasi || '') + '</div>';
  html += '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="nextSpeak()">Kalimat Berikutnya \u2192</button>';
  html += '</div>';
  return html;
}

function nextSpeak() {
  speak.idx++;
  speak.transcript = '';
  speak.result = null;
  renderSpeakArea();
}

];

var music = {
  current: null,
  ctx: null,
  nodes: [],
  volume: 0.4,
  playing: false,
  masterGain: null
};

function musicInitUI() {
  updateNowPlaying();
}

function updateNowPlaying() {
  var el = $id('nowPlaying');
  if (!el) return;
  if (music.current) {
    var found = null;
    for (var i = 0; i < SOUNDS.length; i++) {
      if (SOUNDS[i].id === music.current) { found = SOUNDS[i]; break; }
    }
    el.textContent = (found ? found.emo + ' ' + found.name : music.current) + (music.playing ? ' \u2022 memutar' : '');
  } else {
    el.textContent = 'Tidak ada musik';
  }
}

function musicSetVol() {
  if (music.masterGain) {
    try { music.masterGain.gain.value = music.volume; } catch(e) {}
  }
}

function stopSound() {
  try {
    for (var i = 0; i < music.nodes.length; i++) {
      try { music.nodes[i].stop(); } catch(e) {}
    }
    if (music.ctx) try { music.ctx.close(); } catch(e) {}
  } catch(e) {}
  music.nodes = [];
  music.ctx = null;
  music.current = null;
  music.playing = false;
  updateNowPlaying();
}

function playSound(id) {
  if (music.current === id && music.playing) {
    stopSound();
    return;
  }
  stopSound();

  try {
    var C = new (window.AudioContext || window.webkitAudioContext)();
    music.ctx = C;
    music.masterGain = C.createGain();
    music.masterGain.gain.value = music.volume;
    music.masterGain.connect(C.destination);
    music.current = id;
    music.playing = true;

    if (id === 'rain') makeRain(C);
    else if (id === 'waves') makeWaves(C);
    else if (id === 'forest') makeForest(C);
    else if (id === 'fire') makeFire(C);
    else if (id === 'white') makeNoise(C, 'white');
    else if (id === 'brown') makeNoise(C, 'brown');
    else if (id === 'piano') makePiano(C);
    else if (id === 'chimes') makeChimes(C);
    else if (id === 'zen') makeZen(C);

    updateNowPlaying();
    toast('\uD83C\uDFB5 Memutar: ' + id);
  } catch(e) {
    toast('Audio gagal dimulai');
  }
}

function makeNoiseBuffer(ctx, type) {
  var bs = ctx.sampleRate * 2;
  var buf = ctx.createBuffer(1, bs, ctx.sampleRate);
  var d = buf.getChannelData(0);
  var last = 0;
  for (var i = 0; i < bs; i++) {
    var w = Math.random() * 2 - 1;
    if (type === 'white') d[i] = w * 0.5;
    else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  }
  return buf;
}

function makeNoise(ctx, type) {
  var src = ctx.createBufferSource();
  src.buffer = makeNoiseBuffer(ctx, type);
  src.loop = true;
  var f = ctx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = type === 'brown' ? 500 : 2000;
  var g = ctx.createGain();
  g.gain.value = 0.4;
  src.connect(f);
  f.connect(g);
  g.connect(music.masterGain);
  src.start();
  music.nodes.push(src);
}

function makeRain(ctx) {
  var src = ctx.createBufferSource();
  src.buffer = makeNoiseBuffer(ctx, 'brown');
  src.loop = true;
  var hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 400;
  var lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 4000;
  var g = ctx.createGain();
  g.gain.value = 0.5;
  src.connect(hp);
  hp.connect(lp);
  lp.connect(g);
  g.connect(music.masterGain);
  src.start();
  music.nodes.push(src);

  var drop = function() {
    if (!music.playing) return;
    try {
      var o = ctx.createOscillator(), gg = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 1200 + Math.random() * 800;
      gg.gain.setValueAtTime(0.08, ctx.currentTime);
      gg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      o.connect(gg);
      gg.connect(music.masterGain);
      o.start();
      o.stop(ctx.currentTime + 0.15);
    } catch(e) {}
    setTimeout(drop, 80 + Math.random() * 200);
  };
  drop();
}

function makeWaves(ctx) {
  var src = ctx.createBufferSource();
  src.buffer = makeNoiseBuffer(ctx, 'brown');
  src.loop = true;
  var lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 800;
  var g = ctx.createGain();
  g.gain.value = 0.3;
  src.connect(lp);
  lp.connect(g);
  g.connect(music.masterGain);
  var lfo = ctx.createOscillator();
  lfo.frequency.value = 0.15;
  var lg = ctx.createGain();
  lg.gain.value = 0.2;
  lfo.connect(lg);
  lg.connect(g.gain);
  lfo.start();
  src.start();
  music.nodes.push(src, lfo);
}

function makeForest(ctx) {
  makeNoise(ctx, 'white');
  var chirp = function() {
    if (!music.playing) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      var base = 1800 + Math.random() * 1500;
      o.frequency.setValueAtTime(base, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(base * 1.5, ctx.currentTime + 0.08);
      o.frequency.exponentialRampToValueAtTime(base, ctx.currentTime + 0.16);
      g.gain.setValueAtTime(0.05, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      o.connect(g);
      g.connect(music.masterGain);
      o.start();
      o.stop(ctx.currentTime + 0.25);
    } catch(e) {}
    setTimeout(chirp, 1500 + Math.random() * 3500);
  };
  chirp();
}

function makeFire(ctx) {
  var src = ctx.createBufferSource();
  src.buffer = makeNoiseBuffer(ctx, 'brown');
  src.loop = true;
  var lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 1000;
  var g = ctx.createGain();
  g.gain.value = 0.35;
  src.connect(lp);
  lp.connect(g);
  g.connect(music.masterGain);
  src.start();
  music.nodes.push(src);

  var crackle = function() {
    if (!music.playing) return;
    try {
      if (Math.random() < 0.7) {
        var o = ctx.createOscillator(), gg = ctx.createGain();
        o.type = 'square';
        o.frequency.value = 200 + Math.random() * 1800;
        gg.gain.setValueAtTime(0.04, ctx.currentTime);
        gg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        o.connect(gg);
        gg.connect(music.masterGain);
        o.start();
        o.stop(ctx.currentTime + 0.05);
      }
    } catch(e) {}
    setTimeout(crackle, 30 + Math.random() * 150);
  };
  crackle();
}

function makePiano(ctx) {
  var notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
  var idx = 0;
  var play = function() {
    if (!music.playing) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = notes[idx % notes.length];
      var t = ctx.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.12, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
      o.connect(g);
      g.connect(music.masterGain);
      o.start(t);
      o.stop(t + 2);
      idx++;
    } catch(e) {}
    setTimeout(play, 700 + Math.random() * 800);
  };
  play();
}

function makeChimes(ctx) {
  var notes = [523.25, 659.25, 783.99, 1046.5];
  var play = function() {
    if (!music.playing) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = notes[Math.floor(Math.random() * notes.length)];
      var t = ctx.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.08, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 3);
      o.connect(g);
      g.connect(music.masterGain);
      o.start(t);
      o.stop(t + 3);
    } catch(e) {}
    setTimeout(play, 900 + Math.random() * 2200);
  };
  play();
}

function makeZen(ctx) {
  var drone = ctx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 110;
  var dg = ctx.createGain();
  dg.gain.value = 0.15;
  drone.connect(dg);
  dg.connect(music.masterGain);
  drone.start();
  music.nodes.push(drone);

  var notes = [220, 261.63, 329.63];
  var play = function() {
    if (!music.playing) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = notes[Math.floor(Math.random() * notes.length)];
      var t = ctx.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.06, t + 0.5);
      g.gain.exponentialRampToValueAtTime(0.001, t + 4);
      o.connect(g);
      g.connect(music.masterGain);
      o.start(t);
      o.stop(t + 4);
    } catch(e) {}
    setTimeout(play, 2000 + Math.random() * 3000);
  };
  play();
}

var pomo = { int: null, sisa: 0, total: 0 };
function startPomodoro(m) {
  if (pomo.int) clearInterval(pomo.int);
  pomo.total = m * 60;
  pomo.sisa = pomo.total;
  if (m >= 15) playSound('rain');

  var el = $id('pomodoroArea');
  var render = function() {
    if (!el) return;
    var mm = Math.floor(pomo.sisa / 60);
    var ss = pomo.sisa % 60;
    var icon = m >= 15 ? '\uD83D\uDCDA' : '\u2615';
    var label = m >= 15 ? 'Sesi Fokus' : 'Istirahat';
    el.innerHTML = '<div style="background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px">'
      + '<div style="font-size:26px">' + icon + '</div>'
      + '<div style="flex:1">'
      + '<b style="font-size:26px;font-variant-numeric:tabular-nums">' + mm + ':' + String(ss).padStart(2, '0') + '</b>'
      + '<div style="font-size:11px;color:var(--mut)">' + label + '</div>'
      + '</div>'
      + '<button class="btn btn-secondary btn-sm" onclick="stopPomodoro()">\u23F9</button>'
      + '</div>';
  };
  render();

  pomo.int = setInterval(function() {
    pomo.sisa--;
    render();
    if (pomo.sisa <= 0) {
      clearInterval(pomo.int);
      pomo.int = null;
      sfx('naik');
      S.xp += Math.round(pomo.total / 60) * 2;
      S.menitFokus += Math.round(pomo.total / 60);
      saveS();
      scheduleSync();
      toast('\uD83C\uDF89 Selesai! +' + (Math.round(pomo.total / 60) * 2) + ' XP');
      stopSound();

function alatInit() {
  var el = $id('alatContent');
  if (!el) return;

  if (alatTab === 'notes') el.innerHTML = alatNotes();
  else if (alatTab === 'calc') el.innerHTML = alatCalc();
  else if (alatTab === 'planner') el.innerHTML = alatPlanner();
  else if (alatTab === 'mood') el.innerHTML = alatMood();

  if (alatTab === 'planner') {
    setTimeout(function() {

function alatNotes() {
  var html = '<div class="card">';
  html += '<div class="card-header"><h3>\uD83D\uDCDD Catatan Belajar</h3></div>';
  html += '<p style="color:var(--mut);font-size:11.5px;margin-bottom:10px">Otomatis tersimpan di perangkatmu.</p>';
  html += '<textarea id="notesTxt" placeholder="Tulis rangkuman atau catatan penting di sini..." style="min-height:260px" oninput="S.notes=this.value;saveS()">' + esc(S.notes || '') + '</textarea>';

  html += '<button class="btn btn-danger btn-sm" onclick="notesClear()">\uD83D\uDDD1\uFE0F Hapus</button>';

function notesSave() {
  var el = $id('notesTxt');
  if (el) S.notes = el.value;
  saveS();
  toast('\uD83D\uDCBE Catatan tersimpan');
}

function notesCopy() {
  var el = $id('notesTxt');
  if (!el) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value).then(function() {
      toast('\uD83D\uDCCB Tercopy!');
    }, function() {
      toast('Gagal copy');
    });
  } else {
    toast('Browser tidak mendukung');
  }
}

function notesClear() {
  if (!confirm('Hapus semua catatan?')) return;
  S.notes = '';
  saveS();
  alatInit();
  toast('\uD83D\uDDD1\uFE0F Catatan dihapus');
}

function alatCalc() {
  var html = '<div class="card">';
  html += '<div class="card-header"><h3>\uD83E\uDDEE Kalkulator</h3></div>';
  html += '<div class="calc-display" id="cd">' + (calcExpr || '0') + '</div>';
  html += '<div class="calc-grid">';
  for (var i = 0; i < CALC_KEYS.length; i++) {
    var k = CALC_KEYS[i];
    var isOp = ['/', 'x', '-', '+', '^', 'sqrt('].indexOf(k) >= 0;
    var disp = k === 'DEL' ? '\u232B' : (k === 'sqrt(' ? '\u221A' : k);
    html += '<button class="' + (isOp ? 'op' : '') + '" onclick="ckey(\'' + k + '\')">' + disp + '</button>';
  }
  html += '<button class="eq" onclick="ckey(\'=\')">=</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

function alatPlanner() {
  var html = '<div class="card">';
  html += '<div class="card-header"><h3>\uD83D\uDCC5 Jadwal Belajar</h3></div>';
  html += '<label style="margin-top:0">Kegiatan</label>';
  html += '<input id="plNama" placeholder="Contoh: Belajar SPLDV bab 3">';
  html += '<label>Tanggal</label>';
  html += '<input id="plTgl" type="date">';
  html += '<label>Jam</label>';
  html += '<input id="plJam" type="time">';
  html += '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="plAdd()">\u2795 Tambah Jadwal</button>';
  html += '</div>';
  html += '<div id="plList"></div>';
  return html;
}

function plAdd() {
  var n = $id('plNama').value.trim();
  var t = $id('plTgl').value;
  var j = $id('plJam').value;
  if (!n) return toast('Isi kegiatannya dulu');
  S.planner.push({
    id: Date.now(),
    nama: n,
    tgl: t || today(),
    jam: j || '--:--',
    done: false
  });
  S.planner.sort(function(a, b) {
    return (a.tgl + a.jam).localeCompare(b.tgl + b.jam);
  });
  saveS();
  renderPlanner();
  $id('plNama').value = '';
  sfx('klik');
  toast('\uD83D\uDCC5 Jadwal ditambahkan');
}

function renderPlanner() {
  var el = $id('plList');
  if (!el) return;
  if (!S.planner.length) {
    el.innerHTML = '<div class="card" style="text-align:center;padding:24px"><div style="font-size:38px">\uD83D\uDCED</div><p style="color:var(--mut);font-size:12.5px;margin-top:6px">Belum ada jadwal.</p></div>';
    return;
  }
  var html = '<div class="card">';
  html += '<b style="font-size:14px;display:block;margin-bottom:10px">\uD83D\uDCCB Daftar Jadwal (' + S.planner.length + ')</b>';
  for (var i = 0; i < S.planner.length; i++) {
    var p = S.planner[i];
    html += '<div class="plan-item ' + (p.done ? 'done' : '') + '">';
    html += '<div class="plan-dot">' + (p.done ? '\u2705' : '\uD83D\uDCCC') + '</div>';
    html += '<div class="plan-txt"><b>' + esc(p.nama) + '</b><small>' + p.tgl + ' \u2022 ' + p.jam + '</small></div>';
    html += '<button class="btn btn-ghost btn-sm" onclick="plToggle(' + p.id + ')">' + (p.done ? '\u21A9' : '\u2714') + '</button>';
    html += '<button class="btn btn-ghost btn-sm" style="color:#fca5a5" onclick="plDel(' + p.id + ')">\u2715</button>';
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function plToggle(id) {
  for (var i = 0; i < S.planner.length; i++) {
    if (S.planner[i].id === id) {
      S.planner[i].done = !S.planner[i].done;
      if (S.planner[i].done) {
        S.xp += 10;
        sfx('benar');
        toast('\u2714\uFE0F Selesai! +10 XP');
      }
      break;
    }
  }
  saveS();
  scheduleSync();
  renderPlanner();
}

function plDel(id) {
  S.planner = S.planner.filter(function(x) { return x.id !== id; });
  saveS();
  renderPlanner();
}
