t=t.replace(/```json|```/g,"").trim();
const a=t.indexOf("{"),b=t.lastIndexOf("}");
if(a<0||b<a)throw new Error("Jawaban AI tidak terbaca, coba lagi.");
return JSON.parse(t.slice(a,b+1));
}catch(e){lastErr=e}
}
throw new Error("AI lagi error format jawabannya. Coba tekan Mulai Kuis sekali lagi, atau kurangi jumlah soal.");
}}}

function calc(s){let i=0;const ex=()=>{let v=tm();while(s[i]=="+"||s[i]=="-"){const o=s[i++],y=tm();v=o=="+"?v+y:v-y}return v},tm=()=>{let v=pw();while(s[i]=="×"||s[i]=="÷"){const o=s[i++],y=pw();v=o=="×"?v*y:v/y}return v},pw=()=>{const b=un();if(s[i]=="^"){i++;return Math.pow(b,pw())}return b},un=()=>{if(s[i]=="-"){i++;return -un()}if(s[i]=="√"){i++;return Math.sqrt(un())}return at()},at=()=>{if(s[i]=="("){i++;const v=ex();if(s[i]!=")")throw 0;i++;return v}const m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};const v=ex();if(i<s.length||!isFinite(v))throw 0;return v}

 <div class="card"><b>${esc(q.q)}</b>${q.svg?`<img class="gb" alt="gambar soal" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(q.svg)}">`:""}<div style="margin-top:14px">${body}</div></div>
 <div id="tp"></div>
 ${done?`<button class="go" onclick="lanjut()">${st.i+1==st.soal.length?"🏁 Lihat Nilai":"Soal Berikutnya ➜"}</button>`:""}`;renderTools();
}
function jwb(k){st.res[st.i]={skor:k==st.soal[st.i].jawab?1:0,jwb:k};soal()}
async function cek(){
 const t=$("ans").value.trim();if(!t)return;
 const b=$("cek");b.disabled=true;b.textContent="⏳ Lagi diperiksa...";
 const q=st.soal[st.i];
 try{
  const sample=await aiSample();
  const r=await sample.json(`Kamu guru yang adil. Nilai jawaban siswa. Soal: ${q.q}\nKunci/jawaban model: ${q.kunci}\nJawaban siswa: """${t.slice(0,1500)}"""\nBalas HANYA JSON: {"skor":0-100,"fb":"umpan balik 1-3 kalimat, ramah: bagian yang sudah benar dan yang kurang"}. Terima jawaban yang maknanya benar walau kata-katanya beda.`);
  st.res[st.i]={skor:Math.max(0,Math.min(100,Number(r.skor)||0))/100,jwb:t,fb:r.fb||""};
 }catch(e){st.res[st.i]={skor:null,jwb:t,manual:true}}
 soal();
}
function manual(v){st.res[st.i].skor=v;st.res[st.i].manual=false;st.res[st.i].fb="";soal()}
function lanjut(){if(st.i+1<st.soal.length){st.i++;soal()}else hasil()}

function hasil(){
 const tot=st.res.reduce((a,r)=>a+(r?r.skor:0),0),n=Math.round(tot/st.soal.length*100),nama=nm();
 const prev=(best[nama]||{}).s||0,rekor=n>prev&&n>0;
 if(n>prev||!best[nama])best[nama]={s:n,k:st.k};
 try{sS("best",JSON.stringify(best))}catch(e){}
 riwayat.unshift({m:nama,j:st.j,k:st.k,s:n});riwayat=riwayat.slice(0,20);
 try{sS("riwayat",JSON.stringify(riwayat))}catch(e){}
 const kkm=st.kkm,lulus=n>=kkm,d=Math.abs(n-kkm);
 const now=new Date();if(prog.last!=ds(now)){prog.streak=prog.last==ds(new Date(now.getTime()-864e5))?prog.streak+1:1;prog.last=ds(now)}
 prog.kuis++;prog.tot+=n;if(lulus)prog.tuntas++;prog.xp+=10+Math.round(n/2);if(!prog.maps.includes(nama))prog.maps.push(nama);
 if(MULOK.some(x=>x[0]==st.m))prog.mulok=1;if(st.tag)prog.khusus=1;if(st.soal.some(q=>q.svg))prog.gambar=1;if(n==100)prog.perfect=1;
 if(st.soal.some((q,i)=>q.tipe=="uraian"&&st.res[i].skor>=.7))prog.uraian=1;
 rollPer();const P=prog.per,dk=P.d.k;
 P.d.kuis++;if(lulus)P.d.tuntas++;if(n==100)P.d.perfect++;
 P.w.kuis++;if(!P.w.days.includes(dk))P.w.days.push(dk);if(!P.w.maps.includes(nama))P.w.maps.push(nama);if(n>=90)P.w.s90++;
 P.m.kuis++;P.m.tot+=n;if(n==100)P.m.perfect++;if(!P.m.days.includes(dk))P.m.days.push(dk);
 const selesai=[];TUGAS.forEach(([id,g,nt,pt,tg,fn])=>{const key=id+":"+P[g=="h"?"d":g].k;if(fn(P)>=tg&&!prog.claim[key]){prog.claim[key]=1;prog.poin+=pt;prog.pm=(prog.pm||0)+pt;selesai.push([nt,pt])}});
 saveProg();pushLb();
 const RX=(lulus?["🥳","🎉","😎","🔥","🤩","🙌","🚀","👏"]:["💪","🤗","🌱","✨","💙","🙏"]).sort(()=>Math.random()-.5).slice(0,3);
 const tier=n==100?100:n>=80?80:n>=60?60:n>=40?40:0,ps=PESAN[tier],msg=ps[Math.floor(Math.random()*ps.length)];
 const kunci=st.soal.map((q,i)=>{const r=st.res[i];
  if(q.tipe=="pg")return `<div class="h"><span>${i+1}. <b>${L[q.jawab]}</b>${r.skor?"":` <small>(jawabanmu: ${L[r.jwb]})</small>`}</span><span>${r.skor?"✅":"❌"}</span></div>`;
  return `<div class="h" style="display:block"><div>${i+1}. Uraian • ${Math.round(r.skor*100)}% ${r.skor>=.7?"✅":"❌"}</div><small style="color:var(--mut)">Kunci: ${esc(q.kunci)}</small></div>`}).join("");
 $("app").innerHTML=`<div class="card ct ${lulus?"win":""}"><div class="medal">${n>=90?"🏆":lulus?"🥇":"🌱"}</div>
 <div class="judul">${lulus?"TUNTAS! Selamat ya! 🎉":"Belum tuntas, tapi kamu keren udah berani nyoba! 💙"}</div>
 <div class="rx">${RX.map((e,k)=>`<span style="animation-delay:${k*.2}s">${e}</span>`).join("")}</div><div class="score">${n}</div><p class="s">Skor ${Math.round(tot*10)/10} dari ${st.soal.length} soal • ${esc(nama)} Kelas ${st.k}</p>
 <p style="line-height:1.6"><b>${msg}</b></p></div>
 <div class="card"><b>ℹ️ Tentang KKM</b><div class="kk" style="margin-top:8px">KKM (Kriteria Ketuntasan Minimal) adalah nilai minimal yang harus dicapai supaya dianggap tuntas. KKM yang dipakai sekarang: <b>${kkm}</b>.<br>${lulus?(d==0?`Nilaimu <b>${n}</b> pas di garis KKM. Tuntas, mantap! 🎊`:`Nilaimu <b>${n}</b>, berarti <b>${d} poin di atas KKM</b>. Selamat, kamu tuntas! 🎊`):`Nilaimu <b>${n}</b>, kurang <b>${d} poin</b> lagi dari KKM. Dikit lagi, pelajari pembahasannya lalu coba lagi ya! 💪`}</div></div>
 ${selesai.length?`<div class="card win"><b>🏆 Tugas selesai!</b>${selesai.map(([a,b])=>`<div class="h"><span>✅ ${esc(a)}</span><b>+${b} poin</b></div>`).join("")}</div>`:""}
 ${rekor?`<div class="card ct">🏅 <b>Rekor baru di ${esc(nama)}!</b> Nilai tertinggimu sekarang ${n}.</div>`:""}
 ${profil()}
 <div class="card"><b>🔑 Kunci Jawaban</b>${kunci}</div>
 ${lulus?`<button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="pesta()">🔊 Putar suara selamat lagi</button>`:""}
 <button class="go" onclick="mulai()">🔁 Ulangi dengan soal baru</button>
 <button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="home()">🏠 Kembali ke menu</button>`;
 confetti(lulus?["🎉","🎊","⭐","✨","💫"]:["🌟","💪","🌱","💙"]);
 if(lulus)pesta();
}
function rtRender(){$("rt").innerHTML=`<div class="rtb"><span onclick="rtOpen=!rtOpen;rtRender()">⭐ ${avg?avg.toFixed(1):(myR||"Nilai")}${cnt?` <small>(${cnt})</small>`:""}</span> · by Pandana${rtOpen?`<div class="rtp">Kasih bintang buat web ini<div>${[1,2,3,4,5].map(i=>`<b onclick="rate(${i})" style="opacity:${i<=myR?1:.35}">⭐</b>`).join("")}</div></div>`:""}</div>`}
async function rate(v){myR=v;try{sS("myR",v)}catch(e){}try{if(db&&nl)await db.collection("ratings").doc(nl).set({r:v})}catch(e){}rtOpen=false;rtRender()}
function mkDb(){
const sess=()=>{try{return JSON.parse(localStorage.getItem("sess")||"null")||{}}catch(e){return{}}};
const call=async(body)=>{const x=sess();const r=await fetch("/api/db",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,u:x.n?String(x.n).toLowerCase():"",h:body.h||x.h||""})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"db error");return d};
return{collection:c=>({
doc:id=>({
get:async(h)=>{const d=await call({op:"get",col:c,id,h});return{exists:!!d.exists,data:()=>d.data}},
set:async(data,auth)=>{await call({op:"set",col:c,id,data,auth});return true}}),
onSnapshot:(ok,err)=>{const run=async()=>{try{const d=await call({op:"list",col:c});ok({docs:(d.docs||[]).map(x=>({id:x.id,data:()=>x.data}))})}catch(e){err&&err(e)}};run();setInterval(run,20000)}})}}
const ready=(async()=>{db=mkDb()})();
async function rtInit(){rtRender();await ready;if(!db)return;try{
 db.collection("lb").onSnapshot(sn=>{lbRows=sn.docs.map(x=>({id:x.id,...(x.data()||{})}));const e=$("lbl");if(e)e.innerHTML=lbList()},()=>{});
 db.collection("ratings").onSnapshot(sn=>{const d=sn.docs.map(x=>Number((x.data()||{}).r)||0).filter(Boolean);cnt=d.length;avg=cnt?d.reduce((a,b)=>a+b,0)/cnt:null;rtRender()},()=>{});pushLb()}catch(e){}}
async function boot(){rtInit();let x=null;try{x=JSON.parse(localStorage.getItem("sess")||"null")}catch(e){}
 if(x&&x.n){loadUser(x.n);rollPer();home();const a=await getAk(nl,x.h);if(a&&a.h!==x.h)logout("Kata sandi akunmu sudah diganti. Silakan masuk lagi.")}else gate()}
boot();
