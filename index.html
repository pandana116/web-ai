<!DOCTYPE html>
<html lang="id" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rajin Belajar Jadi Pintar ✨</title>
<style>
:root {
  --bg: #05050a;
  --bg-2: #0f1020;
  --card: #12132b;
  --card-hov: #1a1b3d;
  --card-2: #1c1e45;
  --text: #f0f4ff;
  --text-2: #94a3c8;
  --accent-1: #6366f1;
  --accent-2: #ec4899;
  --accent-3: #22d3ee;
  --accent-4: #10b981;
  --accent-5: #f59e0b;
  --ok: #10b981;
  --no: #ef4444;
  --bd: rgba(99,102,241,0.2);
  --glow: 0 0 20px rgba(99,102,241,0.3), 0 0 40px rgba(236,72,153,0.15);
}
html[data-theme="light"] {
  --bg: #f8fafc;
  --bg-2: #eef2ff;
  --card: #ffffff;
  --card-hov: #eef2ff;
  --card-2: #e0e7ff;
  --text: #1e293b;
  --text-2: #64748b;
  --bd: rgba(99,102,241,0.15);
  --glow: 0 4px 20px rgba(99,102,241,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  min-height:100vh;
  background: radial-gradient(circle at top right, var(--accent-1) 0%, transparent 40%),
              radial-gradient(circle at bottom left, var(--accent-2) 0%, transparent 40%),
              var(--bg);
  color:var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  line-height:1.6;
  padding-bottom: 40px;
}
main { max-width: 640px; margin: 0 auto; padding: 16px; }

.top-bar {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
  padding: 16px; background:var(--card); border-radius:20px; border:1px solid var(--bd);
  box-shadow:var(--glow);
}
.avatar {
  width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  display:grid; place-items:center; font-size:24px; flex-shrink:0;
}
.user-info { flex:1; margin:0 12px; }
.user-info h1 { font-size:16px; font-weight:800; }
.user-info p { font-size:11px; color:var(--text-2); margin-top:2px; }
.stat-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.badge {
  font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px;
  background:rgba(99,102,241,0.2); color:#e0e7ff;
}
.badge.coin { background:rgba(16,185,129,0.2); color:#6ee7b7; }
.badge.fire { background:rgba(239,68,68,0.2); color:#fdba74; }
.badge.xp { background:rgba(245,158,11,0.2); color:#fcd34d; }
.theme-btn {
  width:40px; height:40px; border-radius:12px; border:0; background:var(--card-2); color:var(--text);
  font-size:18px; cursor:pointer; transition:0.2s;
}
.tabs {
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:20px;
  padding:6px; background:rgba(18,19,43,0.8); border-radius:16px; border:1px solid var(--bd);
  position:sticky; top:0; z-index:100;
}
html[data-theme="light"] .tabs { background:rgba(255,255,255,0.9); }
.tabs button {
  background:transparent; border:0; color:var(--text-2); padding:10px 4px; border-radius:12px;
  font-size:10px; font-weight:700; cursor:pointer;
}
.tabs button span { display:block; font-size:18px; margin-bottom:2px; }
.tabs button.active {
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff; box-shadow:var(--glow);
}
.card {
  background:var(--card); border:1px solid var(--bd); border-radius:20px; padding:20px;
  margin-bottom:16px;
}
.card-title { font-size:15px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.grid-4 { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
button {
  font:inherit; cursor:pointer; border-radius:12px; border:1px solid transparent;
  padding:12px; font-weight:700; transition:0.2s;
}
button.primary {
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff; border:0;
}
button.secondary { background:var(--card-2); color:var(--text); border-color:var(--bd); }
button.selected { border-color:var(--accent-1); background:rgba(99,102,241,0.15); color:#a5b4fc; }
input, select, textarea {
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--bd);
  background:var(--bg-2); color:var(--text); font:inherit; margin-bottom:12px;
}
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent-1); }
label { font-size:12px; font-weight:800; color:var(--text-2); display:block; margin:12px 0 4px; }
.progress-bar { height:8px; background:var(--bg-2); border-radius:10px; overflow:hidden; margin:6px 0; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); border-radius:10px; transition:width 0.5s; }
.chat-box {
  height:360px; overflow-y:auto; background:var(--bg-2); border-radius:16px; padding:14px;
  margin-bottom:12px; border:1px solid var(--bd); display:flex; flex-direction:column; gap:10px;
}
.chat-bubble {
  max-width:82%; padding:12px 16px; border-radius:18px; font-size:13px; line-height:1.6; white-space:pre-wrap;
}
.chat-bubble.ai { background:var(--card-2); border-bottom-left-radius:6px; align-self:flex-start; }
.chat-bubble.user {
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff; border-bottom-right-radius:6px; align-self:flex-end;
}
.chat-row { display:flex; gap:8px; }
.chat-row input { flex:1; margin:0; }
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-card { background:var(--card-2); border-radius:14px; padding:14px 8px; text-align:center; }
.stat-card .num { font-size:22px; font-weight:900; }
.stat-card .lbl { font-size:10px; color:var(--text-2); margin-top:2px; }
.ach-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.ach {
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--card-2); border-radius:12px; font-size:24px;
}
.ach.unlocked { border:2px solid var(--accent-4); box-shadow:0 0 12px rgba(16,185,129,0.3); }
.ach.locked { opacity:0.4; filter:grayscale(1); }
.ach span { font-size:9px; margin-top:4px; color:var(--text-2); }
.timer-big { font-size:64px; font-weight:900; text-align:center; font-variant-numeric:tabular-nums; }
.rating-stars { display:flex; gap:4px; font-size:28px; justify-content:center; cursor:pointer; }
.rating-stars span { filter:grayscale(1); transition:0.2s; }
.rating-stars span.active { filter:none; animation:starPop 0.4s; }
@keyframes starPop { 0%{transform:scale(1.3)} 100%{transform:scale(1)} }
.modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:999; display:none; align-items:center; justify-content:center; padding:20px;
}
.modal.show { display:flex; }
.modal-content { background:var(--card); border-radius:20px; padding:24px; max-width:500px; width:100%; border:1px solid var(--bd); }
.toast {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--card); color:var(--text); padding:12px 24px; border-radius:14px;
  border:1px solid var(--accent-1); z-index:9999; opacity:0; transition:0.3s; font-weight:700;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.credit {
  text-align:center; padding:24px 16px; margin-top:20px; color:var(--text-2); font-size:11px; line-height:1.8;
  border-top:1px solid var(--bd);
}
.credit b { color:var(--accent-1); }
.heart { color:#ec4899; }
.err-text { color:var(--no); font-size:12px; margin-bottom:10px; display:none; }
@media (max-width:420px) {
  .tabs button span { font-size:16px; }
  .grid-4 { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"></div>

<script>
// ==========================================
// 🔑 ISI KUNCI API GROQ DI BAWAH INI
// Dapatkan gratis: console.groq.com/keys
// ==========================================
const GROQ_API_KEY = "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"; // Tulis kunci-mu di sini, contoh: "gsk_xxxxxxxxxx"
const AI_MODEL = "llama-3.3-70b-versatile";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

// ==========================================
// 💾 DATA PENGGUNA
// ==========================================
const STORAGE_KEY = "rajin_pintar_v1";
const DEFAULT_STATE = {
  nama: "", password: "", avatar: "🦊", level: 1, xp: 0, xpNeed: 100,
  coins: 50, streak: 1, lastActive: today(),
  soalTotal: 0, soalBenar: 0, soalSalah: 0,
  rating: 0, ratingCount: 0, theme: "neon", sound: true,
  tab: "belajar", chatHistory: [], achievements: [],
  settings: { grade: 8, subject: "Matematika", diff: "sedang" }
};

let S = { ...DEFAULT_STATE };

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const p = JSON.parse(s);
      S = { ...DEFAULT_STATE, ...p };
      const t = today();
      if (S.lastActive !== t) {
        const y = new Date(); y.setDate(y.getDate()-1);
        const yd = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
        S.streak = S.lastActive === yd ? S.streak+1 : 1;
        S.lastActive = t;
      }
    }
  } catch(e) {}
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
function $id(id) { return document.getElementById(id); }
function esc(s) { return String(s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const t = $id("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove("show"), 2500);
}
function openModal(h) { $id("modal").innerHTML = `<div class="modal-content">${h}</div>`; $id("modal").classList.add("show"); }
function closeModal() { $id("modal").classList.remove("show"); }
function applyTheme() { document.documentElement.setAttribute("data-theme", S.theme); }

// ==========================================
// 🤖 AI FUNCTIONS
// ==========================================
async function aiChat(messages) {
  if (!GROQ_API_KEY || GROQ_API_KEY.length < 10) {
    throw new Error("🔑 Kunci API belum diisi! Isi di bagian atas kode.");
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_API_KEY}` },
    body: JSON.stringify({ model: AI_MODEL, messages, temperature: 0.75 })
  });
  if (!res.ok) throw new Error(`Koneksi gagal (${res.status})`);
  const d = await res.json();
  return d.choices[0].message.content.trim();
}
async function aiJSON(prompt, sys) {
  const msgs = sys ? [{role:"system",content:sys}] : [];
  msgs.push({role:"user",content:prompt});
  const txt = await aiChat(msgs);
  const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
  if (a<0 || b<=a) throw new Error("Format tidak valid");
  return JSON.parse(txt.slice(a,b+1));
}

// ==========================================
// 🏆 PENCAPAIAN
// ==========================================
const ACHIEVEMENTS = [
  {id:"first",icon:"🌟",name:"Langkah Pertama",check:()=>S.soalTotal>=1},
  {id:"ten",icon:"💯",name:"10 Benar",check:()=>S.soalBenar>=10},
  {id:"week",icon:"🔥",name:"Semangat 7 Hari",check:()=>S.streak>=7},
  {id:"lvl5",icon:"⭐",name:"Naik Level 5",check:()=>S.level>=5},
  {id:"chat10",icon:"💬",name:"Ingin Tahu",check:()=>S.chatHistory.length>=10},
  {id:"quiz50",icon:"🏅",name:"Rajin Belajar",check:()=>S.soalTotal>=50},
  {id:"star",icon:"❤️",name:"Beri Bintang",check:()=>S.rating>=4},
  {id:"coins",icon:"💰",name:"Kaya Koin",check:()=>S.coins>=100}
];
function checkAch() {
  for(const a of ACHIEVEMENTS) {
    if(!S.achievements.includes(a.id) && a.check()) {
      S.achievements.push(a.id);
      toast(`🏆 Lencana: ${a.name}!`);
    }
  }
  saveState();
}

// ==========================================
// 📈 SISTEM XP & LEVEL
// ==========================================
function addXP(n) {
  S.xp += n;
  while(S.xp >= S.xpNeed) {
    S.xp -= S.xpNeed;
    S.level++;
    S.xpNeed = Math.floor(S.xpNeed * 1.3);
    S.coins += 10;
    toast(`🎉 Naik Level ${S.level}! +10 🪙`);
  }
  checkAch();
  saveState();
}

// ==========================================
// ⏱️ FOKUS TIMER
// ==========================================
let tmr = null, tmrSec = 0;
function startTimer() {
  if(tmr) return;
  tmr = setInterval(()=>{ tmrSec++; render(); }, 1000);
}
function pauseTimer() { clearInterval(tmr); tmr=null; render(); }
function resetTimer() { pauseTimer(); tmrSec=0; render(); }
function fmtTime(s) {
  const m=Math.floor(s/60), ss=s%60;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

// ==========================================
// 📝 KUIS
// ==========================================
let quiz = {on:false, list:[], idx:0, benar:0};

async function mulaiKuis() {
  const {subject, grade, diff} = S.settings;
  openModal(`<div style="text-align:center;padding:30px">
    <div style="font-size:60px">🤖</div>
    <h3>Menyusun Soal...</h3>
    <p style="color:var(--text-2)">${subject} • Kelas ${grade} • ${diff}</p>
    <button onclick="closeModal()" style="margin-top:20px">Batal</button>
  </div>`);
  
  try {
    const d = await aiJSON(
      `Buatkan 5 soal ${subject} kelas ${grade} Indonesia, tingkat ${diff}.
      Balas JSON saja: {"soal":[
        {"q":"Teks soal","a":"A","b":"B","c":"C","d":"D","kunci":0,"jelas":"Penjelasan"}
      ]}
      kunci: 0=A,1=B,2=C,3=D. Bahasa Indonesia jelas.`,
      "Kamu pembuat soal. Hanya balas JSON tanpa teks lain."
    );
    if(!d.soal || !d.soal.length) throw new Error("Data kosong");
    quiz = {on:true, list:d.soal, idx:0, benar:0};
    closeModal();
    render();
  } catch(e) {
    closeModal();
    openModal(`<div style="text-align:center;padding:20px">
      <div style="font-size:50px">😕</div>
      <h3>Gagal</h3>
      <p style="color:var(--no)">${esc(e.message)}</p>
      <p style="font-size:12px;margin:10px 0">Pastikan kunci API Groq sudah diisi di bagian atas kode.</p>
      <button onclick="closeModal()" class="primary" style="width:100%">Mengerti</button>
    </div>`);
  }
}

function jawab(n) {
  if(!quiz.on) return;
  const soal = quiz.list[quiz.idx];
  const ok = n === soal.kunci;
  S.soalTotal++;
  if(ok) {
    quiz.benar++; S.soalBenar++;
    addXP(15); S.coins += 2;
  } else {
    S.soalSalah++;
  }
  saveState(); checkAch();
  
  const huruf = ["A","B","C","D"];
  openModal(`<div style="text-align:center;padding:10px 0">
    <div style="font-size:40px">${ok?"✅":"❌"}</div>
    <h3 style="color:${ok?"var(--ok)":"var(--no)"}">${ok?"Benar!":"Salah"}</h3>
    <p>Jawaban: <b>${huruf[soal.kunci]}</b></p>
    <div style="background:var(--bg-2);padding:12px;border-radius:12px;margin:12px 0;text-align:left">
      <b>📖 Penjelasan:</b><br>${esc(soal.jelas)}
    </div>
    <button onclick="lanjut()" class="primary" style="width:100%">
      ${quiz.idx+1 < quiz.list.length ? "Berikutnya →" : "🏁 Lihat Hasil"}
    </button>
  </div>`);
}

function lanjut() {
  closeModal();
  quiz.idx++;
  if(quiz.idx >= quiz.list.length) {
    const pct = Math.round((quiz.benar/quiz.list.length)*100);
    const pesan = pct>=80?"Luar biasa! 🌟":pct>=60?"Bagus! 💪":"Semangat, jangan menyerah! 🔥";
    openModal(`<div style="text-align:center;padding:10px 0">
      <div style="font-size:50px">${pct>=80?"🏆":pct>=60?"👏":"💪"}</div>
      <h2 style="font-size:28px">${pct}%</h2>
      <p>${quiz.benar} dari ${quiz.list.length} benar</p>
      <p style="font-weight:700;margin:12px 0">${pesan}</p>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button onclick="closeModal();mulaiKuis()" class="primary" style="flex:1">🔄 Ulangi</button>
        <button onclick="closeModal();quiz.on=false;render()" class="secondary" style="flex:1">Kembali</button>
      </div>
    </div>`);
    if(S.soalTotal % 15 === 0) setTimeout(mintaRating, 1500);
  } else {
    render();
  }
}

// ==========================================
// ⭐ RATING
// ==========================================
function mintaRating() {
  openModal(`<div style="text-align:center;padding:10px 0">
    <h3>Bagaimana aplikasinya?</h3>
    <p style="color:var(--text-2);font-size:12px;margin-bottom:12px">Bantu kami berkembang ⭐</p>
    <div class="rating-stars">
      ${[1,2,3,4,5].map(i=>`<span onclick="beriBintang(${i})" class="${i<=S.rating?'active':''}">⭐</span>`).join("")}
    </div>
    <button onclick="closeModal()" style="margin-top:16px;background:transparent;border:0;color:var(--text-2);font-size:11px">Nanti</button>
  </div>`);
}
function beriBintang(n) {
  S.rating = n; S.ratingCount++;
  addXP(5); saveState(); checkAch();
  toast(`Terima kasih! ${n} ⭐`); closeModal();
}

// ==========================================
// 💬 TUTOR AI
// ==========================================
async function kirimPesan() {
  const inp = $id("chatInput");
  const txt = inp.value.trim();
  if(!txt) return;
  S.chatHistory.push({role:"user",content:txt});
  inp.value = ""; saveState(); render();
  
  try {
    const balas = await aiChat([
      {role:"system",content:"Kamu Tutor Pintar — ramah, sabar, dibuat oleh Pandana. Jawab sederhana, semangati belajar!"},
      ...S.chatHistory
    ]);
    S.chatHistory.push({role:"assistant",content:balas});
    saveState(); checkAch(); render();
  } catch(e) {
    S.chatHistory.push({role:"assistant",content:`😕 ${e.message}`});
    saveState(); render();
  }
}

// ==========================================
// 🎨 RENDER UTAMA
// ==========================================
function render() {
  applyTheme();
  if(!S.nama) { renderLogin(); return; }
  
  const tabs = [
    {id:"belajar",icon:"📚",label:"Belajar"},
    {id:"fokus",icon:"⏱️",label:"Fokus"},
    {id:"tutor",icon:"🤖",label:"Tutor"},
    {id:"stat",icon:"📊",label:"Statistik"},
    {id:"atur",icon:"⚙️",label:"Atur"}
  ];
  
  let konten = "";
  switch(S.tab) {
    case "belajar": konten = renderBelajar(); break;
    case "fokus": konten = renderFokus(); break;
    case "tutor": konten = renderTutor(); break;
    case "stat": konten = renderStat(); break;
    case "atur": konten = renderAtur(); break;
  }
  
  $id("app").innerHTML = `
    ${renderAtas()}
    <nav class="tabs">
      ${tabs.map(t=>`<button class="${S.tab===t.id?'active':''}" onclick="S.tab='${t.id}';saveState();render()">
        <span>${t.icon}</span>${t.label}
      </button>`).join("")}
    </nav>
    ${konten}
    <div class="credit">
      <p>✨ <b>Rajin Belajar Jadi Pintar</b> ✨</p>
      <p>Dibuat dengan <span class="heart">❤️</span> oleh <b>Pandana</b></p>
      <p style="margin-top:6px;font-size:10px">
        Rating: ${S.rating>0?"⭐".repeat(S.rating)+"☆".repeat(5-S.rating)} (${S.ratingCount})
      </p>
    </div>
  `;
  
  setTimeout(()=>{
    const cb = document.querySelector(".chat-box");
    if(cb) cb.scrollTop = cb.scrollHeight;
  }, 50);
}

function renderAtas() {
  const xpPct = Math.round((S.xp/S.xpNeed)*100);
  return `<div class="top-bar">
    <div class="avatar">${S.avatar}</div>
    <div class="user-info">
      <h1>${esc(S.nama)}</h1>
      <p>Level ${S.level} • ${S.xp}/${S.xpNeed} XP</p>
      <div class="progress-bar"><div class="progress-fill" style="width:${xpPct}%"></div></div>
      <div class="stat-badges">
        <span class="badge coin">🪙 ${S.coins}</span>
        <span class="badge fire">🔥 ${S.streak} hari</span>
        <span class="badge xp">📝 ${S.soalTotal} soal</span>
      </div>
    </div>
    <button class="theme-btn" onclick="gantiTema()">${S.theme==='light'?'🌙':'☀️'}</button>
  </div>`;
}
function gantiTema() {
  S.theme = S.theme==='light'?'neon':'light';
  saveState(); render();
}

// ==========================================
// 🔐 LOGIN / DAFTAR
// ==========================================
let modeAuth = "login", avPilih = "🦊";
const AV_LIST = ["🦊","🐼","🐰","🐹","🐸","🐯","🐨","🦁","🐵","🦉","🚀","👑"];

function renderLogin() {
  $id("app").innerHTML = `
    <div style="text-align:center;margin:30px 0">
      <div style="font-size:60px">📚</div>
      <h1 style="font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent">Rajin Belajar Jadi Pintar</h1>
      <p style="color:var(--text-2);margin-top:6px">Belajar cerdas, tumbuh setiap hari ✨</p>
    </div>
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="${modeAuth==='login'?'primary':'secondary'}" style="flex:1" onclick="modeAuth='login';render()">Masuk</button>
        <button class="${modeAuth==='register'?'primary':'secondary'}" style="flex:1" onclick="modeAuth='register';render()">Daftar</button>
      </div>
      <div id="errAuth" class="err-text"></div>
      <label>Nama Panggilan</label>
      <input id="iNama" placeholder="Contoh: Budi">
      <label>Kata Sandi</label>
      <input id="iPass" type="password" placeholder="Minimal 4 karakter">
      ${modeAuth==='register'?`
        <label>Ulangi Kata Sandi</label>
        <input id="iPass2" type="password">
        <label>Pilih Avatar</label>
        <div class="grid-4">
          ${AV_LIST.map(a=>`<button class="${avPilih===a?'selected':'secondary'}" onclick="avPilih='${a}';render()">${a}</button>`).join("")}
        </div>
      `:""}
      <button class="primary" style="width:100%;margin-top:16px" onclick="prosesLogin()">
        ${modeAuth==='login'?'🔓 Masuk':'✨ Daftar'}
      </button>
    </div>
    <div class="credit">
      <p>Dibuat dengan <span class="heart">❤️</span> oleh <b>Pandana</b></p>
      <p style="font-size:10px;color:var(--text-2)">Data tersimpan aman di perangkatmu</p>
    </div>
  `;
}

function prosesLogin() {
  const nama = $id("iNama").value.trim();
  const pass = $id("iPass").value;
  const err = (m)=>{ const e=$id("errAuth"); e.textContent=m; e.style.display="block"; };
  
  if(nama.length<3) return err("Nama minimal 3 karakter");
  if(pass.length<4) return err("Kata sandi minimal 4 karakter");
  
  if(modeAuth==='register') {
    if(pass !== $id("iPass2").value) return err("Kata sandi tidak sama");
    Object.assign(S, DEFAULT_STATE, {nama, password:pass, avatar:avPilih});
    toast(`Selamat datang, ${nama}! 🎉`);
  } else {
    if(!S.nama) return err("Belum terdaftar, silakan daftar dulu");
    if(S.nama!==nama || S.password!==pass) return err("Nama atau sandi salah");
    toast(`Halo, ${nama}! 👋`);
  }
  saveState(); render();
}

// ==========================================
// 📚 TAB BELAJAR
// ==========================================
function renderBelajar() {
  if(quiz.on) return renderSoalKuis();
  const mapel = ["Matematika","IPA","IPS","B. Indonesia","B. Inggris","Informatika","PPKn","Seni","Agama","Penjaskes"];
  const kelas = [6,7,8,9,10,11,12];
  const lvl = ["mudah","sedang","sulit"];
  
  return `
    <div class="card">
      <div class="card-title">📖 Mulai Belajar</div>
      <label>Mata Pelajaran</label>
      <select onchange="S.settings.subject=this.value;saveState();render()">
        ${mapel.map(m=>`<option ${S.settings.subject===m?"selected":""}>${m}</option>`).join("")}
      </select>
      <label>Kelas</label>
      <select onchange="S.settings.grade=+this.value;saveState();render()">
        ${kelas.map(g=>`<option ${S.settings.grade===g?"selected":""}>${g}</option>`).join("")}
      </select>
      <label>Tingkat Kesulitan</label>
      <div class="grid-3">
        ${lvl.map(d=>`<button class="${S.settings.diff===d?'selected':'secondary'}" onclick="S.settings.diff='${d}';saveState();render()">${d[0].toUpperCase()+d.slice(1)}</button>`).join("")}
      </div>
      <button class="primary" style="width:100%;margin-top:20px;padding:14px" onclick="mulaiKuis()">🚀 Mulai Kuis AI</button>
    </div>
    <div class="card">
      <div class="card-title">📊 Rekap</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="num">${S.soalTotal}</div><div class="lbl">Dikerjakan</div></div>
        <div class="stat-card"><div class="num" style="color:var(--ok)">${S.soalBenar}</div><div class="lbl">Benar</div></div>
        <div class="stat-card"><div class="num" style="color:var(--accent-3)">${S.soalTotal?Math.round((S.soalBenar/S.soalTotal)*100):0}%</div><div class="lbl">Tingkat Berhasil</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">⚡ Cepat</div>
      <div class="grid-2">
        <button class="secondary" onclick="S.tab='fokus';render()">⏱️ Fokus</button>
        <button class="secondary" onclick="S.tab='tutor';render()">🤖 Tanya AI</button>
        <button class="secondary" onclick="mintaRating()">⭐ Beri Nilai</button>
        <button class="secondary" onclick="S.tab='stat';render()">🏆 Pencapaian</button>
      </div>
    </div>
  `;
}

function renderSoalKuis() {
  const s = quiz.list[quiz.idx];
  const ops = [
    {l:"A",v:s.a},{l:"B",v:s.b},{l:"C",v:s.c},{l:"D",v:s.d}
  ];
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <span class="badge">Soal ${quiz.idx+1}/${quiz.list.length}</span>
        <span style="font-weight:700">Benar: ${quiz.benar}</span>
      </div>
      <div class="progress-bar" style="margin-bottom:20px">
        <div class="progress-fill" style="width:${(quiz.idx/quiz.list.length)*100}%"></div>
      </div>
      <h3 style="font-size:17px;margin-bottom:20px;line-height:1.6">${esc(s.q)}</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${ops.map((o,i)=>`<button class="secondary" onclick="jawab(${i})" style="text-align:left">${o.l}. ${esc(o.v)}</button>`).join("")}
      </div>
      <button onclick="quiz.on=false;render()" style="margin-top:20px;background:transparent;border:0;color:var(--text-2)">✕ Batalkan Kuis</button>
    </div>
  `;
}

// ==========================================
// ⏱️ TAB FOKUS
// ==========================================
function renderFokus() {
  return `
    <div class="card">
      <div class="card-title">⏱️ Fokus Belajar</div>
      <div class="timer-big">${fmtTime(tmrSec)}</div>
      <div style="display:flex;justify-content:center;gap:10px;margin-top:20px">
        <button class="primary" onclick="${tmr?'pauseTimer()':'startTimer()'}">${tmr?'⏸️ Jeda':'▶️ Mulai'}</button>
        <button class="secondary" onclick="resetTimer()">🔄 Atur Ulang</button>
      </div>
      <p style="text-align:center;margin-top:16px;color:var(--text-2);font-size:12px">
        Tetap fokus, setiap detik berharga! 💪
      </p>
    </div>
    <div class="card">
      <div class="card-title">💡 Teknik Belajar</div>
      <p style="font-size:13px;line-height:1.8;color:var(--text-2)">
        <b>Metode Pomodoro:</b> Fokus 25 menit → istirahat 5 menit, ulangi.<br><br>
        <b>Tips:</b> Matikan notifikasi, siapkan air minum, pelajari 1 hal baru setiap hari.
      </p>
    </div>
  `;
}

// ==========================================
// 💬 TAB TUTOR
// ==========================================
function renderTutor() {
  return `
    <div class="card">
      <div class="card-title">🤖 Tutor AI Pintar</div>
      <div class="chat-box">
        ${S.chatHistory.length===0?`<div class="chat-bubble ai">Halo ${S.avatar} ${S.nama}! 👋 Aku Tutor Pintar. Tanya apa saja tentang pelajaran, aku bantu jelaskan! 😊</div>`:""}
        ${S.chatHistory.map(x=>`<div class="chat-bubble ${x.role==='user'?'user':'ai'}">${esc(x.content)}</div>`).join("")}
      </div>
      <div class="chat-row">
        <input id="chatInput" placeholder="Tanya sesuatu..." onkeydown="if(event.key==='Enter')kirimPesan()">
        <button class="primary" onclick="kirimPesan()">Kirim</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">💬 Contoh Pertanyaan</div>
      <div class="grid-2">
        <button class="secondary" onclick="$id('chatInput').value='Jelaskan apa itu bilangan bulat';kirimPesan()">Bilangan Bulat</button>
        <button class="secondary" onclick="$id('chatInput').value='Cara menghitung luas segitiga';kirimPesan()">Luas Segitiga</button>
        <button class="secondary" onclick="$id('chatInput').value='Apa itu tata surya';kirimPesan()">Tata Surya</button>
        <button class="secondary" onclick="$id('chatInput').value='Cara belajar yang efektif';kirimPesan()">Tips Belajar</button>
      </div>
    </div>
  `;
}

// ==========================================
// 📊 TAB STATISTIK & PENCAPAIAN
// ==========================================
function renderStat() {
  const persen = S.soalTotal?Math.round((S.soalBenar/S.soalTotal)*100):0;
  return `
    <div class="card">
      <div class="card-title">📊 Statistik Belajar</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="num">${S.level}</div><div class="lbl">Level</div></div>
        <div class="stat-card"><div class="num">${S.soalTotal}</div><div class="lbl">Soal Dikerjakan</div></div>
        <div class="stat-card"><div class="num">${S.streak}</div><div class="lbl">Hari Berturut</div></div>
        <div class="stat-card"><div class="num">${S.coins}</div><div class="lbl">Koin</div></div>
        <div class="stat-card"><div class="num">${persen}%</div><div class="lbl">Tingkat Berhasil</div></div>
        <div class="stat-card"><div class="num">${S.achievements.length}/${ACHIEVEMENTS.length}</div><div class="lbl">Lencana</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">🏆 Pencapaian</div>
      <div class="ach-grid">
        ${ACHIEVEMENTS.map(a=>{
          const buka = S.achievements.includes(a.id);
          return `<div class="ach ${buka?'unlocked':'locked'}" title="${a.name}">${a.icon}<span>${a.name}</span></div>`;
        }).join("")}
      </div>
    </div>
    <div class="card">
      <div class="card-title">⭐ Penilaian</div>
      <div class="rating-stars" style="margin-bottom:10px">
        ${[1,2,3,4,5].map(i=>`<span onclick="beriBintang(${i})" class="${i<=S.rating?'active':''}">⭐</span>`).join("")}
      </div>
      <p style="text-align:center;color:var(--text-2);font-size:12px">
        ${S.rating>0?`Terima kasih sudah memberi ${S.rating} bintang!`:'Belum ada penilaian, jadilah yang pertama!'}
      </p>
    </div>
  `;
}

// ==========================================
// ⚙️ TAB PENGATURAN
// ==========================================
function renderAtur() {
  return `
    <div class="card">
      <div class="card-title">👤 Akun</div>
      <p><b>Nama:</b> ${esc(S.nama)}</p>
      <p><b>Level:</b> ${S.level}</p>
      <p><b>XP:</b> ${S.xp} / ${S.xpNeed}</p>
      <button class="secondary" style="margin-top:16px" onclick="if(confirm('Keluar?')){S.nama='';saveState();render()}">🚪 Keluar Akun</button>
    </div>
    <div class="card">
      <div class="card-title">🎨 Tampilan</div>
      <label>Tema</label>
      <div class="grid-2">
        <button class="${S.theme==='neon'?'selected':'secondary'}" onclick="S.theme='neon';saveState();render()">🌙 Gelap</button>
        <button class="${S.theme==='light'?'selected':'secondary'}" onclick="S.theme='light';saveState();render()">☀️ Terang</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">ℹ️ Tentang</div>
      <p style="font-size:13px;line-height:1.8">
        <b>Rajin Belajar Jadi Pintar</b><br>
        Dibuat dengan ❤️ oleh <b>Pandana</b><br><br>
        Fitur: AI Tutor • Kuis Cerdas • Sistem Level • Fokus Timer • Pencapaian • Rating<br><br>
        Versi: 2.0
      </p>
      <button class="secondary" style="margin-top:10px" onclick="mintaRating()">⭐ Beri Bintang</button>

loadState();
render();
</script>
