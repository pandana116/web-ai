<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Rajin Belajar Jadi Pintar</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d29;--tx:#e8ecf5;--mut:#9aa6bf;--pr:#6366f1;--pr2:#8b5cf6;--ok:#16a34a;--no:#dc2626;--bd:#2b3145}
html[data-theme=light]{--bg:#f5f7fb;--card:#fff;--tx:#1b2433;--mut:#64708a;--bd:#dde3ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .25s}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#6366f1,#ec4899 60%,#f59e0b);color:#fff}
.hero h1{font-size:22px;margin:0 0 4px}.hero p{margin:0;font-size:13px;opacity:.95}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px;text-align:left;transition:.15s}
button:active{transform:scale(.98)}
button.sel{border-color:var(--pr);background:var(--pr);color:#fff;font-weight:700}
button.go{width:100%;text-align:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0;font-weight:700;margin-top:10px;padding:14px}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.opt{display:block;width:100%;margin-bottom:8px;text-align:left}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}
.opt.no{border-color:var(--no);background:rgba(220,38,38,.15)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .4s}
.score{font-size:64px;font-weight:800;text-align:center;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.bahas{font-size:13.5px;line-height:1.65;background:var(--bg);border-radius:12px;padding:13px;margin-top:12px;white-space:pre-wrap;border:1px solid var(--bd)}
.bahas b{color:var(--pr)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;margin-bottom:10px}
.tabs button{text-align:center;padding:7px 1px;font-size:10px;border-radius:10px}
.tabs button span{display:block;font-size:19px;margin-bottom:2px}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,textarea,select{width:100%;font:inherit;padding:11px;border-radius:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:0}
input:focus,textarea:focus{border-color:var(--pr)}
textarea{resize:vertical;min-height:90px}
.chat{height:340px;overflow:auto;background:var(--bg);border-radius:14px;padding:12px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.bub{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.bub.bot{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px;align-self:flex-start}
.bub.user{background:var(--pr);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.typ{display:flex;gap:4px;padding:12px 14px;align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.typ i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typ i:nth-child(2){animation-delay:.18s}.typ i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.lbrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.lbrow:last-child{border-bottom:0}
.lbrow.me{background:rgba(99,102,241,.15);border-radius:10px;padding:10px 12px;border:0}
.lbr{width:28px;font-weight:900;text-align:center;color:var(--mut);font-size:13px}
.lba{width:36px;height:36px;border-radius:10px;background:rgba(99,102,241,.15);display:grid;place-items:center;font-size:18px}
.lbb{flex:1;min-width:0}
.lbb b{font-size:13.5px;display:block}
.lbb small{color:var(--mut);font-size:11px}
.lbp{font-weight:800;color:var(--pr);font-size:13px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 4px;text-align:center;font-size:11px}
.st .e{font-size:26px;display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#25263a;color:#fff;padding:11px 16px;border-radius:12px;z-index:200;display:none;font-size:13px;font-weight:700;max-width:88vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.show{display:block;animation:ti .3s forwards}
@keyframes ti{to{transform:translateX(-50%) translateY(0)}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:120;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.mbox{background:var(--card);width:min(560px,100%);border-radius:18px;padding:20px;max-height:88vh;overflow:auto;border:1px solid var(--bd)}
.mbox h2{margin:0 0 10px;font-size:18px}
.mclose{float:right;background:var(--bd);color:var(--tx);width:32px;height:32px;border-radius:9px;font-weight:900;border:0}
.reaction{display:flex;justify-content:center;gap:10px;font-size:34px;margin:6px 0}
.reaction span{animation:pp .8s ease backwards}
@keyframes pp{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stars{display:flex;gap:4px;justify-content:center;font-size:32px;margin:10px 0;cursor:pointer}
.stars span{opacity:.3;transition:.2s}
.stars span.on{opacity:1;transform:scale(1.15)}
.credit{text-align:center;padding:22px 0 8px;color:var(--mut);font-size:11.5px}
.credit b{color:var(--pr)}
.ai-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;margin-left:6px}
.ai-ok{background:rgba(22,163,74,.2);color:#4ade80}
.ai-err{background:rgba(220,38,38,.2);color:#fca5a5}
.ai-wait{background:rgba(245,158,11,.2);color:#fbbf24}
.sk{background:linear-gradient(90deg,var(--bd),rgba(99,102,241,.15),var(--bd));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:9px;height:14px;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
.badge{display:inline-block;background:var(--bd);padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:700;margin:2px 3px 0 0}
.ket{background:var(--bg);border-radius:10px;padding:10px;font-size:12.5px;line-height:1.6;border:1px solid var(--bd);color:var(--mut)}
</style>
</head>
<body>

<main id="app"></main>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox"><button class="mclose" onclick="closeModal()">✕</button><div id="modalContent"></div></div>
</div>

<script>
/* ========== KONFIGURASI ========== */
// Ganti dengan konfigurasi Firebase kamu (isi kalau mau leaderboard lintas user)
// Kosongkan untuk mode lokal (leaderboard cuma di device sendiri)
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const AI_ENDPOINT = '/api/chat';

/* ========== STATE ========== */
let S = {
  nama: '', avatar: '🦊', xp: 0, coins: 20, streak: 0, lastActive: '',
  soal: 0, benar: 0, menitFokus: 0, riwayat: [], badges: [],
  chatHistory: [], myRating: 0, comments: [], theme: 'dark'
};
function load(){ try{ const r=localStorage.getItem('rbjp_v4'); if(r) S={...S,...JSON.parse(r)} }catch(e){} }
function save(){ try{ localStorage.setItem('rbjp_v4',JSON.stringify(S)) }catch(e){} }
load();

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const lvlOf = xp => Math.floor(xp/100)+1;
const xpIn = xp => xp%100;

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2400) }
function openModal(h){ $('modalContent').innerHTML=h; $('modal').classList.add('show') }
function closeModal(){ $('modal').classList.remove('show') }
function sfx(type){ try{ const C=new(window.AudioContext||window.webkitAudioContext)(); const o=C.createOscillator(),g=C.createGain(); o.connect(g); g.connect(C.destination); const m={klik:[520,.06,'sine'],ok:[880,.18,'sine'],no:[220,.22,'sawtooth'],naik:[660,.4,'triangle']}; const [f,d,w]=m[type]||m.klik; o.type=w; o.frequency.value=f; g.gain.setValueAtTime(.07,C.currentTime); g.gain.exponentialRampToValueAtTime(.001,C.currentTime+d); o.start(); o.stop(C.currentTime+d) }catch(e){} }

/* ========== FIREBASE (opsional) ========== */
let db = null;
try {
  if (FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined') {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }
} catch(e) { console.warn('Firebase tidak aktif:', e.message) }

async function pushLeaderboard() {
  if (!db || !S.nama) return;
  try {
    await db.collection('leaderboard').doc(S.nama.toLowerCase().replace(/\s/g,'_')).set({
      nama: S.nama, avatar: S.avatar, xp: S.xp, level: lvlOf(S.xp), updated: Date.now()
    });
  } catch(e) { console.warn('pushLeaderboard:', e.message) }
}

/* ========== AI ========== */
let aiStatus = 'unknown'; // unknown | ok | error
async function callAI(messages) {
  try {
    const r = await fetch(AI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'AI error');
    const text = d.choices?.[0]?.message?.content || d.text || '';
    if (!text) throw new Error('AI tidak merespons');
    aiStatus = 'ok';
    return text;
  } catch(e) {
    aiStatus = 'error';
    throw e;
  }
}

async function callAIJSON(prompt, system) {
  const msgs = [];
  if (system) msgs.push({ role:'system', content: system });
  msgs.push({ role:'user', content: prompt });
  const text = await callAI(msgs);
  // Extract JSON dari response
  const a = text.indexOf('{');
  const b = text.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('AI tidak mengembalikan JSON valid');
  const json = text.slice(a, b+1);
  // Bersihkan
  return JSON.parse(json);
}

/* ========== NAVIGASI ========== */
const PAGES = ['belajar','tutor','flash','nilai','peringkat'];
function go(tab) { S.tab = tab; save(); render() }

function render() {
  const t = S.tab || 'belajar';
  const pages = {
    belajar: pBelajar,
    tutor: pTutor,
    flash: pFlash,
    nilai: pNilai,
    peringkat: pPeringkat
  };
  $('app').innerHTML = `
    <div class="hero">
      <h1>📚 Rajin Belajar</h1>
      <p>Level ${lvlOf(S.xp)} • ${S.xp} XP • 🔥 ${S.streak} hari</p>
    </div>
    <div class="tabs">
      <button class="${t==='belajar'?'on':''}" onclick="go('belajar')"><span>🎓</span>Belajar</button>
      <button class="${t==='tutor'?'on':''}" onclick="go('tutor')"><span>🤖</span>Tutor</button>
      <button class="${t==='flash'?'on':''}" onclick="go('flash')"><span>🧠</span>Flash</button>
      <button class="${t==='nilai'?'on':''}" onclick="go('nilai')"><span>📊</span>Nilai</button>
      <button class="${t==='peringkat'?'on':''}" onclick="go('peringkat')"><span>🏆</span>Rank</button>
    </div>
    ${pages[t]()}
    <div class="credit">Dibuat dengan ❤️ by <b>Pandana</b></div>
  `;
  if (t === 'tutor') renderChat();
  if (t === 'peringkat') loadLeaderboard();
}

/* ========== BELAJAR ========== */
const MAPEL = [
  ['Matematika','🔢'],['IPA','🔬'],['IPS','🌏'],['Bahasa Indonesia','📖'],
  ['Bahasa Inggris','🔤'],['Informatika','💻'],['PPKn','🇮🇩'],['Seni Budaya','🎨']
];
let setup = { mapel:'Matematika', jenjang:'SMP', kelas:8, tipe:'pg', n:5, kkm:70, kisi:'' };

function pBelajar() {
  return `
  <div class="card">
    <label style="margin-top:0">📚 Pilih mata pelajaran</label>
    <div class="grid">
      ${MAPEL.map(([m,e])=>`<button class="${setup.mapel===m?'sel':''}" onclick="setMapel('${m}')"><span style="font-size:18px">${e}</span> ${m}</button>`).join('')}
    </div>

    <label>⭐ Jenjang & Kelas</label>
    <div class="row" style="display:flex;gap:6px">
      <select onchange="setup.jenjang=this.value;updateKelas();render()" style="flex:1">
        <option ${setup.jenjang==='SD'?'selected':''}>SD</option>
        <option ${setup.jenjang==='SMP'?'selected':''}>SMP</option>
        <option ${setup.jenjang==='SMA'?'selected':''}>SMA</option>
      </select>
      <select onchange="setup.kelas=+this.value" style="flex:1" id="selKelas"></select>
    </div>

    <label>📝 Jenis soal</label>
    <div class="g3 grid">
      <button class="${setup.tipe==='pg'?'sel':''}" onclick="setup.tipe='pg';render()">Pilihan Ganda</button>
      <button class="${setup.tipe==='uraian'?'sel':''}" onclick="setup.tipe='uraian';render()">Uraian</button>
      <button class="${setup.tipe==='campur'?'sel':''}" onclick="setup.tipe='campur';render()">Campuran</button>
    </div>

    <label>🔢 Jumlah soal</label>
    <div class="g4 grid">
      ${[5,10,15,20].map(n=>`<button class="${setup.n===n?'sel':''}" onclick="setup.n=${n};render()">${n}</button>`).join('')}
    </div>

    <label>🎯 KKM</label>
    <input type="number" value="${setup.kkm}" oninput="setup.kkm=Math.max(0,Math.min(100,+this.value||0))">

    <label>📋 Kisi-kisi (opsional)</label>
    <textarea placeholder="Contoh: Bab Aljabar, SPLDV, persamaan linear" oninput="setup.kisi=this.value">${esc(setup.kisi)}</textarea>

    <button class="go" onclick="mulaiKuis()">🚀 Mulai Kuis dengan AI</button>
  </div>
  <div class="ket" style="margin-top:12px">
    💡 Soal dibuat langsung oleh AI setiap kali kamu mulai kuis. Jadi soal <b>selalu baru</b> dan tidak akan sama.
  </div>`;
}

function setMapel(m){ setup.mapel=m; render() }
function updateKelas(){
  const map = { SD:[1,2,3,4,5,6], SMP:[7,8,9], SMA:[10,11,12] };
  const arr = map[setup.jenjang] || [7,8,9];
  if (!arr.includes(setup.kelas)) setup.kelas = arr[0];
  const sel = $('selKelas');
  if (sel) sel.innerHTML = arr.map(k=>`<option ${k===setup.kelas?'selected':''}>${k}</option>`).join('');
}

/* ========== KUIS (AI) ========== */
let quiz = { soal: [], idx: 0, jawab: [], skor: 0, loading: false };

async function mulaiKuis() {
  S.tab = 'belajar'; save();
  const jumlah = setup.n;
  const pg = Math.ceil(jumlah * 0.6);
  const jenis = setup.tipe === 'pg'
    ? `${jumlah} soal pilihan ganda`
    : setup.tipe === 'uraian'
    ? `${jumlah} soal uraian`
    : `${jumlah} soal campuran (${pg} pilihan ganda, ${jumlah-pg} uraian)`;

  const prompt = `Buatkan ${jenis} mata pelajaran ${setup.mapel} untuk siswa ${setup.jenjang} kelas ${setup.kelas} di Indonesia (Kurikulum Merdeka). Bahasa Indonesia.${setup.kisi ? ` Fokus pada materi: ${setup.kisi}.` : ''}

Balas HANYA dengan JSON valid (tanpa markdown, tanpa penjelasan tambahan), dengan format:
{
  "soal": [
    { "tipe": "pg", "q": "pertanyaan", "opsi": ["a","b","c","d"], "jawab": 0, "bahas": "penjelasan lengkap" },
    { "tipe": "uraian", "q": "pertanyaan", "kunci": "jawaban model", "bahas": "penjelasan" }
  ]
}

Aturan:
- Untuk "pg": opsi tepat 4, TANPA awalan huruf, "jawab" = indeks 0-3 jawaban benar
- Untuk "uraian": ada field "kunci"
- "bahas": penjelasan 3-5 kalimat, kenapa jawaban itu benar
- Soal harus spesifik, tidak ambigu, dan bervariasi`;

  quiz = { soal: [], idx: 0, jawab: [], skor: 0, loading: true };
  showKuisLoading();

  try {
    const data = await callAIJSON(prompt, 'Kamu adalah pembuat soal profesional untuk pelajar Indonesia. Selalu balas dalam JSON valid.');
    const list = (data.soal || []).filter(s => s.q && (
      s.tipe === 'uraian' ? s.kunci : (Array.isArray(s.opsi) && s.opsi.length === 4 && typeof s.jawab === 'number')
    )).map(s => ({
      ...s,
      tipe: s.tipe || 'pg',
      opsi: s.opsi ? s.opsi.map(o => String(o).replace(/^\s*[a-dA-D][\.\)]\s+/,'')) : undefined
    }));

    if (list.length === 0) throw new Error('AI tidak menghasilkan soal valid');

    quiz = { soal: list, idx: 0, jawab: [], skor: 0, loading: false };
    renderKuis();
  } catch(e) {
    quiz.loading = false;
    showKuisError(e.message);
  }
}

function showKuisLoading() {
  $('app').innerHTML = `
    <div class="card">
      <div class="bar"><i style="width:30%"></i></div>
      <div style="text-align:center;padding:30px 10px">
        <div style="font-size:48px;margin-bottom:10px">🤖</div>
        <b style="font-size:15px">AI sedang membuat soal...</b>
        <p style="color:var(--mut);font-size:12.5px;margin-top:8px">Soal dibuat khusus untuk kamu, tunggu sebentar ya</p>
      </div>
      <div class="sk" style="width:90%"></div>
      <div class="sk" style="width:75%"></div>
      <div class="sk" style="width:85%"></div>
    </div>`;
}

function showKuisError(msg) {
  $('app').innerHTML = `
    <div class="card" style="text-align:center;padding:24px">
      <div style="font-size:48px">😅</div>
      <h2 style="margin:10px 0 6px">AI belum bisa membuat soal</h2>
      <p style="color:var(--mut);font-size:13px;line-height:1.6">${esc(msg)}</p>
      <div class="ket" style="text-align:left;margin-top:14px">
        <b>💡 Yang bisa dicoba:</b><br>
        1. Pastikan <code>GROQ_API_KEY</code> sudah diset di Vercel<br>
        2. Cek <code>/api/chat</code> di browser — harus muncul <code>{"status":"ok"}</code><br>
        3. Tunggu 1-2 menit, lalu coba lagi
      </div>
      <button class="go" onclick="render()">🔄 Coba Lagi</button>
    </div>`;
}

function renderKuis() {
  if (quiz.idx >= quiz.soal.length) return renderHasil();
  const s = quiz.soal[quiz.idx];
  const r = quiz.jawab[quiz.idx];
  const done = !!r;
  let body = '';

  if (s.tipe === 'pg') {
    body = s.opsi.map((o, i) => {
      let cls = 'opt';
      if (done) {
        if (i === s.jawab) cls += ' ok';
        else if (i === r.jwb) cls += ' no';
      }
      return `<button class="${cls}" ${done?'disabled':''} onclick="jwbPG(${i})"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`;
    }).join('');
    if (done) {
      body += `<div class="bahas">${r.benar ? '✅ <b>Benar!</b>' : `❌ <b>Belum tepat.</b> Jawaban benar: <b>${String.fromCharCode(65+s.jawab)}. ${esc(s.opsi[s.jawab])}</b>`}

${esc(s.bahas || '')}</div>`;
    }
  } else {
    if (!done) {
      body = `<textarea id="ansUraian" placeholder="Tulis jawabanmu..." style="width:100%"></textarea>
        <button class="go" onclick="jwbUraian()">Periksa Jawaban</button>`;
    } else {
      body = `<div class="bahas"><b>Jawabanmu:</b> ${esc(r.jwb)}

<b>Kunci:</b> ${esc(s.kunci)}

${esc(s.bahas || '')}</div>`;
    }
  }

  $('app').innerHTML = `
    <div class="card">
      <div class="bar"><i style="width:${(quiz.idx + (done?1:0)) / quiz.soal.length * 100}%"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:10px">
        <span>${esc(setup.mapel)} • Kelas ${setup.kelas}</span>
        <span>Soal ${quiz.idx+1} / ${quiz.soal.length}</span>
      </div>
      <div style="font-size:17px;font-weight:800;line-height:1.4;margin:16px 0">${esc(s.q)}</div>
      ${body}
      ${done ? `<button class="go" onclick="lanjutSoal()">${quiz.idx+1 === quiz.soal.length ? '🏁 Lihat Nilai' : 'Soal Berikutnya →'}</button>` : ''}
    </div>`;
}

function jwbPG(i) {
  const s = quiz.soal[quiz.idx];
  const benar = i === s.jawab;
  quiz.jawab[quiz.idx] = { jwb: i, benar };
  if (benar) { quiz.skor++; S.benar++; sfx('ok') } else sfx('no');
  S.soal++; save();
  renderKuis();
}

async function jwbUraian() {
  const el = $('ansUraian');
  const t = el?.value.trim();
  if (!t) return toast('Tulis jawaban dulu');
  const s = quiz.soal[quiz.idx];
  quiz.jawab[quiz.idx] = { jwb: t, benar: true }; // default benar, nanti bisa dinilai AI
  S.soal++; save();
  renderKuis();
}

function lanjutSoal() {
  quiz.idx++;
  if (quiz.idx >= quiz.soal.length) renderHasil();
  else renderKuis();
}

function renderHasil() {
  const total = quiz.soal.length;
  const nilai = Math.round((quiz.skor / total) * 100);
  const lulus = nilai >= setup.kkm;
  const xpDapat = quiz.skor * 15 + (lulus ? 30 : 0);
  const riwayatBaru = { tgl: today(), mapel: setup.mapel, nilai, benar: quiz.skor, total };
  S.riwayat.unshift(riwayatBaru);
  S.riwayat = S.riwayat.slice(0, 30);
  S.xp += xpDapat;
  save();
  pushLeaderboard();

  const reaksi = lulus
    ? ['🎉','🏆','🔥','⭐'].sort(()=>Math.random()-.5).slice(0,3)
    : ['💪','🌱','🤗'].sort(()=>Math.random()-.5).slice(0,3);

  $('app').innerHTML = `
    <div class="card" style="text-align:center;${lulus?'background:linear-gradient(160deg,rgba(99,102,241,.15),rgba(236,72,153,.15))':''}">
      <div style="font-size:60px">${nilai>=90?'🏆':lulus?'🥇':'🌱'}</div>
      <h2 style="margin:8px 0 4px">${lulus?'Selamat, Tuntas! 🎉':'Belum tuntas, tapi kamu keren!'}</h2>
      <div class="reaction">${reaksi.map((e,i)=>`<span style="animation-delay:${i*.2}s">${e}</span>`).join('')}</div>
      <div class="score">${nilai}</div>
      <p style="color:var(--mut);font-size:12.5px">Benar ${quiz.skor} dari ${total} soal</p>
      <p style="font-size:15px;margin-top:14px">⭐ <b>+${xpDapat} XP</b></p>
    </div>

    <div class="card">
      <b>🔑 Kunci Jawaban</b>
      ${quiz.soal.map((s,i) => {
        const r = quiz.jawab[i];
        if (s.tipe === 'pg') {
          return `<div style="padding:10px 0;border-bottom:1px solid var(--bd)">
            <div style="font-size:13px">${i+1}. Jawaban: <b>${String.fromCharCode(65+s.jawab)}</b> ${r?.benar?'✅':'❌'}</div>
            <div style="font-size:11.5px;color:var(--mut);margin-top:3px">${esc(s.q)}</div>
          </div>`;
        } else {
          return `<div style="padding:10px 0;border-bottom:1px solid var(--bd)">
            <div style="font-size:13px">${i+1}. Uraian</div>
            <div style="font-size:11.5px;color:var(--mut);margin-top:3px">Kunci: ${esc(s.kunci)}</div>
          </div>`;
        }
      }).join('')}
    </div>

    <button class="go" onclick="mulaiKuis()">🔄 Buat Soal Baru Lagi</button>
    <button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="render()">🏠 Kembali ke Menu</button>
  `;
}

/* ========== TUTOR ========== */
function pTutor() {
  const badge = aiStatus === 'ok' ? '<span class="ai-badge ai-ok">AI ONLINE</span>'
    : aiStatus === 'error' ? '<span class="ai-badge ai-err">AI OFFLINE</span>'
    : '<span class="ai-badge ai-wait">AI CHECKING</span>';
  return `
  <div class="card">
    <b style="font-size:15px">🤖 Tutor AI</b> ${badge}
    <p style="color:var(--mut);font-size:12.5px;margin:6px 0 12px">Tanya materi apa saja. AI akan menjelaskan.</p>
    <div class="chat" id="chatBox"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="chatIn" placeholder="Tanya apa saja..." onkeydown="if(event.key==='Enter')sendChat()" style="flex:1">
      <button class="go" style="width:auto;margin:0;padding:11px 16px" onclick="sendChat()">Kirim</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="ket" style="padding:6px 10px;cursor:pointer;font-size:11.5px" onclick="quickAsk('Jelaskan SPLDV')">SPLDV</button>
      <button class="ket" style="padding:6px 10px;cursor:pointer;font-size:11.5px" onclick="quickAsk('Apa itu fotosintesis?')">Fotosintesis</button>
      <button class="ket" style="padding:6px 10px;cursor:pointer;font-size:11.5px" onclick="quickAsk('Cara menghitung pecahan')">Pecahan</button>
      <button class="ket" style="padding:6px 10px;cursor:pointer;font-size:11.5px" onclick="quickAsk('Ringkasan proklamasi')">Proklamasi</button>
      <button class="ket" style="padding:6px 10px;cursor:pointer;font-size:11.5px" onclick="clearChat()">🗑️ Bersihkan</button>
    </div>
  </div>`;
}

function renderChat() {
  const b = $('chatBox');
  if (!b) return;
  if (!S.chatHistory.length) {
    S.chatHistory.push({ r: 'bot', t: `Halo ${S.nama}! 👋\n\nAku Tutor AI. Tanya apa saja tentang pelajaran, nanti aku jelaskan.` });
    save();
  }
  b.innerHTML = S.chatHistory.map(m => `<div class="bub ${m.r}">${esc(m.t)}</div>`).join('');
  b.scrollTop = b.scrollHeight;
}

function quickAsk(t) {
  const i = $('chatIn');
  if (i) i.value = t;
  sendChat();
}

async function sendChat() {
  const i = $('chatIn');
  const v = i?.value.trim();
  if (!v) return;
  i.value = '';
  S.chatHistory.push({ r: 'user', t: v });
  save();
  renderChat();
  sfx('klik');

  const b = $('chatBox');
  const typ = document.createElement('div');
  typ.className = 'typ';
  typ.innerHTML = '<i></i><i></i><i></i>';
  b.appendChild(typ);
  b.scrollTop = b.scrollHeight;

  try {
    const msgs = [
      { role: 'system', content: 'Kamu Tutor AI ramah untuk pelajar Indonesia. Jawab singkat, bahasa sederhana, tanpa markdown. Kalau soal hitungan, tunjukkan langkahnya.' },
      ...S.chatHistory.slice(-8).filter(m => m.r !== 'bot' || S.chatHistory.length <= 3).map(m => ({ role: m.r === 'bot' ? 'assistant' : 'user', content: m.t }))
    ];
    const text = await callAI(msgs);
    typ.remove();
    S.chatHistory.push({ r: 'bot', t: text });
    save();
    renderChat();
    S.xp += 2;
    save();
  } catch(e) {
    typ.remove();
    S.chatHistory.push({ r: 'bot', t: `Maaf, AI sedang tidak bisa dihubungi.\n\nError: ${e.message}\n\nCoba cek /api/chat di browser, atau pastikan GROQ_API_KEY sudah diset di Vercel.` });
    save();
    renderChat();
  }
}

function clearChat() {
  S.chatHistory = [];
  save();
  renderChat();
  toast('Chat dibersihkan');
}

/* ========== FLASHCARD (AI) ========== */
let flash = { deck: [], idx: 0, loading: false };

function pFlash() {
  return `
  <div class="card">
    <b style="font-size:15px">🧠 Flashcard</b>
    <p style="color:var(--mut);font-size:12.5px;margin:6px 0 12px">Kartu dibuat AI, klik untuk lihat jawaban.</p>
    <label style="margin-top:0">Pilih topik</label>
    <div class="grid">
      ${['Matematika','IPA','Bahasa Indonesia','Sejarah','Bahasa Inggris','Umum'].map(t=>`
        <button onclick="loadFlash('${t}')">${t}</button>
      `).join('')}
    </div>
    <div id="flashArea" style="margin-top:14px">
      <div class="ket" style="text-align:center;padding:20px">Pilih topik di atas untuk memuat kartu dari AI</div>
    </div>
  </div>`;
}

async function loadFlash(topik) {
  $('flashArea').innerHTML = `
    <div class="card" style="text-align:center;padding:24px">
      <div style="font-size:44px">🤖</div>
      <p style="color:var(--mut);font-size:13px;margin-top:8px">AI sedang membuat kartu tentang ${topik}...</p>
    </div>`;
  try {
    const data = await callAIJSON(`Buatkan 8 kartu flashcard (tanya-jawab) tentang topik "${topik}" untuk pelajar SMP/SMA Indonesia. Bahasa Indonesia.

Balas HANYA JSON:
{"kartu":[{"q":"pertanyaan","a":"jawaban singkat 1-3 kalimat"}]}`,
      'Kamu pembuat flashcard belajar. Selalu balas JSON valid.');
    const kartu = (data.kartu || []).filter(k => k.q && k.a);
    if (!kartu.length) throw new Error('Tidak ada kartu');
    flash = { deck: kartu, idx: 0, loading: false };
    renderFlash();
  } catch(e) {
    $('flashArea').innerHTML = `<div class="card" style="text-align:center;padding:24px">
      <div style="font-size:44px">😅</div>
      <p style="color:var(--mut);font-size:13px;margin-top:8px">Gagal memuat: ${esc(e.message)}</p>
    </div>`;
  }
}

function renderFlash() {
  const k = flash.deck[flash.idx];
  $('flashArea').innerHTML = `
    <div class="card" style="min-height:200px;text-align:center;padding:30px 20px;position:relative">
      <div style="font-size:11px;color:var(--mut);position:absolute;top:12px;left:16px">${flash.idx+1} / ${flash.deck.length}</div>
      <div id="flashContent" style="display:flex;flex-direction:column;justify-content:center;min-height:160px">
        <div style="font-size:17px;font-weight:800;line-height:1.4">${esc(k.q)}</div>
        <button class="go" style="margin-top:20px" onclick="flipFlash()">👁️ Lihat Jawaban</button>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="flashPrev()">← Sebelumnya</button>
      <button class="go" onclick="flashNext()">Berikutnya →</button>
    </div>`;
}

function flipFlash() {
  const k = flash.deck[flash.idx];
  $('flashContent').innerHTML = `
    <div style="font-size:17px;font-weight:800;line-height:1.4;color:var(--pr)">${esc(k.a)}</div>
    <div style="font-size:12px;color:var(--mut);margin-top:12px;line-height:1.5">${esc(k.q)}</div>`;
  S.xp += 1;
  save();
}

function flashNext() {
  flash.idx = (flash.idx + 1) % flash.deck.length;
  renderFlash();
}
function flashPrev() {
  flash.idx = (flash.idx - 1 + flash.deck.length) % flash.deck.length;
  renderFlash();
}

/* ========== NILAI ========== */
function pNilai() {
  const akurasi = S.soal ? Math.round(S.benar / S.soal * 100) : 0;
  const lvl = lvlOf(S.xp);
  const xpNow = xpIn(S.xp);
  return `
  <div class="card" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:34px">🦊</div>
      <div style="flex:1;min-width:0">
        <h2 style="margin:0;font-size:18px">${esc(S.nama)}</h2>
        <p style="margin:4px 0 0;font-size:12px;opacity:.9">Level ${lvl} • ${S.xp} XP</p>
      </div>
    </div>
    <div class="bar" style="background:rgba(255,255,255,.25);margin-top:14px"><i style="background:#fff;width:${xpNow}%"></i></div>
    <p style="margin:6px 0 0;font-size:11px;opacity:.9">Menuju Level ${lvl+1} — ${xpNow}/100 XP</p>
  </div>

  <div class="st">
    <div><span class="e">📝</span>${S.soal} soal</div>
    <div><span class="e">✅</span>${S.benar} benar</div>
    <div><span class="e">📈</span>${akurasi}%</div>
  </div>

  <div class="card" style="margin-top:12px">
    <b>📊 Riwayat Kuis</b>
    ${S.riwayat.length === 0
      ? '<p style="color:var(--mut);font-size:12.5px;margin-top:8px">Belum ada riwayat. Ayo mulai kuis!</p>'
      : S.riwayat.slice(0,10).map(r=>`
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px">
          <div>${esc(r.mapel)} <span style="color:var(--mut);font-size:11.5px">${r.tgl}</span></div>
          <b style="color:${r.nilai >= setup.kkm ? 'var(--ok)' : 'var(--mut)'}">${r.nilai}</b>
        </div>`).join('')}
  </div>

  <div class="card">
    <label style="margin-top:0">✏️ Ganti Nama</label>
    <input id="inNama" value="${esc(S.nama)}" placeholder="Nama kamu">
    <button class="go" onclick="ubahNama()">💾 Simpan Nama</button>
  </div>

  <div class="card">
    <b>⭐ Rating Aplikasi</b>
    <div class="stars">
      ${[1,2,3,4,5].map(i=>`<span class="${i<=S.myRating?'on':''}" onclick="setRating(${i})">⭐</span>`).join('')}
    </div>
    <button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="openKomentar()">💬 Beri Komentar untuk Admin</button>
  </div>`;
}

function ubahNama() {
  const n = $('inNama').value.trim();
  if (!n) return toast('Nama tidak boleh kosong');
  S.nama = n;
  save();
  pushLeaderboard();
  render();
  toast('✅ Nama tersimpan');
}

function setRating(v) {
  S.myRating = v;
  save();
  render();
  toast('⭐ Terima kasih rating ' + v + ' bintang!');
}

function openKomentar() {
  openModal(`
    <h2>💬 Komentar untuk Admin</h2>
    <p style="color:var(--mut);font-size:12.5px;margin-bottom:10px">Saran, kritik, atau ide fitur baru.</p>
    <textarea id="komentarTxt" placeholder="Contoh: Tambah fitur latihan bahasa daerah"></textarea>
    <button class="go" onclick="kirimKomentar()">Kirim</button>
    <div style="margin-top:14px">
      <b style="font-size:13px">Komentar sebelumnya:</b>
      ${(S.comments||[]).length === 0
        ? '<p style="color:var(--mut);font-size:12px">Belum ada komentar.</p>'
        : S.comments.map(c=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd);font-size:12.5px">
            <b>${esc(c.nama)}</b> <span style="color:var(--mut);font-size:11px">${c.tgl}</span>
            <p style="margin:3px 0 0">${esc(c.isi)}</p>
          </div>`).join('')}
    </div>`);
}

function kirimKomentar() {
  const t = $('komentarTxt')?.value.trim();
  if (!t) return toast('Tulis dulu komentarnya');
  if (!S.comments) S.comments = [];
  S.comments.push({ nama: S.nama, isi: t, tgl: today() });
  save();
  closeModal();
  toast('💬 Terkirim, terima kasih!');
  S.xp += 3;
  save();
}

/* ========== PERINGKAT (Leaderboard) ========== */
async function loadLeaderboard() {
  const el = $('lbContent');
  if (!el) return;
  el.innerHTML = '<div class="sk" style="height:44px"></div><div class="sk" style="height:44px"></div><div class="sk" style="height:44px"></div>';

  // Kalau tidak ada Firebase, tampilkan leaderboard lokal
  if (!db) {
    el.innerHTML = `
      <div class="ket">
        🔌 <b>Mode Lokal</b><br>
        Leaderboard lintas user belum aktif karena Firebase belum dikonfigurasi. Kamu tetap bisa lihat XP kamu sendiri.
      </div>
      ${renderLocalLeaderboard()}
    `;
    return;
  }

  try {
    const snap = await db.collection('leaderboard').orderBy('xp','desc').limit(20).get();
    const rows = snap.docs.map(d => d.data());
    el.innerHTML = renderLB(rows);
  } catch(e) {
    el.innerHTML = `<div class="ket">Gagal memuat leaderboard: ${esc(e.message)}</div>${renderLocalLeaderboard()}`;
  }
}

function renderLocalLeaderboard() {
  return `
    <div class="lbrow me">
      <div class="lbr">1</div>
      <div class="lba">${S.avatar}</div>
      <div class="lbb"><b>${esc(S.nama)} (Kamu)</b><small>Level ${lvlOf(S.xp)}</small></div>
      <div class="lbp">${S.xp} XP</div>
    </div>`;
}

function renderLB(rows) {
  const medali = ['🥇','🥈','🥉'];
  if (!rows.length) return '<div class="ket">Belum ada data. Jadilah yang pertama!</div>';
  return rows.map((r, i) => {
    const me = r.nama === S.nama;
    return `<div class="lbrow ${me?'me':''}">
      <div class="lbr">${i<3?medali[i]:(i+1)}</div>
      <div class="lba">${r.avatar||'🦊'}</div>
      <div class="lbb"><b>${esc(r.nama)}${me?' (Kamu)':''}</b><small>Level ${r.level||1}</small></div>
      <div class="lbp">${r.xp||0} XP</div>
    </div>`;
  }).join('');
}

function pPeringkat() {
  return `
  <div class="card">
    <b style="font-size:15px">🏆 Peringkat</b>
    <p style="color:var(--mut);font-size:12.5px;margin:6px 0 12px">Daftar berdasarkan XP dari semua pengguna.</p>
    <div id="lbContent"></div>
    <button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd);margin-top:12px" onclick="loadLeaderboard()">🔄 Refresh</button>
  </div>`;
}

/* ========== INIT ========== */
function init() {
  if (!S.nama) {
    openModal(`
      <h2>👋 Selamat Datang!</h2>
      <p style="color:var(--mut);font-size:13px;margin-bottom:12px">Masukkan nama kamu untuk mulai belajar.</p>
      <input id="namaAwal" placeholder="Nama atau panggilan" maxlength="20">
      <button class="go" onclick="simpanNamaAwal()">Mulai Belajar 🚀</button>
      <p style="color:var(--mut);font-size:11px;margin-top:10px;text-align:center">Nama ini muncul di peringkat, jadi pilih yang kamu suka.</p>
    `);
  }

  // Update streak
  const t = today();
  if (S.lastActive !== t) {
    const km = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    if (S.lastActive === km) S.streak++;
    else if (S.lastActive) S.streak = 1;
    S.lastActive = t;
    save();
  }

  // Cek status AI
  checkAIStatus();

  render();
  updateKelas();
}

function simpanNamaAwal() {
  const n = $('namaAwal')?.value.trim();
  if (!n) return toast('Isi nama dulu');
  S.nama = n;
  save();
  pushLeaderboard();
  closeModal();
  toast('Halo, ' + n + '! 👋');
  render();
}

async function checkAIStatus() {
  try {
    const r = await fetch(AI_ENDPOINT);
    const d = await r.json();
    if (d.status === 'ok' && d.hasKey) aiStatus = 'ok';
    else aiStatus = 'error';
  } catch(e) {
    aiStatus = 'error';
  }
  if (S.tab === 'tutor') renderChat();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
