<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rajin Belajar Jadi Pintar</title>
<style>
:root{--bg:#0f1117;--cd:#1a1d29;--cd2:#232838;--tx:#e8ecf5;--mu:#9aa6bf;--pr:#6366f1;--pr2:#8b5cf6;--ok:#16a34a;--no:#dc2626;--bd:#2b3145}
html[data-theme=light]{--bg:#f5f7fb;--cd:#fff;--cd2:#eef2f9;--tx:#1b2433;--mu:#64708a;--bd:#dde3ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:14px 14px 90px}
.hero{border-radius:18px;padding:18px;margin-bottom:14px;background:linear-gradient(135deg,#6366f1,#ec4899 60%,#f59e0b);color:#fff}
.hero h1{margin:0 0 4px;font-size:20px}
.hero p{margin:0;font-size:12.5px;opacity:.95}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:11px;transition:.15s}
button.sel{background:var(--pr);color:#fff;border-color:var(--pr)}
button:disabled{opacity:.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;padding:11px 16px}
.btn-p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0}
.btn-b{width:100%;text-align:center}
.btn-lg{padding:14px 20px;font-size:14.5px}
.btn-sm{padding:8px 11px;font-size:11.5px}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
input,textarea,select{width:100%;padding:11px;border-radius:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:0;font-size:14px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;margin-bottom:10px}
.tabs button{padding:7px 2px;font-size:9.5px;text-align:center;background:var(--cd);color:var(--mu)}
.tabs button span{display:block;font-size:19px;margin-bottom:2px}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.opt{display:block;width:100%;margin-bottom:8px;text-align:left;font-size:14px;padding:14px 16px;position:relative}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15);color:#4ade80;font-weight:700}
.opt.no{border-color:var(--no);background:rgba(220,38,38,.1);color:#fca5a5}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:9px;transition:width .5s}
.chip{display:inline-flex;padding:4px 9px;border-radius:8px;font-size:10.5px;font-weight:800;background:rgba(99,102,241,.15);color:#a5b4fc}
.chat{height:340px;overflow-y:auto;background:var(--bg);border-radius:14px;padding:12px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.bub{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bub.b{background:var(--cd);border:1px solid var(--bd);border-bottom-left-radius:4px;align-self:flex-start}
.bub.u{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st div{background:var(--cd2);border-radius:12px;padding:11px 4px;text-align:center;font-size:11px}
.st .e{font-size:24px;display:block}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);background:#25263a;color:#fff;padding:11px 18px;border-radius:12px;z-index:9999;display:none;font-size:12.5px;font-weight:700;max-width:90vw;text-align:center;opacity:0;transition:.3s}
.toast.sh{display:block;transform:translateX(-50%) translateY(0);opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal.sh{display:flex}
.mbox{background:var(--cd);width:min(520px,100%);border-radius:18px;padding:20px;max-height:88vh;overflow:auto;border:1px solid var(--bd)}
.mclose{float:right;background:var(--bd);color:var(--tx);width:32px;height:32px;border-radius:9px;font-weight:900;border:0;padding:0}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:950;align-items:flex-end;justify-content:center}
.ov.sh{display:flex}
.ovb{background:var(--cd);width:min(620px,100%);border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow-y:auto}
.ovh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ovh h3{margin:0;font-size:17px}
.err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.35);color:#fca5a5;padding:10px 13px;border-radius:10px;font-size:12.5px;margin-bottom:12px;display:none}
.at{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.at button{padding:11px;font-size:13px;font-weight:700;color:var(--mu)}
.at button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:var(--pr)}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.avg button{padding:8px 0;text-align:center;font-size:22px}
.avg button.sel{background:var(--pr);border-color:var(--pr)}
.ket{background:var(--bg);border-radius:11px;padding:11px;font-size:12px;line-height:1.65;border:1px solid var(--bd);color:var(--mu)}
.ket b{color:var(--tx)}
.credit{text-align:center;padding:24px 0 8px;color:var(--mu);font-size:11.5px;line-height:1.7}
.credit b{color:var(--pr)}
.pr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pr button{padding:6px 11px;border-radius:8px;font-size:11.5px;background:var(--cd2);border:1px solid var(--bd);font-weight:600}
.qr{position:fixed;inset:0;background:linear-gradient(180deg,#0a0c12,#0f1117);z-index:900;overflow-y:auto}
html[data-theme=light] .qr{background:linear-gradient(180deg,#eef1f8,#f5f7fb)}
.qh{padding:14px 16px;background:rgba(99,102,241,.12);border-bottom:1px solid rgba(99,102,241,.25);position:sticky;top:0;z-index:2}
.qt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.qc{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.qx{background:rgba(255,255,255,.12);border:0;color:var(--tx);padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700}
.qp{height:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.qp i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);border-radius:9px;transition:width .5s}
.qb{padding:20px 16px 120px;max-width:600px;margin:0 auto}
.qn{font-size:72px;font-weight:900;line-height:1;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-4px}
.qn span{font-size:32px;color:var(--mu);-webkit-text-fill-color:var(--mu)}
.qq{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:22px;margin-top:14px}
.qqt{font-size:17px;font-weight:800;line-height:1.55;margin:0 0 18px}
.qtools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.qtools button{padding:9px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--cd2);font-size:12px;font-weight:700}
.qnav{position:fixed;bottom:0;left:0;right:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(15,17,23,.94);border-top:1px solid var(--bd);z-index:3}
html[data-theme=light] .qnav{background:rgba(245,247,251,.94)}
.qni{max-width:600px;margin:0 auto}
.qnav button{width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:800;text-align:center;border:0;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.bh{font-size:13px;line-height:1.75;background:var(--bg);border-radius:12px;padding:14px;margin-top:14px;white-space:pre-wrap;border:1px solid var(--bd)}
.bh-ok{border-color:rgba(22,163,74,.5);background:rgba(22,163,74,.06)}
.bh-no{border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.06)}
.bh-t{font-weight:800;font-size:15px;margin-bottom:8px}
.sco{font-size:64px;font-weight:900;text-align:center;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.rx{display:flex;justify-content:center;gap:12px;font-size:38px;margin:10px 0}
.rx span{animation:pp .8s ease backwards}
@keyframes pp{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.cd{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:right;font-size:24px;font-weight:800;min-height:64px;word-break:break-all}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.cg button{padding:17px 0;border-radius:12px;background:var(--cd2);border:1px solid var(--bd);font-weight:800;font-size:16px;color:var(--tx)}
.cg button.op{background:rgba(99,102,241,.15);color:var(--pr)}
.cg button.eq{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;grid-column:span 2}
canvas.sk{width:100%;height:320px;border:1px solid var(--bd);border-radius:12px;background:#fff;touch-action:none;display:block}
.skt{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.skt button{padding:11px 0;text-align:center;border-radius:11px;background:var(--cd2);border:1px solid var(--bd);font-size:15px}
.skt button.sel{border-color:var(--pr);background:rgba(99,102,241,.2)}
.lb{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.lb:last-child{border-bottom:0}
.lb.me{background:rgba(99,102,241,.14);border-radius:11px;padding:10px 12px;border:0;margin-bottom:5px}
.lbr{width:28px;font-weight:900;text-align:center;color:var(--mu);font-size:12.5px}
.lba{width:36px;height:36px;border-radius:11px;background:rgba(99,102,241,.15);display:grid;place-items:center;font-size:18px}
.lbi{flex:1;min-width:0}
.lbi b{font-size:13px;display:block}
.lbi small{color:var(--mu);font-size:10.5px}
.lbx{font-weight:900;color:var(--pr);font-size:13px}
.skl{background:linear-gradient(90deg,var(--bd),rgba(99,102,241,.1),var(--bd));background-size:200% 100%;animation:skl 1.4s infinite;border-radius:9px;height:14px;margin:6px 0}
@keyframes skl{to{background-position:-200% 0}}
@media(max-width:400px){.qn{font-size:60px}.qn span{font-size:26px}.tabs button span{font-size:17px}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="mbox"><button class="mclose" onclick="closeModal()">X</button><div id="modalContent"></div></div></div>
<div id="ov" class="ov"><div class="ovb" id="ovContent"></div></div>

<script>
var AI='/api/chat',AU='/api/auth',LB='/api/leaderboard',KEY='rbjp_v11';
var S={nama:'',password:'',avatar:'A',xp:0,coins:20,streak:0,soal:0,benar:0,menitFokus:0,riwayat:[],chatHistory:[],tab:'belajar',theme:'dark',lastActive:'',myRating:0};
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in o)if(o.hasOwnProperty(k))S[k]=o[k]}}catch(e){}
function saveS(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function $i(id){return document.getElementById(id)}
function esc(s){if(s==null)s='';return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lv(x){return Math.floor(x/100)+1}
function xin(x){return x%100}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}

function toast(m){var t=$i('toast');t.textContent=m;t.classList.add('sh');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('sh')},2400)}
function openModal(h){$i('modalContent').innerHTML=h;$i('modal').classList.add('sh')}
function closeModal(){$i('modal').classList.remove('sh')}
function openOv(h){$i('ovContent').innerHTML=h;$i('ov').classList.add('sh')}
function closeOv(){$i('ov').classList.remove('sh')}

var aCtx=null;
function sfx(t){
  if(!S.sound)return;
  try{
    aCtx=aCtx||new (window.AudioContext||window.webkitAudioContext)();
    var C=aCtx,ns,w,d;
    if(t==='ok'){ns=[523.25,659.25,783.99,1046.5];w='sine';d=.35}
    else if(t==='no'){ns=[400,300,200];w='sawtooth';d=.25}
    else if(t==='up'){ns=[659.25,880,1108.73,1318.51];w='triangle';d=.5}
    else{ns=[520];w='sine';d=.08}
    for(var i=0;i<ns.length;i++){
      (function(f,idx){
        var o=C.createOscillator(),g=C.createGain();
        o.connect(g);g.connect(C.destination);
        o.type=w;o.frequency.value=f;
        var tt=C.currentTime+idx*.08;
        g.gain.setValueAtTime(0,tt);
        g.gain.linearRampToValueAtTime(.15,tt+.01);
        g.gain.exponentialRampToValueAtTime(.001,tt+d);
        o.start(tt);o.stop(tt+d+.05);
      })(ns[i],i);
    }
  }catch(e){}
}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme)}
applyTheme();

/* API */
function apiA(a,p){
  var b={action:a};for(var k in p)if(p.hasOwnProperty(k))b[k]=p[k];
  return fetch(AU,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Gagal');return d})});
}
function apiL(){return fetch(LB).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw new Error(d.error||'Gagal');return d.rows||[]})}
function sync(){
  if(!S.nama||!S.password)return;
  apiA('update',{nama:S.nama,password:S.password,stats:{xp:S.xp,coins:S.coins,streak:S.streak,soal:S.soal,benar:S.benar,menitFokus:S.menitFokus,avatar:S.avatar,lastActive:S.lastActive}}).catch(function(){});
}
var sT;function sch(){clearTimeout(sT);sT=setTimeout(sync,1500)}

function ai(m){
  return fetch(AI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:m})}).then(function(r){return r.json().then(function(d){
    if(!r.ok)throw new Error(d.error||'AI error');
    var t='';
    if(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)t=d.choices[0].message.content;
    else if(d.text)t=d.text;
    if(!t)throw new Error('AI tidak merespons');
    return t;
  })});
}
function aiJ(p,s){
  var m=[];if(s)m.push({role:'system',content:s});m.push({role:'user',content:p});
  return ai(m).then(function(t){
    var a=t.indexOf('{'),b=t.lastIndexOf('}');
    if(a<0||b<a)throw new Error('AI tidak mengembalikan JSON');
    return JSON.parse(t.slice(a,b+1));
  });
}

/* AUTH */
var authM='login',pickedAv='A';
var AV=['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q','R'];
var AVE=['\uD83E\uDD8A','\uD83D\uDC3C','\uD83D\uDC2F','\uD83D\uDC30','\uD83D\uDC28','\uD83D\uDC38','\uD83D\uDC3A','\uD83D\uDC31','\uD83E\uDD81','\uD83D\uDC35','\uD83E\uDD89','\uD83D\uDC27','\uD83D\uDC22','\uD83E\uDD84','\uD83D\uDC32','\uD83D\uDE80','\uD83D\uDC51','\u2B50','\uD83C\uDF93','\uD83E\uDDE0'];

function pAuth(){
  var h='';
  h+='<div class="hero"><h1>\uD83D\uDCDA Rajin Belajar</h1><p>Belajar seru, naik level tiap hari</p></div>';
  h+='<div class="card">';
  h+='<div class="at">';
  h+='<button class="'+(authM==='login'?'on':'')+'" onclick="setAM(\'login\')">Masuk</button>';
  h+='<button class="'+(authM==='register'?'on':'')+'" onclick="setAM(\'register\')">Daftar Baru</button>';
  h+='</div>';
  h+='<div class="err" id="aErr"></div>';
  h+='<label style="margin-top:0">Nama</label>';
  h+='<input id="iNama" placeholder="Nama atau panggilan" maxlength="20" autocomplete="username">';
  h+='<label>Password</label>';
  h+='<input id="iPw" type="password" placeholder="Minimal 4 karakter">';
  if(authM==='register'){
    h+='<label>Konfirmasi Password</label><input id="iPw2" type="password" placeholder="Ulangi password">';
    h+='<label>Pilih Avatar</label><div class="avg">';
    for(var i=0;i<AVE.length;i++){
      h+='<button class="'+(AVE[i]===pickedAv?'sel':'')+'" onclick="pAv(\''+AVE[i]+'\')">'+AVE[i]+'</button>';
    }
    h+='</div>';
  }
  h+='<button class="btn btn-p btn-b btn-lg" id="aBtn" style="margin-top:16px" onclick="submitAuth()">'+(authM==='login'?'\uD83D\uDD13 Masuk':'\u2728 Daftar Sekarang')+'</button>';
  h+='<p style="color:var(--mu);font-size:11px;text-align:center;margin-top:14px">Password di-hash dengan aman. Nama akan muncul di peringkat.</p>';
  h+='</div>';
  h+='<div class="credit">Dibuat dengan \u2764\uFE0F by <b>Pandana</b></div>';
  return h;
}
function setAM(m){authM=m;render()}
function pAv(a){pickedAv=a;render()}
function submitAuth(){
  var n=$i('iNama').value.trim(),p=$i('iPw').value,p2=authM==='register'?$i('iPw2').value:p;
  var er=$i('aErr');
  function se(m){er.textContent=m;er.style.display='block'}
  er.style.display='none';
  if(n.length<3)return se('Nama minimal 3 karakter');
  if(p.length<4)return se('Password minimal 4 karakter');
  if(authM==='register'&&p!==p2)return se('Konfirmasi password tidak sama');
  var b=$i('aBtn');b.disabled=true;b.textContent='Tunggu...';
  var pl={nama:n,password:p};
  if(authM==='register')pl.avatar=pickedAv;
  apiA(authM,pl).then(function(res){
    for(var k in res.user)if(res.user.hasOwnProperty(k))S[k]=res.user[k];
    S.password=p;S.tab='belajar';S.chatHistory=[];S.lastActive=today();
    saveS();
    toast(authM==='login'?'\uD83D\uDC4B Halo, '+S.nama+'!':'\uD83C\uDF89 Selamat datang!');
    sfx('up');render();
  }).catch(function(e){
    se(e.message);b.disabled=false;b.textContent=authM==='login'?'Masuk':'Daftar';
  });
}
function logout(){if(!confirm('Keluar dari akun?'))return;S.nama='';S.password='';S.chatHistory=[];saveS();authM='login';render();toast('Sampai jumpa!')}

/* DATA */
var UM=[
  ['Matematika','\uD83D\uDD22'],['IPA','\uD83D\uDD2C'],['IPS','\uD83C\uDF0F'],
  ['B. Indonesia','\uD83D\uDCD6'],['B. Inggris','\uD83D\uDD24'],['Informatika','\uD83D\uDCBB'],
  ['PPKn','\uD83C\uDDEE\uD83C\uDDE9'],['Seni','\uD83C\uDFA8'],['Agama','\uD83D\uDD4C'],['Penjaskes','\u26BD']
];
var ML=[
  ['B. Sasak','\uD83C\uDFDD\uFE0F'],['B. Jawa','\uD83C\uDFEF'],['B. Sunda','\uD83C\uDF8B'],
  ['B. Bali','\uD83C\uDF3A'],['B. Madura','\uD83D\uDC02'],['B. Minangkabau','\uD83C\uDFE0'],
  ['B. Bugis','\u26F5'],['B. Banjar','\uD83D\uDEF6'],['B. Aceh','\uD83D\uDD4C'],['B. Batak','\uD83C\uDF0B']
];
var MK=[

function mKuis(isKh,sp){
  var j=set.n,pg=Math.ceil(j*.6);
  var jenis=set.t==='pg'?j+' soal pilihan ganda':set.t==='uraian'?j+' soal uraian':j+' soal campuran ('+pg+' PG, '+(j-pg)+' uraian)';
  var prompt='Buatkan '+jenis+' '+set.m+' untuk siswa '+set.j+' kelas '+set.k+' Indonesia (Kurikulum Merdeka). Bahasa Indonesia.';
  if(set.kisi)prompt+=' Fokus: '+set.kisi+'.';
  prompt+='\n\nBalas HANYA JSON valid:\n{"soal":[{"tipe":"pg","q":"pertanyaan","opsi":["a","b","c","d"],"jawab":0,"bahas":"penjelasan 3-5 kalimat"},{"tipe":"uraian","q":"pertanyaan","kunci":"jawaban","bahas":"penjelasan"}]}\n\nAturan: PG opsi 4 tanpa awalan huruf, jawab=indeks 0-3.';

  Q={soal:[],idx:0,jawab:[],skor:0,kh:isKh?sp:null};
  showQR(loadHTML());

  aiJ(prompt,'Kamu pembuat soal pelajar Indonesia. JSON valid saja.').then(function(d){
    var list=[],raw=d.soal||[];
    for(var i=0;i<raw.length;i++){
      var s=raw[i];
      if(!s.q)continue;
      var tp=s.tipe||'pg';
      if(tp==='uraian'){
        if(!s.kunci)continue;
        list.push({tipe:'uraian',q:s.q,kunci:s.kunci,bahas:s.bahas||''});
      }else{
        if(!Array.isArray(s.opsi)||s.opsi.length!==4)continue;
        if(typeof s.jawab!=='number')continue;
        var op=[];
        for(var x=0;x<4;x++)op.push(String(s.opsi[x]).replace(/^\s*[a-dA-D][\.\)]\s+/,''));
        list.push({tipe:'pg',q:s.q,opsi:op,jawab:s.jawab,bahas:s.bahas||''});
      }
    }
    if(!list.length)throw new Error('AI tidak menghasilkan soal valid');
    Q.soal=list;
    rQR();
  }).catch(function(e){showQR(errHTML(e.message))});
}

  rQR();

function jUra(){

function ljt(){Q.idx++;if(Q.idx>=Q.soal.length)rHasil();else{rQR();window.scrollTo(0,0)}}
function baca(){
  var s=Q.soal[Q.idx];

  var t=s.q;
  if(s.tipe==='pg')for(var i=0;i<s.opsi.length;i++)t+='. '+String.fromCharCode(65+i)+'. '+s.opsi[i];

  u.lang='id-ID';u.rate=.95;
  speechSynthesis.speak(u);
  toast('\uD83D\uDD0A Membacakan...');
}

/* KALKULATOR */
var CK=['C','DEL','(',')','7','8','9','/','4','5','6','x','1','2','3','-','0','.','^','+','sqrt('];
function openCalc(){
  var h='';
  h+='<div class="ovh"><h3>\uD83E\uDDEE Kalkulator</h3><button class="mclose" style="float:none" onclick="closeOv()">X</button></div>';
  h+='<div class="cd" id="cd">'+(cEx||'0')+'</div>';
  h+='<div class="cg">';
  for(var i=0;i<CK.length;i++){
    var k=CK[i],isOp=['/','x','-','+','^','sqrt('].indexOf(k)>=0;
    var d=k==='DEL'?'\u232B':(k==='sqrt('?'\u221A':k);
    h+='<button class="'+(isOp?'op':'')+'" onclick="ck(\''+k+'\')">'+d+'</button>';
  }
  h+='<button class="eq" onclick="ck(\'=\')">=</button>';
  h+='</div>';
  openOv(h);
}
function ck(k){
  if(cEx==='Error')cEx='';
  if(k==='C')cEx='';
  else if(k==='DEL')cEx=cEx.slice(0,-1);
  else if(k==='='){try{cEx=String(Math.round(ev(cEx)*1e9)/1e9)}catch(e){cEx='Error'}}
  else if(k==='sqrt(')cEx+='sqrt(';
  else cEx+=k;
  var d=$i('cd');if(d)d.textContent=cEx||'0';
}
function ev(s){
  s=s.replace(/x/g,'*').replace(/sqrt\(/g,'Math.sqrt(').replace(/\^/g,'**');
  var i=0;
  function ex(){var v=tm();while(s[i]==='+'||s[i]==='-'){var o=s[i++];var y=tm();v=o==='+'?v+y:v-y}return v}
  function tm(){var v=pw();while(s[i]==='*'||s[i]==='/'){var o=s[i++];var y=pw();v=o==='*'?v*y:v/y}return v}
  function pw(){var b=un();if(s[i]==='*'&&s[i+1]==='*'){i+=2;return Math.pow(b,pw())}return b}
  function un(){if(s[i]==='-'){i++;return -un()}return at()}
  function at(){
    if(s[i]==='('){i++;var v=ex();if(s[i]!==')')throw new Error('x');i++;return v}
    if(s.slice(i).indexOf('Math.sqrt(')===0){i+=10;var v2=ex();if(s[i]!==')')throw new Error('x');i++;return Math.sqrt(v2)}
    var m=/^\d*\.?\d+/.exec(s.slice(i));
    if(!m)throw new Error('x');
    i+=m[0].length;return parseFloat(m[0]);
  }
  var v=ex();
  if(i<s.length||!isFinite(v))throw new Error('x');
  return v;
}

/* SKETSA */
var sk={c:'#111',s:3,d:false,lx:0,ly:0};
function openSk(){
  var h='';
  h+='<div class="ovh"><h3>\u270F\uFE0F Sketsa</h3><button class="mclose" style="float:none" onclick="closeOv()">X</button></div>';
  h+='<canvas id="skC" class="sk" width="700" height="400"></canvas>';
  h+='<div class="skt">';
  var cs=['#111','#dc2626','#2563eb','#16a34a','#f59e0b','#ec4899','#fff'];
  for(var i=0;i<cs.length;i++)h+='<button onclick="setSkC(\''+cs[i]+'\')" data-c="'+cs[i]+'" class="'+(sk.c===cs[i]?'sel':'')+'">'+(cs[i]==='#fff'?'\uD83E\uDDF9':'\u25CF')+'</button>';
  h+='<button onclick="skClr()">\uD83D\uDDD1\uFE0F</button>';
  h+='</div>';
  h+='<div class="g4" style="margin-top:8px">';
  var szs=[2,4,6,10];
  for(var j=0;j<szs.length;j++)h+='<button class="btn btn-sm '+(sk.s===szs[j]?'sel':'')+'" onclick="sk.s='+szs[j]+';openSk()">Tebal '+szs[j]+'</button>';
  h+='</div>';
  openOv(h);
  setTimeout(skInit,60);
}
function setSkC(c){
  sk.c=c;
  var bs=document.querySelectorAll('.skt button');
  for(var i=0;i<bs.length;i++)if(bs[i].getAttribute('data-c'))bs[i].classList.toggle('sel',bs[i].getAttribute('data-c')===c);
}
function skInit(){
  var c=$i('skC');if(!c)return;
  var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.lineCap='round';x.lineJoin='round';
  function gp(e){var r=c.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}}
  function st(e){e.preventDefault();sk.d=true;var p=gp(e);sk.lx=p.x;sk.ly=p.y}
  function mv(e){if(!sk.d)return;e.preventDefault();var p=gp(e);x.strokeStyle=sk.c;x.lineWidth=sk.s;x.beginPath();x.moveTo(sk.lx,sk.ly);x.lineTo(p.x,p.y);x.stroke();sk.lx=p.x;sk.ly=p.y}
  function en(){sk.d=false}
  c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);c.addEventListener('mouseup',en);c.addEventListener('mouseleave',en);
  c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en);
}
function skClr(){var c=$i('skC');if(!c)return;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);toast('\uD83D\uDDD1\uFE0F Dibersihkan')}

function rChat(){
  var b=$i('cB');if(!b)return;
  if(!S.chatHistory.length){
    S.chatHistory.push({r:'b',t:'Halo '+S.nama+'! \uD83D\uDC4B\n\nTanya apa saja tentang pelajaran.\n\nContoh:\n\u2022 "Jelaskan SPLDV"\n\u2022 "Apa itu fotosintesis?"\n\u2022 "Cara menghitung pecahan"'});
    saveS();
  }
  var h='';
  for(var i=0;i<S.chatHistory.length;i++){
    var m=S.chatHistory[i];
    h+='<div class="bub '+m.r+'">'+esc(m.t)+'</div>';
  }
  b.innerHTML=h;
  b.scrollTop=b.scrollHeight;
}
function qAsk(t){var i=$i('cI');if(i)i.value=t;sChat()}
function sChat(){
  var i=$i('cI');var v=i?i.value.trim():'';
  if(!v)return;
  i.value='';
  S.chatHistory.push({r:'u',t:v});saveS();rChat();
  var b=$i('cB');
  var ty=document.createElement('div');
  ty.className='bub b';ty.textContent='...';
  b.appendChild(ty);b.scrollTop=b.scrollHeight;
  var msgs=[{role:'system',content:'Kamu Tutor AI ramah untuk pelajar Indonesia. Jawab singkat, bahasa sederhana.'}];
  var st=Math.max(0,S.chatHistory.length-8);
  for(var k=st;k<S.chatHistory.length;k++){
    var m=S.chatHistory[k];
    msgs.push({role:m.r==='b'?'assistant':'user',content:m.t});
  }
  ai(msgs).then(function(t){
    if(ty.parentNode)ty.parentNode.removeChild(ty);
    S.chatHistory.push({r:'b',t:t});
    S.xp+=2;saveS();sch();rChat();
  }).catch(function(e){
    if(ty.parentNode)ty.parentNode.removeChild(ty);
    S.chatHistory.push({r:'b',t:'Maaf, AI error.\n\n'+e.message});
    saveS();rChat();
  });
}
function clrChat(){S.chatHistory=[];saveS();rChat();toast('Chat dibersihkan')}
